# The single source of truth for this repo's Rust version.
#
# Read by: cargokit (player/rust_builder/cargokit/build_tool, which passes the
# channel to `rustup run`), devenv.nix (builtins.fromTOML), Dockerfile and
# Dockerfile.e2e (rustup resolves it directly), and every rustup proxy
# invocation anywhere in the tree. Nothing else may name a Rust version; CI
# fails the build if anything does.
#
# Bumping `channel` is not just a newer compiler. The bundled plugin guests are
# wasip2 components whose WASI world tracks the Rust version (1.96 emits wasi
# 0.2.6), and the runtime host is wasmex 0.14 / wasmtime 39, which validates no
# higher than wasi 0.2.6. A newer channel emits wasi 0.2.9 and bundled plugins
# fail to instantiate at runtime.
#
# `targets` deliberately lists only wasm32-wasip2. The four Android targets are
# installed on demand by cargokit's prepare(); listing them here would make
# every plain `cargo` call in the repo download four extra standard libraries.
# wasm32-unknown-unknown is absent because only devenv wants it, and devenv
# takes its targets from Nix rather than from rustup.
[toolchain]
channel = "1.96.0"
profile = "minimal"
targets = ["wasm32-wasip2"]
