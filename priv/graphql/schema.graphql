schema {
  subscription: RootSubscriptionType
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  "Get any node by its global ID"
  node(id: ID!): Node

  "List all library paths"
  libraries: [LibraryPath]

  "Get a movie by ID"
  movie(id: ID!): Movie

  "Get a TV show by ID"
  tvShow(id: ID!): TvShow

  "Get an episode by ID"
  episode(id: ID!): Episode

  "List all movies with pagination"
  movies(first: Int, after: String, sort: SortInput, category: MediaCategory): MovieConnection

  "List all TV shows with pagination"
  tvShows(first: Int, after: String, sort: SortInput, category: MediaCategory): TvShowConnection

  "Get episodes for a specific season of a TV show"
  seasonEpisodes(showId: ID!, seasonNumber: Int!): [Episode]

  "Get items the user is currently watching (in-progress)"
  continueWatching(first: Int, after: String): [ContinueWatchingItem]

  "Get recently added content"
  recentlyAdded(first: Int, after: String, types: [MediaType]): [RecentlyAddedItem]

  "Get next episodes to watch across all TV shows"
  upNext(first: Int, after: String): [UpNextItem] @deprecated(reason: "Merged into continueWatching, which now carries next episodes as well")

  "Get the user's favorite items"
  favorites(first: Int, after: String, types: [MediaType], category: MediaCategory, sort: SortInput): [RecentlyAddedItem]

  "Get unwatched items with files"
  unwatched(first: Int, after: String, types: [MediaType], category: MediaCategory, sort: SortInput): [RecentlyAddedItem]

  "Search the library across movies, TV shows, episodes, and collections"
  search(query: String!, types: [SearchResultType], first: Int): SearchResults

  "List all API keys for the current user"
  apiKeys: [ApiKey]

  "List all devices for the current user"
  devices: [RemoteDevice]

  "Get remote access \/ P2P connection status"
  remoteAccessStatus: RemoteAccessStatus

  "Get streaming candidates for a media item"
  streamingCandidates(contentType: String!, id: ID!): StreamingCandidatesResult

  "List user's collections (excluding system collections)"
  collections(first: Int): [Collection]

  "Get a single collection by ID"
  collection(id: ID!): Collection

  "Get items in a collection"
  collectionItems(collectionId: ID!, first: Int): [RecentlyAddedItem]

  "Search every enabled subtitle provider for a media file"
  subtitleSearch(
    mediaFileId: ID!

    "ISO 639-1 codes, for example [\"en\", \"es\"]"
    languages: [String!]!
  ): SubtitleSearchPayload!

  """
  Fetch one subtitle track's body directly, without resolving every track
  on the media file. There is no root `mediaFile(id:)` query and
  `MediaFile` does not implement `Node`, so this field takes the media file
  id and track id together rather than nesting through a movie or episode.
  """
  subtitleContent(mediaFileId: ID!, trackId: String!, format: SubtitleFormat): String

  "Get this server's version and the player versions it supports"
  serverCompatibility: ServerCompatibility
}

type RootMutationType {
  "Update playback progress for a movie"
  updateMovieProgress(movieId: ID!, positionSeconds: Int!, durationSeconds: Int): Progress

  "Update playback progress for an episode"
  updateEpisodeProgress(episodeId: ID!, positionSeconds: Int!, durationSeconds: Int): Progress

  "Mark a movie as watched"
  markMovieWatched(movieId: ID!): Movie

  "Mark a movie as unwatched"
  markMovieUnwatched(movieId: ID!): Movie

  "Mark an episode as watched"
  markEpisodeWatched(episodeId: ID!): Episode

  "Mark an episode as unwatched"
  markEpisodeUnwatched(episodeId: ID!): Episode

  "Mark all episodes in a season as watched"
  markSeasonWatched(showId: ID!, seasonNumber: Int!): TvShow

  "Mark all episodes in a season as unwatched"
  markSeasonUnwatched(showId: ID!, seasonNumber: Int!): TvShow

  "Mark an episode and all earlier episodes in its season as watched"
  markEpisodesUpToWatched(episodeId: ID!): TvShow

  "Toggle favorite status for a media item"
  toggleFavorite(mediaItemId: ID!): ToggleFavoriteResult

  "Hide a movie or show from Continue Watching until it is played again"
  removeFromContinueWatching(mediaItemId: ID!): RemoveFromContinueWatchingResult

  "Refresh a media access token before it expires"
  refreshMediaToken(token: String!): MediaToken

  "Exchange a pairing device token for a fresh access token"
  refreshAccessToken(deviceToken: String!): AccessToken

  "Generate a pairing claim code for device pairing (requires authentication)"
  generateClaimCode: ClaimCode

  "Create a new API key for the current user"
  createApiKey(name: String!, permissions: [String!], expiresAt: DateTime): CreateApiKeyResult

  "Revoke an API key"
  revokeApiKey(id: ID!): ApiKey

  "Delete an API key"
  deleteApiKey(id: ID!): Boolean

  "Login with username\/password and device information"
  login(input: LoginInput!): LoginResult

  "Revoke a device"
  revokeDevice(id: ID!): RevokeDeviceResult

  "Start an HLS streaming session for a media file"
  startStreamingSession(
    fileId: ID!

    strategy: StreamingStrategy!

    "Total kbps cap (video + audio), e.g. 2000"
    maxBitrate: Int

    "Output height ceiling in pixels, e.g. 720. Preserves aspect ratio"
    maxHeight: Int

    "Real media position, in seconds, at which to begin transcoding. Optional; omitted or 0 starts at the beginning."
    startPosition: Int
  ): StreamingSessionResult

  "Remember which audio language this viewer wants for a show or film"
  setAudioLanguagePreference(
    "Any file of the show or film. The preference is stored against the item it belongs to, so a choice made on one episode applies to the rest."
    fileId: ID!

    "Language code to remember, e.g. \"eng\". Null forgets the choice and returns this item to the device and server defaults."
    language: String
  ): AudioLanguagePreferenceResult

  "End an HLS streaming session"
  endStreamingSession(sessionId: String!): Boolean

  "Get available download quality options for a media item"
  downloadOptions(
    "Content type: 'movie' or 'episode'"
    contentType: String!

    "Media item ID (for movie) or Episode ID (for episode)"
    id: ID!
  ): [DownloadOption!]

  "Start or return existing transcode job for download"
  prepareDownload(
    "Content type: 'movie' or 'episode'"
    contentType: String!

    "Media item ID (for movie) or Episode ID (for episode)"
    id: ID!

    "Target resolution"
    resolution: String
  ): PrepareDownloadResult

  "Get current status and progress of a transcode job"
  downloadJobStatus(
    "The transcode job ID"
    jobId: ID!
  ): DownloadJobStatus

  "Cancel a transcode job"
  cancelDownloadJob(
    "The transcode job ID"
    jobId: ID!
  ): CancelDownloadResult

  "Download a subtitle candidate returned by subtitleSearch"
  downloadSubtitle(mediaFileId: ID!, token: String!): SubtitleTrack!
}

type RootSubscriptionType {
  "Subscribe to playback progress updates for a specific content item"
  progressUpdated(nodeId: ID!): Progress

  "Subscribe to device status changes for a user"
  deviceStatusChanged(userId: ID!): DeviceStatusEvent
}

"Device status change event"
type DeviceStatusEvent {
  "The device that changed status"
  device: Device!

  "The type of status change"
  event: DeviceEventType!
}

"Remote device information"
type Device {
  "Device ID"
  id: ID!

  "User-friendly device name"
  deviceName: String!

  "Platform (ios, android, web)"
  platform: String!

  "Last time device connected"
  lastSeenAt: DateTime

  "Revocation timestamp if revoked"
  revokedAt: DateTime

  "Initial pairing timestamp"
  insertedAt: DateTime!
}

"Type of device status event"
enum DeviceEventType {
  "Device connected"
  CONNECTED

  "Device disconnected (no heartbeat)"
  DISCONNECTED

  "Device was revoked by user"
  REVOKED

  "Device was deleted"
  DELETED
}

"A node that can be fetched by global ID with hierarchical navigation"
interface Node {
  "Global node ID"
  id: ID!

  "Parent node in the hierarchy"
  parent: Node

  children(first: Int, after: String): NodeConnection

  "Full path from root to this node"
  ancestors: [Node]

  "Whether this node can be played"
  isPlayable: Boolean!
}

"Edge for node connection"
type NodeEdge {
  node: Node!
  cursor: String!
}

"Connection for paginated node children"
type NodeConnection {
  edges: [NodeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"An item in the continue watching rail"
type ContinueWatchingItem {
  id: ID!

  type: MediaType!

  title: String!

  artwork: Artwork

  progress: Progress!

  "Why this item is on the rail: continue for a resume point, next for the successor of a finished episode"
  state: String

  "Playable files for this item, used to start playback straight from the rail"
  files: [MediaFile]

  "For episodes, includes show context"
  showId: ID

  showTitle: String

  seasonNumber: Int

  episodeNumber: Int
}

"An item in the recently added rail"
type RecentlyAddedItem {
  id: ID!

  type: MediaType!

  title: String!

  year: Int

  artwork: Artwork

  addedAt: DateTime!

  "Episodes whose first file arrived inside the recently-added window. Null for movies and for unwindowed lists."
  newEpisodeCount: Int

  "Season of the newest arrived episode. Null for movies and for unmatched files."
  latestSeasonNumber: Int

  "Number of the newest arrived episode. Null for movies and for unmatched files."
  latestEpisodeNumber: Int

  "Rolled-up watch state"
  watchStatus: WatchStatus
}

"An item in the up next rail (next episode to watch)"
type UpNextItem {
  episode: Episode!

  show: TvShow!

  "One of: continue, next, start"
  progressState: String!
}

"A user-created collection of media items"
type Collection {
  id: ID!
  name: String!
  description: String
  type: String!
  visibility: String!
  itemCount: Int!
  posterPaths: [String]
}

"Rolled-up watch state for a browsable item"
type WatchStatus {
  "Movie or episode watched, or every has-file non-special episode watched"
  watched: Boolean!

  "Resume point, 0-100. Null for shows and seasons."
  percentage: Float

  "Unwatched episodes that have a file, excluding season 0. Null for movies."
  unwatchedEpisodeCount: Int
}

"A cast member (actor) on a movie or TV show"
type CastMember {
  name: String!
  character: String
  profileUrl: String
}

"A movie"
type Movie implements Node {
  id: ID!

  parent: Node

  children(first: Int, after: String): NodeConnection

  ancestors: [Node]

  isPlayable: Boolean!

  title: String!

  originalTitle: String

  year: Int

  tmdbId: Int

  tvdbId: Int

  imdbId: String

  category: MediaCategory

  monitored: Boolean!

  addedAt: DateTime!

  "Movie overview\/synopsis"
  overview: String

  "Movie runtime in minutes"
  runtime: Int

  "Genres list"
  genres: [String]

  "Content rating (e.g., PG-13, R)"
  contentRating: String

  "Watch-page URL for the first available YouTube trailer"
  trailerUrl: String

  "Cast members"
  cast: [CastMember]

  "Recommended titles that are also in this library"
  similar: [RecentlyAddedItem]

  "Average rating (0-10)"
  rating: Float

  "Artwork images"
  artwork: Artwork

  "Available video files"
  files: [MediaFile]

  "User playback progress"
  progress: Progress

  "Rolled-up watch state"
  watchStatus: WatchStatus

  "Whether this item is in user favorites"
  isFavorite: Boolean!
}

"The episode this user should play next, with the state that selected it"
type ShowNextUp {
  episode: Episode!

  "One of: continue, next, start"
  progressState: String!
}

"A TV show"
type TvShow implements Node {
  id: ID!

  parent: Node

  children(first: Int, after: String): NodeConnection

  ancestors: [Node]

  isPlayable: Boolean!

  title: String!

  originalTitle: String

  year: Int

  tmdbId: Int

  tvdbId: Int

  imdbId: String

  category: MediaCategory

  monitored: Boolean!

  addedAt: DateTime!

  "Show overview\/synopsis"
  overview: String

  "Show status (Continuing, Ended, etc.)"
  status: String

  "Genres list"
  genres: [String]

  "Content rating"
  contentRating: String

  "Watch-page URL for the first available YouTube trailer"
  trailerUrl: String

  "Cast members"
  cast: [CastMember]

  "Recommended titles that are also in this library"
  similar: [RecentlyAddedItem]

  "Average rating (0-10)"
  rating: Float

  "Artwork images"
  artwork: Artwork

  "List of seasons"
  seasons: [Season]

  "Total number of seasons"
  seasonCount: Int

  "Total number of episodes"
  episodeCount: Int

  "Rolled-up watch state"
  watchStatus: WatchStatus

  "Next episode to watch for the current user"
  nextEpisode: Episode

  "Next episode to watch, with the state that selected it"
  nextUp: ShowNextUp

  "Whether this item is in user favorites"
  isFavorite: Boolean!

  "Metadata provider used to fetch this show's data (tvdb or tmdb)"
  metadataSource: String
}

"A season of a TV show"
type Season implements Node {
  "Season global ID (season:<show_id>:<season_number>)"
  id: ID!

  parent: Node

  children(first: Int, after: String): NodeConnection

  ancestors: [Node]

  isPlayable: Boolean!

  seasonNumber: Int!

  episodeCount: Int!

  airedEpisodeCount: Int

  hasFiles: Boolean!

  "Rolled-up watch state"
  watchStatus: WatchStatus

  "Episodes in this season"
  episodes: [Episode]
}

"A TV episode"
type Episode implements Node {
  id: ID!

  parent: Node

  children(first: Int, after: String): NodeConnection

  ancestors: [Node]

  isPlayable: Boolean!

  seasonNumber: Int!

  episodeNumber: Int!

  title: String

  airDate: Date

  monitored: Boolean!

  "Episode overview\/synopsis"
  overview: String

  "Episode runtime in minutes"
  runtime: Int

  "Episode thumbnail image"
  thumbnailUrl: String

  "Available video files"
  files: [MediaFile]

  "User playback progress"
  progress: Progress

  "Rolled-up watch state"
  watchStatus: WatchStatus

  "Whether this episode has at least one file"
  hasFile: Boolean!

  "Parent TV show info (for context when showing episodes)"
  show: TvShow
}

"Edge for movie connection"
type MovieEdge {
  node: Movie!
  cursor: String!
}

"Connection for paginated movies"
type MovieConnection {
  edges: [MovieEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"Edge for TV show connection"
type TvShowEdge {
  node: TvShow!
  cursor: String!
}

"Connection for paginated TV shows"
type TvShowConnection {
  edges: [TvShowEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"Artwork URLs for a media item"
type Artwork {
  "Poster image URL"
  posterUrl: String

  "Backdrop\/fanart image URL"
  backdropUrl: String

  "Thumbnail image URL"
  thumbnailUrl: String
}

"What kind of elementary stream this is"
enum MediaStreamType {
  "Video stream"
  VIDEO

  "Audio stream"
  AUDIO

  "Subtitle stream"
  SUBTITLE
}

"""
One elementary stream of a media file, as reported by ffprobe.

Values are raw. Composing display strings ("HEVC Main 10", "7.1 (8 ch)") is
the client's job, so the same data can be formatted differently without a
server change. Type-specific fields are null on streams of other types.

The disposition fields are `isDefault` / `isForced` rather than `default` /
`forced` because `default` is a reserved word in Dart and would make the
player's GraphQL codegen emit invalid source.
"""
type MediaStream {
  "Stream index within the container"
  index: Int

  type: MediaStreamType!

  "Short codec name (e.g. hevc, truehd, subrip)"
  codec: String

  "Descriptive codec name"
  codecLong: String

  "Codec profile (e.g. Main 10)"
  profile: String

  "Codec level, as ffprobe's integer"
  level: Int

  "ISO 639-2 language code from container tags"
  language: String

  "Track title from container tags"
  title: String

  "Stream bitrate in bits per second"
  bitrate: Int

  isDefault: Boolean

  isForced: Boolean

  isHearingImpaired: Boolean

  isCommentary: Boolean

  width: Int

  height: Int

  "Average frame rate in frames per second"
  frameRate: Float

  pixelFormat: String

  bitDepth: Int

  colorSpace: String

  colorTransfer: String

  colorPrimaries: String

  "Dolby Vision profile, when present"
  dolbyVisionProfile: Int

  "Display aspect ratio (e.g. 16:9)"
  aspectRatio: String

  channels: Int

  "Channel layout (e.g. 5.1, 7.1)"
  channelLayout: String

  "Sample rate in Hz"
  sampleRate: Int
}

"A playable video file"
type MediaFile {
  "File ID"
  id: ID!

  "Video resolution (e.g., 1080p)"
  resolution: String

  "Video codec (e.g., hevc, h264)"
  codec: String

  "Audio codec (e.g., dts, aac)"
  audioCodec: String

  "HDR format if applicable (e.g., dolby_vision)"
  hdrFormat: String

  "File size in bytes"
  size: Int

  "Bitrate in bits per second"
  bitrate: Int

  "Every video, audio and subtitle stream. Null when detailed capture has not run for this file yet."
  streams: [MediaStream]

  "File name without its directory"
  fileName: String

  "Absolute directory containing the file"
  directory: String

  "Container format (e.g. mkv, mp4)"
  container: String

  "Duration in seconds"
  duration: Float

  "Subtitle files stored alongside the media file. Unlike `subtitles`, this never probes the file."
  externalSubtitles: [SubtitleTrack]

  "Whether this file can be direct played (no transcoding needed)"
  directPlaySupported: Boolean

  "Streaming URL for this file"
  streamUrl: String

  "Direct play URL (no transcoding)"
  directPlayUrl: String

  "Available subtitle tracks (embedded and external)"
  subtitles: [SubtitleTrack]

  "Skippable segments (intro, credits). Empty when detection has not run or found nothing."
  segments: [MediaSegment!]!
}

"""
A detected skippable segment.

`source` and `confidence` are deliberately absent from the wire format. They
are operator concerns, and keeping the confidence floor server side means it
is enforced in one place rather than reimplemented in every client.
"""
type MediaSegment {
  "Which kind of segment this is"
  type: SegmentType!

  "Segment start, milliseconds"
  startMs: Int!

  "Segment end, milliseconds"
  endMs: Int!
}

"User playback progress on a media item or episode"
type Progress {
  "Current position in seconds"
  positionSeconds: Int!

  "Total duration in seconds"
  durationSeconds: Int

  "Completion percentage (0-100)"
  percentage: Float

  "Whether marked as watched"
  watched: Boolean!

  "Last watched timestamp"
  lastWatchedAt: DateTime
}

"Input for sorting lists"
input SortInput {
  field: SortField

  direction: SortDirection

  "Seed for the random sort. Send the same value across pages of one shuffle."
  seed: Int
}

"Pagination info for cursor-based pagination"
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"Search result with relevance score"
type SearchResult {
  id: ID!

  type: SearchResultType!

  title: String!

  year: Int

  artwork: Artwork

  "Relevance score: 100, 75, 50 or 25"
  score: Float

  "Parent show title for episodes, item count for collections"
  subtitle: String

  "Season number, episodes only"
  seasonNumber: Int

  "Episode number, episodes only"
  episodeNumber: Int

  "Owning show ID, episodes only"
  parentId: ID
}

"One grouped section of search results"
type SearchSection {
  type: SearchResultType!

  results: [SearchResult!]!

  "True number of matches, not the length of results"
  totalCount: Int!
}

"Search results container"
type SearchResults {
  sections: [SearchSection!]!
  totalCount: Int!
}

"A library path for organizing media"
type LibraryPath implements Node {
  id: ID!

  parent: Node

  children(first: Int, after: String): NodeConnection

  ancestors: [Node]

  isPlayable: Boolean!

  "Filesystem path"
  path: String!

  "Type of content in this library"
  type: LibraryType!

  "Whether this path is actively monitored"
  monitored: Boolean!

  "Scan interval in seconds"
  scanInterval: Int

  "Last scan timestamp"
  lastScanAt: DateTime

  "Whether auto-organization is enabled"
  autoOrganize: Boolean!

  "Whether auto-import is enabled"
  autoImport: Boolean!

  "Whether NFO files are written alongside media"
  writeNfo: Boolean!

  "Whether auto-rename on import is enabled"
  autoRename: Boolean!

  "Metadata provider used for TV shows in this library (tvdb or tmdb)"
  tvMetadataSource: String
}

"Result of toggling favorite status"
type ToggleFavoriteResult {
  "New favorite status"
  isFavorite: Boolean!

  "ID of the media item"
  mediaItemId: ID!
}

"Outcome of hiding a title from Continue Watching"
type RemoveFromContinueWatchingResult {
  "ID of the hidden movie or show"
  mediaItemId: ID!

  "Whether the title is now hidden from Continue Watching"
  removed: Boolean!
}

"Media access token for direct media requests"
type MediaToken {
  "JWT token for media access"
  token: String!

  "Token expiration timestamp"
  expiresAt: DateTime!

  "List of granted permissions"
  permissions: [String!]!
}

"Access token for authenticating GraphQL and API requests"
type AccessToken {
  "JWT access token"
  token: String!

  "Token expiration timestamp"
  expiresAt: DateTime!
}

"API key for programmatic access"
type ApiKey {
  "API key ID"
  id: ID!

  "User-given name"
  name: String!

  "Key prefix for identification"
  keyPrefix: String!

  "List of granted permissions"
  permissions: [String!]!

  "Last time the key was used"
  lastUsedAt: DateTime

  "Optional expiration timestamp"
  expiresAt: DateTime

  "Revocation timestamp"
  revokedAt: DateTime

  "Creation timestamp"
  insertedAt: DateTime!
}

"Result of creating an API key"
type CreateApiKeyResult {
  "The created API key"
  apiKey: ApiKey!

  "The plain API key (shown only once)"
  key: String!
}

"Input for login mutation"
input LoginInput {
  "Username or email"
  username: String!

  "User password"
  password: String!

  "Unique device identifier"
  deviceId: String!

  "Human-readable device name"
  deviceName: String!

  "Platform (ios, android, web)"
  platform: String!
}

"Result of login mutation"
type LoginResult {
  "JWT authentication token"
  token: String!

  "Authenticated user information"
  user: User!

  "Token expiration in seconds"
  expiresIn: Int!
}

"User information"
type User {
  "User ID"
  id: ID!

  "Username"
  username: String

  "Email address"
  email: String

  "Display name"
  displayName: String
}

"A remote device paired to a user account"
type RemoteDevice {
  "Device ID"
  id: ID!

  "Human-readable device name"
  deviceName: String!

  "Platform (ios, android, web)"
  platform: String!

  "Last time device was active"
  lastSeenAt: DateTime

  "Whether device has been revoked"
  isRevoked: Boolean!

  "When device was paired"
  createdAt: DateTime!
}

"Result of revoking a device"
type RevokeDeviceResult {
  "Whether the revoke operation succeeded"
  success: Boolean!

  "The revoked device"
  device: RemoteDevice
}

"A pairing claim code for device pairing"
type ClaimCode {
  "The claim code (e.g., 'K7RPM2')"
  code: String!

  "When the code expires"
  expiresAt: DateTime!

  "Whether the sealed claim reached the relay. False means QR pairing works but manual code entry does not."
  relayRegistered: Boolean!
}

"Remote access \/ P2P connection status"
type RemoteAccessStatus {
  "Whether remote access is enabled and running"
  enabled: Boolean!

  "The node's endpoint address for sharing"
  endpointAddr: String

  "Number of connected peers"
  connectedPeers: Int!
}

"Result of starting a streaming session"
type StreamingSessionResult {
  "The HLS session identifier"
  sessionId: String!

  "Media duration in seconds (if known)"
  duration: Float

  "Real media position, in seconds, at which the stream begins. Clients must map stream-local positions by this offset. Absent or 0 means the stream starts at the beginning."
  startPosition: Int

  "Total kbps cap the server actually applied, which may be lower than requested on a relay connection. Null means uncapped. Clients should label the quality control from this, not from what they asked for."
  maxBitrate: Int

  "Output height ceiling the server actually applied, which may be lower than requested on a relay connection. Null means the source resolution is preserved."
  maxHeight: Int
}

"A download quality option"
type DownloadOption {
  "Resolution identifier (original, 1080p, 720p, 480p)"
  resolution: String!

  "Human-readable label"
  label: String!

  "Estimated file size in bytes"
  estimatedSize: Int!

  "Pre-transcode status: ready, transcoding, pending, or null"
  transcodeStatus: String

  "Transcode progress (0.0 to 1.0)"
  transcodeProgress: Float

  "Actual file size in bytes when transcoded"
  actualSize: Int
}

"Result of preparing a download job"
type PrepareDownloadResult {
  "The transcode job ID"
  jobId: ID!

  "Job status (pending, transcoding, ready, failed)"
  status: String!

  "Transcoding progress (0.0 to 1.0)"
  progress: Float!

  "Final file size in bytes (when ready)"
  fileSize: Int
}

"Download job status"
type DownloadJobStatus {
  "The transcode job ID"
  jobId: ID!

  "Job status (pending, transcoding, ready, failed)"
  status: String!

  "Transcoding progress (0.0 to 1.0)"
  progress: Float!

  "Error message if job failed"
  error: String

  "Final file size in bytes (when ready)"
  fileSize: Int
}

"Result of cancelling a download job"
type CancelDownloadResult {
  "Whether the cancellation succeeded"
  success: Boolean!
}

"A streaming candidate option"
type StreamingCandidate {
  "Streaming strategy"
  strategy: StreamingCandidateStrategy!

  "Full MIME type with codecs parameter"
  mime: String!

  "Container format (mp4, ts, mkv, etc.)"
  container: String!

  "RFC 6381 video codec string"
  videoCodec: String

  "RFC 6381 audio codec string"
  audioCodec: String
}

"Metadata about the source media file"
type StreamingMetadata {
  "Duration in seconds"
  duration: Float

  "Video width in pixels"
  width: Int

  "Video height in pixels"
  height: Int

  "Bitrate in bits per second"
  bitrate: Int

  "Resolution label (e.g., 1080p)"
  resolution: String

  "HDR format if applicable"
  hdrFormat: String

  "Original video codec"
  originalCodec: String

  "Original audio codec"
  originalAudioCodec: String

  "Original container format"
  container: String

  "Audio languages this playback should prefer, most preferred first, already resolved against the item's original language. Direct play never reaches the server's transcoder, so a client must apply this itself (mpv's `alang`) to avoid opening on whichever track the container happened to flag default. Empty means the operator asked for the container's own flag to win, so the client should not override its player's selection."
  preferredAudioLanguages: [String!]
}

"Outcome of remembering a viewer's audio language choice"
type AudioLanguagePreferenceResult {
  "The show or film the preference was stored against"
  mediaItemId: ID!

  "The remembered language, or null if the choice was forgotten"
  language: String

  "The full preference list now in effect for this item, most preferred first, with the new choice already folded in. A client can apply this directly rather than re-querying streamingCandidates."
  preferredAudioLanguages: [String!]
}

"Result of streaming candidates query"
type StreamingCandidatesResult {
  "The resolved media file ID"
  fileId: ID!

  "Prioritized list of streaming options"
  candidates: [StreamingCandidate!]!

  "Source file metadata"
  metadata: StreamingMetadata!
}

"A subtitle track available for a media file"
type SubtitleTrack {
  "Track identifier (integer for embedded, UUID for external)"
  trackId: String!

  "ISO 639-2 language code (e.g., 'eng', 'spa')"
  language: String!

  "Display title (e.g., 'English', 'Spanish (Forced)')"
  title: String!

  "Subtitle format (srt, vtt, ass, etc.)"
  format: String!

  "Whether the subtitle is embedded in the media file"
  embedded: Boolean!

  "Whether this track can be delivered as text. False for image-based subtitles (PGS, VobSub), which play only in direct mode"
  deliverable: Boolean!

  "Subtitle body in the requested format. Null when the track is not deliverable"
  content(format: SubtitleFormat): String

  "URL to download this subtitle in the requested format"
  url(format: SubtitleFormat): String
}

"A subtitle available from a provider, not yet downloaded"
type SubtitleCandidate {
  "Opaque signed handle. Pass to downloadSubtitle. Valid for 15 minutes"
  token: String!

  "ISO 639-1 language code"
  language: String!

  "Provider's file name for this subtitle, usually the release it matches"
  releaseName: String

  format: String!

  rating: Float

  downloadCount: Int

  hearingImpaired: Boolean!

  "Whether the provider matched this subtitle by media file hash, the strongest signal"
  hashMatch: Boolean!

  score: Int!

  providerName: String!
}

"Outcome of consulting one subtitle provider"
type SubtitleProviderStatus {
  name: String!

  quotaRemaining: Int

  quotaTotal: Int

  "Null when the provider answered. A message when it did not"
  error: String
}

"Results of a subtitle search across every enabled provider"
type SubtitleSearchPayload {
  results: [SubtitleCandidate!]!
  providers: [SubtitleProviderStatus!]!
}

"""
What this server needs from a connecting player.

Published so a player can tell the operator that one side is too old, rather
than letting the mismatch surface as an unexplained failure. Readable without
authentication: a client that cannot log in is exactly the one that may need
to know why.
"""
type ServerCompatibility {
  "This server's own version"
  version: String!

  "Oldest player version this server works with"
  minPlayerVersion: String!

  "Oldest player version this server would rather you ran"
  recommendedPlayerVersion: String!
}

