# Local-dev compose service for the mydia-rs Rust backend.
#
# Lives alongside the Phoenix `app` service in compose.yml so the two
# can run in parallel and you can hit each on its own host port. Layer
# this file on top of the main compose with `-f` (the `./dev rs up`
# wrapper does that for you):
#
#   docker compose -f compose.yml -f compose.mydia-rs.yml up -d mydia-rs
#
# Ports:
#   - 4000 (already) -> Phoenix backend
#   - 4001 (already) -> metadata-relay container from compose.override.yml
#   - 4002 (new)     -> mydia-rs backend
#
# Database: a dedicated SQLite file under the `mydia_rs_dev_data`
# volume by default. Sharing Phoenix's mydia_dev.db is allowed (the
# runtime-lock guard from U34 doesn't refuse against Phoenix, only
# against another mydia-rs), but two SQLite writers against the same
# WAL file is fragile under load. To share anyway, override
# MYDIA_DATABASE__PATH on the command line and bind-mount the file.
#
# The binary today boots, opens the DB, runs the schema-migrations
# probe, acquires the runtime lock, and would exit. MYDIA_KEEP_ALIVE=true
# tells it to wait for SIGTERM instead so the container stays up while
# we're between here and the real supervision tree (U22 brings up the
# axum HTTP server and the web UI).

services:
  mydia-rs:
    image: mydia-rs:dev
    build:
      context: .
      dockerfile: mydia-rs/Dockerfile
    container_name: mydia_rs_dev
    ports:
      - "4002:4002"
    environment:
      # Override the default 4001 -> 4002 so we don't fight with
      # metadata-relay (compose.override.yml). figment double-underscore
      # syntax maps to server.port in the config schema.
      MYDIA_SERVER__PORT: "4002"
      MYDIA_SERVER__HOST: "0.0.0.0"

      MYDIA_DATABASE__TYPE: sqlite
      MYDIA_DATABASE__PATH: /var/lib/mydia/mydia_rs_dev.db

      MYDIA_LOGGING__LEVEL: info
      MYDIA_LOGGING__FORMAT: text

      MYDIA_METADATA__RELAY_URL: ${METADATA_RELAY_URL:-http://localhost:4001}

      # Hold the runtime lock and wait for SIGTERM instead of exiting
      # after the boot checks. Drops out automatically once the real
      # supervision tree (U22) replaces the wait with the server loop.
      MYDIA_KEEP_ALIVE: "true"
    volumes:
      - mydia_rs_dev_data:/var/lib/mydia
      # Optional: bind-mount the Phoenix media tree the same way the
      # `app` service does, so library scans (U16+) see real content.
      # Uncomment when you're ready to exercise that path.
      # - ~/media:/media:ro
    restart: unless-stopped
    healthcheck:
      # No HTTP server yet; check the process is alive via the lock row
      # heartbeat freshness. Replace with a real /health endpoint once
      # U22 lands.
      test: ["CMD", "test", "-f", "/var/lib/mydia/mydia_rs_dev.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mydia_rs_dev_data:
    driver: local
