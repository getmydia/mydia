"""
The merged Mutation root. Same convention as `QueryRoot`: one
struct per family.
"""
type Mutation {
	"""
	Keeps the mutation root non-empty when the merged set has
	nothing else to expose (e.g. in U13's parity harness when it
	builds a schema without DB-backed resolvers). Once U14 lands
	`auth/api_key/device` mutations, this can be dropped.
	"""
	ping: String!
	"""
	Upsert progress for a movie. Returns the new progress shape.
	"""
	updateMovieProgress(movieId: ID!, positionSeconds: Int!, durationSeconds: Int): Progress!
	"""
	Upsert progress for an episode.
	"""
	updateEpisodeProgress(episodeId: ID!, positionSeconds: Int!, durationSeconds: Int): Progress!
	"""
	Mark a movie as watched. Creates a progress row with
	`(position=0, duration=1, watched=true)` if none exists yet,
	matching Phoenix's fallback path.
	"""
	markMovieWatched(movieId: ID!): Movie!
	"""
	Mark a movie as unwatched. Deletes the progress row if it
	exists; otherwise no-op (matches Phoenix's
	`delete_progress -> {:error, :not_found}` no-op branch).
	"""
	markMovieUnwatched(movieId: ID!): Movie!
	"""
	Mark an episode as watched.
	"""
	markEpisodeWatched(episodeId: ID!): Episode!
	"""
	Mark an episode as unwatched.
	"""
	markEpisodeUnwatched(episodeId: ID!): Episode!
	"""
	Mark every episode in a season as watched.
	"""
	markSeasonWatched(showId: ID!, seasonNumber: Int!): TvShow!
	"""
	Toggle a media item's membership in the user's favorites.
	"""
	toggleFavorite(mediaItemId: ID!): ToggleFavoriteResult!
	"""
	Start an HLS streaming session for a media file.
	"""
	startStreamingSession(fileId: ID!, strategy: StreamingStrategy!, maxBitrate: Int): StreamingSessionResult!
	"""
	End an HLS streaming session. Returns `true` even for unknown
	session IDs (matches Phoenix's terminate-session behavior).
	"""
	endStreamingSession(sessionId: String!): Boolean!
	login(input: LoginInput!): LoginResult!
	createApiKey(name: String!, permissions: [String!], expiresAt: DateTime): CreateApiKeyResult!
	revokeApiKey(id: ID!): ApiKey!
	deleteApiKey(id: ID!): Boolean!
	revokeDevice(id: ID!): RevokeDeviceResult!
	downloadOptions(contentType: String!, id: ID!): [DownloadOption!]!
	prepareDownload(contentType: String!, id: ID!, resolution: String! = "720p"): PrepareDownloadResult!
	downloadJobStatus(jobId: ID!): DownloadJobStatus!
	cancelDownloadJob(jobId: ID!): CancelDownloadResult!
	generateClaimCode: ClaimCode!
	refreshMediaToken(token: String!): MediaToken!
	createLibraryPath(input: LibraryPathInput!): LibraryPath!
	deleteLibraryPath(id: ID!): Boolean!
	triggerScan(pathId: ID!): Boolean!
	createIndexer(input: IndexerInput!): Indexer!
	deleteIndexer(id: ID!): Boolean!
	toggleIndexer(id: ID!, enabled: Boolean!): Indexer
	testIndexer(id: ID!): String!
	createDownloadClient(input: DownloadClientInput!): DownloadClient!
	deleteDownloadClient(id: ID!): Boolean!
	toggleDownloadClient(id: ID!, enabled: Boolean!): DownloadClient
	testDownloadClient(id: ID!): String!
	createImportList(input: ImportListInput!): ImportList!
	deleteImportList(id: ID!): Boolean!
	toggleImportList(id: ID!, enabled: Boolean!): ImportList
	createMediaServer(input: MediaServerInput!): MediaServer!
	deleteMediaServer(id: ID!): Boolean!
	toggleMediaServer(id: ID!, enabled: Boolean!): MediaServer
	createQualityProfile(input: QualityProfileInput!): QualityProfile!
	updateQualityProfile(id: ID!, input: QualityProfileInput!): QualityProfile
	deleteQualityProfile(id: ID!): Boolean!
	createReleaseBlacklistEntry(input: ReleaseBlacklistInput!): ReleaseBlacklistEntry!
	deleteReleaseBlacklistEntry(id: ID!): Boolean!
}

