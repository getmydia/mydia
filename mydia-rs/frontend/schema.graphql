"""
The merged Query root type. New resolver families add themselves
here as the corresponding U10/U11/U14 units land.
"""
type Query {
	"""
	Stable string identifying the GraphQL schema build. Useful for
	the parity replay harness in U13 and for smoke tests asserting
	the schema is wired correctly.
	"""
	schemaVersion: String!
	"""
	Decode a global ID and report its type tag, without resolving
	the underlying node. Convenience field for the parity harness
	— useful when a corpus record's `id` argument fails to round-
	trip and you want to know whether the encoding or the lookup
	is the culprit.
	"""
	nodeType(id: ID!): String
	"""
	Polymorphic node lookup — port of `BrowseResolver.get_node/3`.
	"""
	node(id: ID!): NodeUnion
	"""
	The currently authenticated user, or null when the request is
	unauthenticated. The SPA calls this on mount to determine whether
	to show the login screen or the app shell.
	"""
	viewer: Viewer
	"""
	List all movies, sorted and paginated.
	"""
	movies(first: Int! = 20, after: String, sort: SortInput, category: MediaCategory): MovieConnection!
	"""
	List all TV shows.
	"""
	tvShows(first: Int! = 20, after: String, sort: SortInput, category: MediaCategory): TvShowConnection!
	"""
	Fetch one movie by global node ID or plain UUID.
	"""
	movie(id: ID!): Movie!
	"""
	Fetch one TV show.
	"""
	tvShow(id: ID!): TvShow!
	"""
	Fetch one episode.
	"""
	episode(id: ID!): Episode!
	"""
	List all library paths.
	"""
	libraries: [LibraryPath!]!
	libraryPath(id: ID!): LibraryPath
	"""
	List episodes for a given show + season number.
	"""
	seasonEpisodes(showId: ID!, seasonNumber: Int!): [Episode!]!
	"""
	Materialise a virtual `Season` for a show + season number.
	"""
	season(showId: ID!, seasonNumber: Int!): Season!
	"""
	In-progress items for the current user. Returns `[]` when no
	`CurrentUser` is attached (unauthenticated request) — mirrors
	`DiscoveryResolver.continue_watching/3` line 18.
	"""
	continueWatching(first: Int! = 10, after: String): [ContinueWatchingItem!]!
	"""
	Recently-added items across all media types. No auth required.
	"""
	recentlyAdded(first: Int! = 20, after: String, types: [MediaType!]): [RecentlyAddedItem!]!
	"""
	Next-episode-to-watch rail. Anonymous fallback returns `[]`.
	"""
	upNext(first: Int! = 10, after: String): [UpNextItem!]!
	"""
	User's favorites collection. Anonymous fallback returns `[]`.
	Favorites moved to the `collections` table in
	`priv/repo/migrations/20251228233656_migrate_favorites_to_collections.exs`;
	the Collections context port lands in U14 and this resolver
	activates then.
	"""
	favorites(first: Int! = 50, after: String, types: [MediaType!]): [RecentlyAddedItem!]!
	"""
	Unwatched items with files. Anonymous fallback returns `[]`.
	"""
	unwatched(first: Int! = 50, after: String, types: [MediaType!]): [RecentlyAddedItem!]!
	"""
	Substring search across media item titles.
	"""
	search(query: String!, first: Int! = 20, types: [MediaType!]): SearchResults!
	"""
	Resolve a media file from a (`content_type`, id) pair and return
	the streaming-strategy candidates plus source metadata. Calls
	fail with `Authentication required` when no user is in context.
	"""
	streamingCandidates(contentType: String!, id: ID!): StreamingCandidatesResult!
	apiKeys: [ApiKey!]!
	devices: [RemoteDevice!]!
	collections(first: Int! = 50): [Collection!]!
	collection(id: ID!): Collection!
	collectionItems(collectionId: ID!, first: Int! = 50): [RecentlyAddedItem!]!
	remoteAccessStatus: RemoteAccessStatus!
	libraryPaths: [LibraryPath!]!
	indexers: [Indexer!]!
	indexer(id: ID!): Indexer
	downloadClients: [DownloadClient!]!
	downloadClient(id: ID!): DownloadClient
	importLists: [ImportList!]!
	importList(id: ID!): ImportList
	mediaServers: [MediaServer!]!
	mediaServer(id: ID!): MediaServer
	qualityProfiles: [QualityProfile!]!
	qualityProfile(id: ID!): QualityProfile
	releaseBlacklist: [ReleaseBlacklistEntry!]!
	releaseBlacklistEntry(id: ID!): ReleaseBlacklistEntry
}

