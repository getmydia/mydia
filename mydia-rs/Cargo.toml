[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/auth",
    "crates/config",
    "crates/db",
    "crates/downloads",
    "crates/entities",
    "crates/events",
    "crates/graphql",
    "crates/indexers",
    "crates/integrations",
    "crates/jobs",
    "crates/library",
    "crates/metadata",
    "crates/models",
    "crates/p2p",
    "crates/parity-harness",
    "crates/pubsub",
    "crates/streaming",
    "crates/subtitles",
    "crates/web",
    "bin/mydia-rs-cli",
    "scripts/schema_diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/getmydia/mydia"
publish = false

[workspace.dependencies]
tokio = { version = "1.49", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
anyhow = "1"
# SeaORM 2.0 is the cross-engine data API for the workspace. Adopted via
# `docs/plans/2026-05-24-001-refactor-seaorm-data-layer-unification-plan.md`
# (Phase A U1). MSRV 1.85, satisfied by stable rustc 1.94+. Default features
# disabled because SeaORM's default set pulls many backends; we opt in to
# the cross-engine combo the workspace actually serves.
#
# Pinned to a 2.0 RC since 2.0 hasn't shipped a stable release as of
# 2026-05-24. Bump conservatively; pre-release point bumps may carry
# breaking changes inside the 2.x line until stabilization.
sea-orm = { version = "=2.0.0-rc.38", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-cli = { version = "=2.0.0-rc.38", default-features = false }

# Workspace-wide lint configuration. Default clippy presets stay at the
# `warn` level (CI escalates to error via `-D warnings`); `pedantic` is
# enabled with a small allow-list for the lints that nag without paying
# for themselves.
#
# Priority -1 on `pedantic` so individual allows below win the precedence
# fight even though they're at the default priority 0.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# `disallowed_methods` is configured via the workspace `clippy.toml` and
# flags runtime `sqlx::query` / `query_as` / `query_scalar` calls so the
# tier-(a) macro conversion sweep can find them. The workspace baseline
# is `deny`: every runtime call site must either be promoted to the
# compile-time-checked `sqlx::query!` / `query_as!` / `query_scalar!`
# macro form (tier (a)) or carry a per-call `#[allow(clippy::disallowed_methods)]`
# with a one-line reason describing the dialect divergence, dynamic
# composition, or SQLite-only schema reach that makes it genuinely
# tier (b). See `crates/db/README.md` for the per-call patterns. CI is
# expected red while the workspace's pending runtime sites are walked
# crate-by-crate; the deny gate is the forcing function.
disallowed_methods = "deny"

# Allowed pedantic lints, these flag idiomatic patterns we use widely
# and the noise/value ratio doesn't justify suppressing per-call-site.
missing_errors_doc = "allow"             # every `-> Result` would need a # Errors section
missing_panics_doc = "allow"             # every fn calling `.unwrap()` would need a # Panics section
module_name_repetitions = "allow"        # `models::ApiKey` -> `ApiKeyObject` is fine
must_use_candidate = "allow"             # extremely noisy; needs case-by-case judgment
cast_possible_truncation = "allow"       # `as i32` on validated counts is fine
cast_possible_wrap = "allow"             # u64 -> i64 for DB columns
cast_sign_loss = "allow"                 # i32 -> u32 for known-positive values
cast_precision_loss = "allow"            # f64 from u64 for progress percentages
similar_names = "allow"                  # `user_id` / `user_uuid` etc. are intentional
too_many_lines = "allow"                 # arbitrary line-count threshold
struct_excessive_bools = "allow"         # config / settings structs naturally have many bools
unused_self = "allow"                    # async-graphql resolver structs are stateless by design
unused_async = "allow"                   # async-graphql `#[Object]` resolvers must be async fn even without awaits
return_self_not_must_use = "allow"       # builder patterns are obvious without the annotation
items_after_statements = "allow"         # test helpers and inline structs near use sites read clearer

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
