[package]
name = "mydia-rs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mydia_rs_app"
path = "src/lib.rs"

[[bin]]
name = "mydia-rs"
path = "src/main.rs"

[dependencies]
mydia-rs-web-spa = { path = "../web-spa" }
mydia-rs-auth = { path = "../auth" }
mydia-rs-config = { path = "../config" }
mydia-rs-db = { path = "../db" }
mydia-rs-entities = { path = "../entities" }
mydia-rs-graphql = { path = "../graphql" }
mydia-rs-p2p = { path = "../p2p" }
mydia-rs-pubsub = { path = "../pubsub" }
mydia-rs-jobs = { path = "../jobs" }
mydia-rs-streaming = { path = "../streaming" }
mydia-rs-downloads = { path = "../downloads" }
tokio = { workspace = true }
clap = { workspace = true }
sea-orm = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
    "fs",
    "request-id",
    "catch-panic",
    "set-header",
] }
http = "1"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
