[package]
name = "mydia-rs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mydia_rs_app"
path = "src/lib.rs"

[[bin]]
name = "mydia-rs"
path = "src/main.rs"

# Dual-target binary per Dioxus 0.7's `dx serve` model.
# - `--features server` (default): builds the native axum binary
#   with the config / DB / lock / SSR bootstrap. All server-only
#   deps live behind this feature so they're not pulled in for wasm.
# - `--features web` (set by `dx` when targeting wasm32-unknown-unknown):
#   builds a wasm binary that calls `dioxus::launch(mydia_rs_web::app)`.
#   The wasm tree has NO sqlx / tokio-multi-thread / axum — those are
#   all gated behind `server`.
#
# Operators don't need to know about features: `./dev rs build` and
# `./dev rs run` (native) use the default `server` feature; `dx serve`
# orchestrates both compiles.

[features]
default = ["server"]

server = [
    "dep:tokio",
    "dep:clap",
    "dep:sqlx",
    "dep:chrono",
    "dep:thiserror",
    "dep:anyhow",
    "dep:mydia-rs-config",
    "dep:mydia-rs-db",
    "dep:mydia-rs-pubsub",
    "dep:mydia-rs-jobs",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:http",
    "dioxus/server",
    "mydia-rs-web/server",
]

web = ["dioxus/web"]

[dependencies]
# Always-on deps — both wasm and server need these.
dioxus = { version = "0.7", features = ["fullstack", "router"] }
mydia-rs-web = { path = "../web" }
tracing.workspace = true

# Server-only deps — gated behind the `server` feature so wasm
# builds don't try to compile them.
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "chrono",
] }
chrono = { version = "0.4", optional = true, default-features = false, features = [
    "clock",
] }
thiserror = { workspace = true, optional = true }
# dioxus::serve's closure must return Result<Router, anyhow::Error>; we
# adopt anyhow in the boot path so figment / sqlx / runtime-lock errors
# coerce cleanly via `?`. Server-only — wasm bin never sees it.
anyhow = { workspace = true, optional = true }
mydia-rs-config = { path = "../config", optional = true }
mydia-rs-db = { path = "../db", optional = true }
mydia-rs-pubsub = { path = "../pubsub", optional = true }
mydia-rs-jobs = { path = "../jobs", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = [
    "cors",
    "trace",
    "compression-gzip",
    "fs",
    "request-id",
    "catch-panic",
    "set-header",
] }
http = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
