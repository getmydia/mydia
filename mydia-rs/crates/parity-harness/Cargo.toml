[package]
name = "mydia-rs-parity-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mydia_rs_parity_harness"
path = "src/lib.rs"

[[bin]]
name = "parity-review"
path = "src/bin/capture_review.rs"

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"
