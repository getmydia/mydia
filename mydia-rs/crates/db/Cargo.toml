[package]
name = "mydia-rs-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# SeaORM is the workspace's data layer post-U6 cutover. sqlx is no
# longer a direct dependency — sea-orm pulls it transitively for the
# `sea_orm::sqlx::sqlite::*` types that pool.rs needs to translate
# config-side enums into PRAGMA values. The wrapper types and helpers
# in this crate are SeaORM-native; downstream call sites thread
# `DatabaseConnection` and use `insert_active_model` for writes.
sea-orm.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
mydia-rs-config = { path = "../config" }

[dev-dependencies]
tempfile = "3"
sea-orm-cli.workspace = true

[lints]
workspace = true
