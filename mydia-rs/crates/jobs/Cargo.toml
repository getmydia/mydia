[package]
name = "mydia-rs-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apalis = { version = "0.7", default-features = false, features = ["tracing", "retry", "timeout", "limit", "catch-panic"] }
apalis-sql = { version = "0.7", default-features = false, features = ["sqlite", "postgres", "tokio-comp", "migrate"] }
apalis-cron = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
cron = "0.15"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-stream = "0.1"
futures = "0.3"
mydia-rs-db = { path = "../db" }
mydia-rs-pubsub = { path = "../pubsub" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[lints]
workspace = true
