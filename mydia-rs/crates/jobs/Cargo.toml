[package]
name = "mydia-rs-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
apalis = { version = "0.7", default-features = false, features = ["tracing", "retry", "timeout", "limit", "catch-panic"] }
apalis-core = "0.7"
tower = { version = "0.5", features = ["util"] }
apalis-sql = { version = "0.7", default-features = false, features = ["sqlite", "postgres", "tokio-comp", "migrate"] }
apalis-cron = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
cron = "0.15"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
mydia-rs-db = { path = "../db" }
mydia-rs-pubsub = { path = "../pubsub" }
mydia-rs-library = { path = "../library" }
mydia-rs-metadata = { path = "../metadata" }
mydia-rs-indexers = { path = "../indexers" }
mydia-rs-subtitles = { path = "../subtitles" }
mydia-rs-downloads = { path = "../downloads" }
mydia-rs-streaming = { path = "../streaming" }
mydia-rs-integrations = { path = "../integrations" }
mydia-rs-events = { path = "../events" }
mydia-rs-models = { path = "../models" }
mydia-rs-config = { path = "../config" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[lints]
workspace = true
