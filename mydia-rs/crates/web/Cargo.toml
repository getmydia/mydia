[package]
name = "mydia-rs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mydia_rs_web"
path = "src/lib.rs"

# Per Dioxus 0.7's dual-target model, this crate must compile to both
# wasm32-unknown-unknown (client / hydration) and the native server
# target. Server-only logic (sqlx, tokio, pubsub, jobs) is gated behind
# the `server` feature so the wasm build never sees those deps; client-
# side `#[server]` callers still compile against the same signatures
# because the macro stubs them out on the wasm target.
[dependencies]
# The `dioxus` umbrella crate is the only Dioxus dep we touch directly per
# the 0.7 convention. `fullstack` pulls in dioxus-fullstack, `router` pulls
# in dioxus-router. Feature flags `server` / `web` are forwarded by the
# parent app crate so the same `app()` function compiles for both targets.
dioxus = { version = "0.7", features = ["fullstack", "router"] }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }

# Server-only deps for U23 pilot (admin library-paths page + scan
# progress WebSocket). All gated behind the `server` feature so the
# wasm hydration build doesn't try to compile them.
mydia-rs-db        = { path = "../db",        optional = true }
mydia-rs-pubsub    = { path = "../pubsub",    optional = true }
mydia-rs-jobs      = { path = "../jobs",      optional = true }
mydia-rs-auth      = { path = "../auth",      optional = true }
mydia-rs-models    = { path = "../models",    optional = true }
sqlx               = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid"], optional = true }
tokio              = { workspace = true, optional = true }
chrono             = { version = "0.4", default-features = false, features = ["serde", "clock"], optional = true }
futures            = { version = "0.3", optional = true }
tokio-stream       = { version = "0.1", optional = true }
uuid               = { version = "1", features = ["v4", "serde"], optional = true }
thiserror          = { workspace = true, optional = true }
tower-sessions     = { version = "0.14", optional = true }
tower-sessions-sqlx-store = { version = "0.15", optional = true, features = ["sqlite", "postgres"] }
time               = { version = "0.3", optional = true }
axum               = { version = "0.8", optional = true }
tower              = { version = "0.5", optional = true }
http               = { version = "1", optional = true }

[features]
default = []
server = [
    "dioxus/server",
    "dep:mydia-rs-db",
    "dep:mydia-rs-pubsub",
    "dep:mydia-rs-jobs",
    "dep:mydia-rs-auth",
    "dep:mydia-rs-models",
    "dep:sqlx",
    "dep:tokio",
    "dep:chrono",
    "dep:futures",
    "dep:tokio-stream",
    "dep:uuid",
    "dep:thiserror",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:time",
    "dep:axum",
    "dep:tower",
    "dep:http",
]
web    = ["dioxus/web"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
mydia-rs-db = { path = "../db" }
mydia-rs-pubsub = { path = "../pubsub" }
mydia-rs-jobs = { path = "../jobs" }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
