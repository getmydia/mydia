[package]
name = "mydia-rs-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "macros",
    "chrono",
    "json",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde.workspace = true
serde_json = "1"
mydia-rs-db = { path = "../db" }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
mydia-rs-config = { path = "../config" }
# Test-only — round-trip tests in `tests/round_trip.rs` drive entity
# `ActiveModel`s through `mydia_rs_db::insert_active_model` to exercise
# the wrapper-type write path on SQLite. The lib stays wasm-compatible
# because `mydia-rs-entities` (which pulls SeaORM/sqlx) only appears in
# `[dev-dependencies]`.
mydia-rs-entities = { path = "../entities" }
sea-orm.workspace = true

[lints]
workspace = true
