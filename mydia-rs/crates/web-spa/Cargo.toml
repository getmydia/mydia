[package]
name = "mydia-rs-web-spa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mydia_rs_web_spa"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
rust-embed = { version = "8", features = ["debug-embed"] }
axum-embed = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }
mime_guess = "2"
async-graphql = { version = "7", features = ["chrono", "uuid"] }
mydia-rs-graphql = { path = "../graphql" }
clap = { version = "4", features = ["derive"] }
mydia-rs-db = { path = "../db" }
mydia-rs-auth = { path = "../auth" }
mydia-rs-entities = { path = "../entities" }
mydia-rs-pubsub = { path = "../pubsub" }
mydia-rs-jobs = { path = "../jobs" }
mydia-rs-models = { path = "../models" }
mydia-rs-metadata = { path = "../metadata" }
mydia-rs-subtitles = { path = "../subtitles" }
mydia-rs-streaming = { path = "../streaming" }
mydia-rs-p2p = { path = "../p2p" }
mydia-rs-downloads = { path = "../downloads" }
mydia-rs-indexers = { path = "../indexers" }
sea-orm = { workspace = true }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite", "postgres"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
time = "0.3"
openidconnect = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
http = "1"
dashmap = "6"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
thiserror = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
async-trait = "0.1"
tempfile = "3"

[lints]
workspace = true
