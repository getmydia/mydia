[package]
name = "mydia-rs-downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart"] }
serde = { workspace = true }
serde_json = "1"
sha1 = "0.10"
strsim = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "process", "io-util", "fs"] }
tracing = { workspace = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

mydia-rs-pubsub = { path = "../pubsub" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
