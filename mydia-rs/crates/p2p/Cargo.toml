[package]
name = "mydia-rs-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# native/mydia_p2p_core is the shared iroh-based host. We consume it as
# a path dep so backend (mydia-rs) and player (Flutter) ship the same
# wire protocol. The crate is scope-locked in U29; we wrap, never modify.
mydia_p2p_core = { path = "../../../native/mydia_p2p_core" }

# Workspace crates we touch directly. Auth's MediaTokenCache is the
# canonical token cache (U6); we wrap it with DB-revoke checking.
# Models supply the RemoteDevice / PairingClaim row structs.
mydia-rs-auth = { path = "../auth" }
mydia-rs-config = { path = "../config" }
mydia-rs-db = { path = "../db" }
mydia-rs-entities = { path = "../entities" }
mydia-rs-models = { path = "../models" }
# U29 follow-up: GraphQL + HLS dispatch adapters. The GraphQL crate
# owns the async-graphql schema; we hand it a verified user context
# and execute requests against it. The streaming crate owns the HLS
# session supervisor; we look up sessions by id and stream files via
# the Host's zero-copy file-range path.
mydia-rs-graphql = { path = "../graphql" }
mydia-rs-streaming = { path = "../streaming" }

# async-graphql comes in via mydia-rs-graphql, but we touch its Request /
# Variables types directly to build the executable request body.
async-graphql = { version = "7", features = ["chrono", "uuid"] }

# Async + concurrency primitives.
tokio.workspace = true
async-trait = "0.1"
dashmap = "6"

# Crypto for device-token hashing + claim-code RNG.
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
base64 = "0.22"

# DB / time / serialisation.
sea-orm.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json = "1"
uuid = { version = "1.20", features = ["v4", "serde"] }

# Errors + tracing.
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
# Dispatch-arm integration tests need a real pubsub bus to drive the
# supervisor and graphql adapter through a realistic boot shape.
mydia-rs-pubsub = { path = "../pubsub" }

[lints]
workspace = true
