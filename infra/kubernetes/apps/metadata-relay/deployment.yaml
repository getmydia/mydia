apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-relay
  namespace: metadata-relay
  labels:
    app.kubernetes.io/name: metadata-relay
    app.kubernetes.io/component: relay-service
  annotations:
    keel.sh/policy: major
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate because we have a single PVC that can't be shared
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-relay
      app.kubernetes.io/component: relay-service
      app.kubernetes.io/part-of: mydia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-relay
        app.kubernetes.io/component: relay-service
        app.kubernetes.io/part-of: mydia
      annotations:
        # Picked up by the monitoring stack's `kubernetes-pods` scrape job.
        # Without these the relay's counters are only visible by curling the
        # pod directly, and they reset to zero on every restart.
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: metadata-relay
          # NOTE: Keel owns this tag at runtime (see keel.sh/* annotations above)
          # and the live deployment is normally ahead of what is pinned here.
          # `kubectl apply -k .` will roll production BACK to this tag, so
          # prefer `kubectl patch` for targeted changes.
          image: ghcr.io/getmydia/mydia/metadata-relay:0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: metadata-relay-config
            - secretRef:
                name: metadata-relay-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: metadata-relay-data
