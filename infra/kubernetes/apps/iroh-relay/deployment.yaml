apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay
  namespace: iroh-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iroh-relay
      app.kubernetes.io/part-of: mydia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/part-of: mydia
      annotations:
        # Picked up by the monitoring stack's `kubernetes-pods` scrape job.
        # relayserver_* counters are process-local and reset on restart, so
        # without scraping there is no history of relay usage at all.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: iroh-relay
          # Pinned by digest as well as tag: a re-published tag cannot swap the
          # binary underneath us.
          #
          # v1.5.0 matches the iroh the server and player link. It closes a
          # connection leak during the relay handshake, drops unencodable
          # packets instead of disconnecting the receiver, and keeps proxy
          # credentials out of the debug log. It carries everything from
          # v1.4.2 (the relay security release) and the rustls fixes
          # (RUSTSEC-2026-0346 to 0349) that arrived in v1.4.0.
          #
          # Before changing this line, run ./verify-image.sh <image>. A plain
          # boot test cannot catch a panic on received traffic (see README.md,
          # the v1.0.3 musl noq-udp incident).
          image: n0computer/iroh-relay:v1.5.0@sha256:50a2f5697d8f69537037503c81b989be17eeb694dbb2d3fdfd5418c9a71c8ec6
          args: ["--config-path", "/config/config.toml"]
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: quic
              containerPort: 7842
              protocol: UDP
              hostPort: 7842
            - name: stun
              containerPort: 3478
              protocol: UDP
              hostPort: 3478
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /generate_204
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /generate_204
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: iroh-relay-config
        - name: certs
          secret:
            secretName: iroh-relay-tls-secret
        - name: data
          persistentVolumeClaim:
            claimName: iroh-relay-data
