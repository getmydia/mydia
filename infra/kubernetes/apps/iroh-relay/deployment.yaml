apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay
  namespace: iroh-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iroh-relay
      app.kubernetes.io/part-of: mydia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/part-of: mydia
      annotations:
        # Picked up by the monitoring stack's `kubernetes-pods` scrape job.
        # relayserver_* counters are process-local and reset on restart, so
        # without scraping there is no history of relay usage at all.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: iroh-relay
          # Pinned by digest as well as tag: a re-published tag cannot swap the
          # binary underneath us.
          #
          # Held back from v1.0.3. That image is a static musl build carrying
          # noq-udp 1.1.0, which panics on the FIRST received datagram
          # (n0-computer/noq#774: musl declares cmsghdr with align 4, but the
          # SCM_TIMESTAMPNS path decodes a timespec with align 8, and
          # SO_TIMESTAMPNS is set unconditionally on Linux). Rolling it out on
          # 2026-08-19 put the relay into CrashLoopBackOff and was rolled back.
          # Only iroh 1.0.3 took noq 1.1.0; 1.0.1 and 1.0.2 are on noq 1.0.x.
          #
          # Before changing this line, run ./verify-image.sh <image>. A plain
          # boot test cannot catch this: the panic needs real UDP traffic.
          image: n0computer/iroh-relay:v1.0.0@sha256:0124f8c335d9ad6618db13dc580b597ad5f1be0c987b6742696f4c1f5e325720
          args: ["--config-path", "/config/config.toml"]
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: quic
              containerPort: 7842
              protocol: UDP
              hostPort: 7842
            - name: stun
              containerPort: 3478
              protocol: UDP
              hostPort: 3478
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /generate_204
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /generate_204
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: iroh-relay-config
        - name: certs
          secret:
            secretName: iroh-relay-tls-secret
        - name: data
          persistentVolumeClaim:
            claimName: iroh-relay-data
