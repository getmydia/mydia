apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus-configmap.yaml
  - prometheus-pvc.yaml
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - grafana-configmap.yaml
  - grafana-dashboard-configmap.yaml
  - grafana-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - ingress.yaml
  # Note: grafana-secret.yaml must be created from grafana-secret.yaml.example
  # and applied separately, or let the deploy script create it

labels:
  - pairs:
      app.kubernetes.io/part-of: mydia
    # Not into selectors: they are immutable, and grafana's (app: grafana)
    # predates this kustomization. prometheus names part-of in its own
    # selector, so it is unaffected.
    includeSelectors: false
    includeTemplates: true
