<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- For daisyUI's theme variables and the host font only. The host compiles
       utility classes for its own templates, so this page uses none of them. -->
  <link rel="stylesheet" href="/assets/css/app.css" />
  <title>Assistant</title>
  <style>__APP_CSS__</style>
</head>
<body>
  <header class="as-bar">
    <div class="as-col as-bar-row">
      <div class="as-chats">
        <button type="button" id="chat-pill" class="as-title-btn" aria-haspopup="listbox" aria-expanded="false" title="Your chats">
          <span id="chat-title">New chat</span>
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.2 7.2a.75.75 0 0 1 1.06 0L10 10.94l3.74-3.74a.75.75 0 1 1 1.06 1.06l-4.27 4.27a.75.75 0 0 1-1.06 0L5.2 8.26a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
        <div id="chat-popover" class="as-popover as-popover-down" hidden>
          <input id="chat-filter" class="as-filter" placeholder="Search chats" autocomplete="off" aria-label="Search chats" />
          <ul id="chat-list" class="as-model-list" role="listbox"></ul>
        </div>
      </div>
      <button type="button" id="new-chat" class="as-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>
  </header>
  <main id="log" class="as-log">
    <div class="as-col">
      <section id="empty" class="as-empty" hidden>
        <div class="as-mark as-mark-lg" aria-hidden="true">✦</div>
        <h1>What can I help with?</h1>
        <p>Search your library, organize collections, mark things watched and add media. Every change can be undone.</p>
        <div class="as-chips">
          <button type="button" class="as-chip">What did I add this week?</button>
          <button type="button" class="as-chip">Find unwatched movies under two hours</button>
          <button type="button" class="as-chip">Make a collection of my favorite comedies</button>
          <button type="button" class="as-chip">What's still downloading?</button>
        </div>
      </section>
      <div id="turns" class="as-turns" aria-live="polite"></div>
    </div>
  </main>
  <footer class="as-dock">
    <div class="as-col">
      <div id="notice" class="as-notice" role="status" hidden></div>
      <form id="composer" class="as-composer">
        <textarea id="message" rows="1" placeholder="Ask about your library…" autocomplete="off" aria-label="Message"></textarea>
        <div class="as-composer-row">
          <div class="as-model">
            <button type="button" id="model-pill" class="as-pill" aria-haspopup="listbox" aria-expanded="false">
              <span id="model-label">Loading models…</span>
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.2 7.2a.75.75 0 0 1 1.06 0L10 10.94l3.74-3.74a.75.75 0 1 1 1.06 1.06l-4.27 4.27a.75.75 0 0 1-1.06 0L5.2 8.26a.75.75 0 0 1 0-1.06Z"/></svg>
            </button>
            <div id="model-popover" class="as-popover" hidden>
              <input id="model-filter" class="as-filter" placeholder="Filter or type a model id" autocomplete="off" aria-label="Model" />
              <ul id="model-list" class="as-model-list" role="listbox"></ul>
            </div>
          </div>
          <button id="send" class="as-send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </div>
  </footer>
  <script>__MARKDOWN_JS__</script>
  <script>__CHATS_JS__</script>
  <script>__APP_JS__</script>
</body>
</html>
