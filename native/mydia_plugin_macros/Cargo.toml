[package]
name = "mydia-plugin-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macros for the Mydia plugin SDK (the #[mydia_plugin_sdk::plugin] attribute). Re-exported by mydia-plugin-sdk; not used directly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/getmydia/mydia"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Copied from rust-lints.toml; scripts/check-rust-lints.sh keeps it in sync.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we opt out of.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Panic-free non-test code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Hygiene.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
