[package]
name = "mydia-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Mydia plugin authoring SDK: typed WASM component-model bindings and the #[mydia_plugin_sdk::plugin] macro for writing Mydia plugins in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/getmydia/mydia"
# examples/minimal is a standalone scaffold crate, not a cargo example target.
autoexamples = false
# Published for external (community-repo) plugin authors. The canonical contract
# lives in wit/plugin.wit and is the single source of truth shared with the
# Elixir host. wit-bindgen generation + the #[mydia_plugin_sdk::plugin] macro land in U5/U6.

[lib]

[dependencies]
wit-bindgen = "0.61.1"
mydia-plugin-macros = { version = "0.1.0", path = "../mydia_plugin_macros" }

# Copied from rust-lints.toml; scripts/check-rust-lints.sh keeps it in sync.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we opt out of.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Panic-free non-test code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Hygiene.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
