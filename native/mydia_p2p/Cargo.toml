[package]
name = "mydia_p2p"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "mydia_p2p"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38.0"
mydia_p2p_core = { path = "../mydia_p2p_core" }
tokio = { version = "1.49", features = ["rt-multi-thread", "sync"] }
anyhow = "1.0"
tempfile = "3.24"
serde_json = "1.0"

# Copied from rust-lints.toml; scripts/check-rust-lints.sh keeps it in sync.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we opt out of.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Panic-free non-test code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Hygiene.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
