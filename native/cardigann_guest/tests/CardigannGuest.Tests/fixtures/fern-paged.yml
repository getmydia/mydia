id: fern
name: Fern
description: Invented public tracker with two search paths
language: en-US
type: public
encoding: UTF-8
links:
  - https://fern.invalid/
caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: Movies}
    - {id: 2, cat: TV, desc: TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
settings: []
search:
  paths:
    - path: movies
    - path: shows
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: table.results > tbody > tr
  fields:
    title:
      selector: td.name a
    details:
      selector: td.name a
      attribute: href
    download:
      selector: td.dl a
      attribute: href
    category:
      selector: td.cat
    size:
      selector: td.size
    seeders:
      selector: td.seed
    leechers:
      selector: td.leech
