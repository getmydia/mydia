services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydia_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres

  app:
    image: mydia-app:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mydia_dev
    environment:
      # User mapping for host filesystem permissions
      # Set via ./dev script to match host user
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}

      # Phoenix configuration
      PHX_HOST: localhost
      PORT: 4000
      SECRET_KEY_BASE: "VlPUd2fbnWjh6Di+7SGc2SSXpNhI0hN766FFAlct65wU5ARyiGvK9r3TqSqKyu0K"

      # Database configuration (SQLite)
      DATABASE_PATH: /app/mydia_dev.db

      # Mix environment
      MIX_ENV: dev

      # Rust logging for p2p NIF
      RUST_LOG: info

      # Metadata relay configuration
      METADATA_RELAY_URL: ${METADATA_RELAY_URL:-https://relay.mydia.dev}
      METADATA_LANGUAGE: ${METADATA_LANGUAGE:-en-US}

      # P2P bind port for direct connections (iroh hole punching)
      # Must match the exposed UDP port below
      P2P_BIND_PORT: 4000

      # For interactive debugging
      MIX_HOME: /app/.mix
      HEX_HOME: /app/.hex

      # Flutter cache
      PUB_CACHE: /app/player/.pub-cache
    network_mode: host
    volumes:
      # Mount source code for live reloading
      - .:/app

      # Persist build artifacts and dependencies across restarts
      - build_cache:/app/_build
      - deps_cache:/app/deps
      - mix_cache:/app/.mix
      - hex_cache:/app/.hex
      - node_modules:/app/assets/node_modules
      # Persist NIF cache to avoid redownloading/recompiling on every run
      - elixir_make_cache:/root/.cache/elixir_make
      # Persist Flutter pub cache
      - player_pub_cache:/app/player/.pub-cache
      # Isolate Flutter environment-specific directories from host (nix develop)
      # These contain SDK-specific artifacts that conflict between environments
      - player_dart_tool:/app/player/.dart_tool
      - player_build:/app/player/build
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # mydia-rs Rust backend dev server. `./dev rs up` starts both this
  # container and the rs-frontend Vite dev server. Host networking lets
  # the Vite proxy reach axum at localhost:4002 directly.
  rs:
    image: mydia-rs-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev.rs
    container_name: mydia_rs_dev
    environment:
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}

      # Runtime config for the dev server. Matches the env block in
      # nix/devenv/flake-module.nix so the existing config keys line
      # up — Postgres values can be flipped on at runtime by editing
      # compose.override.yml without rebuilding the image.
      MYDIA_DATABASE__TYPE: sqlite
      MYDIA_DATABASE__PATH: /app/mydia_dev.db
      MYDIA_SERVER__HOST: 0.0.0.0
      MYDIA_SERVER__PORT: 4002
      MYDIA_LOGGING__LEVEL: info
      MYDIA_LOGGING__FORMAT: text

      # Skip the U34 lock so kill-restart on a full rebuild
      # doesn't trip the 30-second staleness window. Dev only.
      MYDIA_RS_DEV_SKIP_LOCK: "true"

      # sqlx-cli + compile-time query macros.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/mydia_rs_test?sslmode=disable

      # Frontend is built by rs-frontend container; skip in rs.
      SKIP_FRONTEND_BUILD: "true"

      # Logging
      RUST_LOG: info,tower_http=debug
      RUST_BACKTRACE: "1"
    network_mode: host
    volumes:
      - .:/app
      - rs_cargo_registry:/usr/local/cargo/registry
      - rs_cargo_git:/usr/local/cargo/git
      - rs_target:/app/mydia-rs/target
    stdin_open: true
    tty: true
    restart: unless-stopped
    profiles:
      - rs

  # Vite dev server for mydia-rs React frontend (HMR on :5173).
  # Proxies /graphql, /api, /auth to the rs container at localhost:4002.
  # The operator SSH-forwards :5173 and nothing else.
  rs-frontend:
    image: mydia-rs-frontend-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev.rs-frontend
    container_name: mydia_rs_frontend_dev
    environment:
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}
    network_mode: host
    volumes:
      - .:/app
      - rs_frontend_node_modules:/app/mydia-rs/frontend/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - rs
    profiles:
      - rs

volumes:
  player_pub_cache:
    driver: local
  # Flutter environment isolation (prevents conflicts with nix develop)
  player_dart_tool:
    driver: local
  player_build:
    driver: local
  # Named volumes for caching
  build_cache:
    driver: local
  deps_cache:
    driver: local
  mix_cache:
    driver: local
  hex_cache:
    driver: local
  node_modules:
    driver: local
  elixir_make_cache:
    driver: local
  # PostgreSQL data (only used with --profile postgres)
  postgres_data:
    driver: local
  # mydia-rs caches (only used with --profile rs)
  rs_cargo_registry:
    driver: local
  rs_cargo_git:
    driver: local
  rs_target:
    driver: local
  rs_frontend_node_modules:
    driver: local
