targets:
  $default:
    builders:
      riverpod_generator:
        # Scope the generator to hand-written sources only. A bare
        # `lib/**/*.dart` also matches generated output — riverpod's own
        # `*.g.dart`, freezed's `*.freezed.dart`, the flutter_rust_bridge
        # bindings under lib/native/, and graphql_codegen's
        # lib/graphql/generated/ — which feeds a generator its own outputs as
        # inputs. That produced an endless "Starting build #N with updated
        # builders" rebuild loop on macOS CI (Linux and Windows happened to
        # survive it), which only surfaced once the frb bindings were
        # regenerated for 2.12.0.
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/native/**
            - lib/graphql/generated/**
            - lib/**/*.g.dart
            - lib/**/*.freezed.dart
        options:
          # Riverpod generator options

      graphql_codegen:
        enabled: true
        options:
          # Path to the GraphQL schema file (symlink to shared server schema)
          schema: lib/graphql/schema.graphql

          # Generate typed queries, mutations, and fragments
          queries_glob: lib/graphql/**/*.graphql

          # Output directory for generated code
          output_dir: lib/graphql/generated

          # Naming conventions
          naming_scheme: pathedWithFields

          # Generate nullable fields as optional
          nullable_fields: true

          # Additional options
          add_query_prefix: false
          scalar_mapping:
            - graphql_type: DateTime
              dart_type: DateTime
            - graphql_type: Date
              dart_type: DateTime
