fragment MediaFileFragment on MediaFile {
  id
  resolution
  codec
  audioCodec
  hdrFormat
  size
  bitrate
  directPlaySupported
  streamUrl
  directPlayUrl
  # preferredSubtitle is NOT here on purpose. See subtitle_preference.graphql.
  subtitles {
    trackId
    language
    title
    format
    embedded
    deliverable
    forced
    hearingImpaired
    url(format: VTT)
  }
}
