fragment MediaFileFragment on MediaFile {
  id
  resolution
  codec
  audioCodec
  hdrFormat
  size
  bitrate
  directPlaySupported
  streamUrl
  directPlayUrl
  subtitles {
    trackId
    language
    title
    format
    embedded
    deliverable
    forced
    hearingImpaired
    url(format: VTT)
  }
  preferredSubtitle {
    mode
    language
    forced
    hearingImpaired
    trackTitle
  }
}
