#import '../fragments/artwork_fragment.graphql'
#import '../fragments/progress_fragment.graphql'

# Documents only the Mydia source sends.

query MydiaInstanceIdentity {
  serverCompatibility {
    instanceId
  }
}

query MydiaContinueWatching($first: Int) {
  continueWatching(first: $first) {
    id
    type
    title
    tmdbId
    tvdbId
    imdbId
    showId
    showTitle
    seasonNumber
    episodeNumber
    artwork {
      ...ArtworkFragment
    }
    progress {
      ...ProgressFragment
    }
    files {
      id
    }
  }
}

# Before the catalogue ids (tmdbId, tvdbId, imdbId) on ContinueWatchingItem.
query MydiaContinueWatchingNoIds($first: Int) {
  continueWatching(first: $first) {
    id
    type
    title
    showId
    showTitle
    seasonNumber
    episodeNumber
    artwork {
      ...ArtworkFragment
    }
    progress {
      ...ProgressFragment
    }
    files {
      id
    }
  }
}
