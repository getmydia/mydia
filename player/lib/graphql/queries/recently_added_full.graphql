query RecentlyAddedFull($first: Int) {
  recentlyAdded(first: $first) {
    id
    type
    title
    year
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    addedAt
    newEpisodeCount
    latestSeasonNumber
    latestEpisodeNumber
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}
