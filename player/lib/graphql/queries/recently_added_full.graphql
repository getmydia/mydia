query RecentlyAddedFull($first: Int) {
  recentlyAdded(first: $first) {
    id
    type
    title
    year
    tmdbId
    tvdbId
    imdbId
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    addedAt
    newEpisodeCount
    latestSeasonNumber
    latestEpisodeNumber
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}

# Servers before 0.17.0 lack tmdbId/tvdbId/imdbId on RecentlyAddedItem.
query RecentlyAddedFullNoIds($first: Int) {
  recentlyAdded(first: $first) {
    id
    type
    title
    year
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    addedAt
    newEpisodeCount
    latestSeasonNumber
    latestEpisodeNumber
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}
