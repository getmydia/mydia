#import '../fragments/artwork_fragment.graphql'

query Search($query: String!, $types: [SearchResultType], $first: Int) {
  search(query: $query, types: $types, first: $first) {
    totalCount
    sections {
      type
      totalCount
      results {
        id
        type
        title
        year
        subtitle
        seasonNumber
        episodeNumber
        parentId
        score
        artwork {
          ...ArtworkFragment
        }
      }
    }
  }
}
