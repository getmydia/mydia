query UnwatchedListing($first: Int, $after: String, $types: [MediaType], $category: MediaCategory, $sort: SortInput) {
  unwatched(first: $first, after: $after, types: $types, category: $category, sort: $sort) {
    id
    title
    year
    type
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}

query FavoritesListing($first: Int, $after: String, $types: [MediaType], $category: MediaCategory, $sort: SortInput) {
  favorites(first: $first, after: $after, types: $types, category: $category, sort: $sort) {
    id
    title
    year
    type
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}
