#import '../fragments/artwork_fragment.graphql'
#import '../fragments/progress_fragment.graphql'
#import '../fragments/watch_status_fragment.graphql'

# Documents only a guest Mydia source sends. The home screens keep their own
# queries; these add the sort argument the source browse screen needs.

query GuestInstanceIdentity {
  serverCompatibility {
    instanceId
  }
}

query GuestMovies($first: Int, $after: String, $sort: SortInput) {
  movies(first: $first, after: $after, sort: $sort) {
    edges {
      node {
        id
        title
        year
        addedAt
        runtime
        artwork {
          ...ArtworkFragment
        }
        progress {
          ...ProgressFragment
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GuestTvShows($first: Int, $after: String, $sort: SortInput) {
  tvShows(first: $first, after: $after, sort: $sort) {
    edges {
      node {
        id
        title
        year
        addedAt
        seasonCount
        artwork {
          ...ArtworkFragment
        }
        watchStatus {
          ...WatchStatusFragment
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GuestRecentlyAdded($first: Int) {
  recentlyAdded(first: $first) {
    id
    type
    title
    year
    addedAt
    artwork {
      ...ArtworkFragment
    }
  }
}

query GuestContinueWatching($first: Int) {
  continueWatching(first: $first) {
    id
    type
    title
    showId
    showTitle
    seasonNumber
    episodeNumber
    artwork {
      ...ArtworkFragment
    }
    progress {
      ...ProgressFragment
    }
    files {
      id
    }
  }
}
