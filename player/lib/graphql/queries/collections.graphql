query Collections($first: Int) {
  collections(first: $first) {
    id
    name
    description
    type
    visibility
    itemCount
    posterPaths
  }
}

query CollectionItems($collectionId: ID!, $first: Int) {
  collectionItems(collectionId: $collectionId, first: $first) {
    id
    type
    title
    year
    tmdbId
    tvdbId
    imdbId
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    addedAt
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}

# Before the catalogue ids (tmdbId, tvdbId, imdbId) on RecentlyAddedItem.
query CollectionItemsNoIds($collectionId: ID!, $first: Int) {
  collectionItems(collectionId: $collectionId, first: $first) {
    id
    type
    title
    year
    artwork {
      posterUrl
      backdropUrl
      thumbnailUrl
    }
    addedAt
    watchStatus { watched percentage unwatchedEpisodeCount }
  }
}
