include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - avoid_print
    - avoid_unnecessary_containers
    - use_key_in_widget_constructors
    - avoid_dynamic_calls
    - unawaited_futures
    - close_sinks
    - cancel_subscriptions
    - only_throw_errors

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.graphql.dart"
    - "lib/native/frb_generated*.dart"
    # gen-l10n output. It still lists flutter_localizations' deprecated Material
    # and Cupertino delegates, which the app does not use: appLocalizationsDelegates
    # (lib/l10n/locale_aliases.dart) supplies material_ui's and cupertino_ui's.
    - "lib/l10n/gen/**"
    - "rust_builder/cargokit/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
