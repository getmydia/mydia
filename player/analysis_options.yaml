include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - avoid_print
    - avoid_unnecessary_containers
    - use_key_in_widget_constructors
    - avoid_dynamic_calls
    - unawaited_futures
    - close_sinks
    - cancel_subscriptions
    - only_throw_errors

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.graphql.dart"
    - "lib/native/frb_generated*.dart"
    - "rust_builder/cargokit/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
    # Flutter 3.50 deprecates package:flutter/material.dart and cupertino.dart
    # in favour of material_ui and cupertino_ui. The material_ui migration PR
    # moves every import over and removes this line.
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
