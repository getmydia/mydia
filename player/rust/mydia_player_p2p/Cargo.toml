[package]
name = "mydia_player_p2p"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` is here for wasm-pack, which refuses to build a crate without it.
# cargokit only ever asks for the other two.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
serde_json = "1.0"
# Only `sync` (channels, Mutex): this crate never spawns its own runtime, it
# always enters mydia_p2p_core's via `runtime::enter`/`runtime::spawn`. Named
# unconditionally rather than split by target because `sync` alone compiles
# unchanged on wasm32-unknown-unknown, same as it does for mydia_p2p_core.
tokio = { version = "1.49", features = ["sync"] }

# mydia_p2p_core is named only inside the target sections below, never here.
# Cargo unifies features additively, so one untargeted line taking the core
# with its defaults would switch the `host` feature back on for the browser
# build too, and the server role does not compile for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mydia_p2p_core = { path = "../../../native/mydia_p2p_core" }
# Free space on the volume the playback spool writes to. A browser has no
# filesystem to ask.
fs4 = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
mydia_p2p_core = { path = "../../../native/mydia_p2p_core", default-features = false }
# No tracing subscriber in a browser (see `init_app`). `log` is what makes
# every tracing event fall through to the `log` crate while no subscriber is
# installed, and flutter_rust_bridge has already pointed `log` at the browser
# console by then.
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
tracing-android = "0.2"

# Never strip build scripts or proc-macros. Rust 1.96's bundled objcopy writes
# Mach-O string tables that macOS 27's dyld rejects ("mis-aligned LINKEDIT
# string pool"), so rustc cannot load a stripped proc-macro and the build fails
# with `E0463 can't find crate for tokio_macros` (rust-lang/rust#157750).
# None of these artifacts ship, so this costs nothing in the app.
#
# This lives in the manifest, not only in the repo-root .cargo/config.toml,
# because cargokit runs cargo from a directory under Xcode's build dir and cargo
# looks for config files starting at the cwd. Remove both once
# rust-toolchain.toml reaches 1.98 or later.
[profile.release.build-override]
strip = false

# Copied from rust-lints.toml; scripts/check-rust-lints.sh keeps it in sync.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we opt out of.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Panic-free non-test code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Hygiene.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
