// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.mydia_player_p2p'
version '1.0'

// No buildscript classpath: the app's settings.gradle.kts supplies the
// Android Gradle Plugin, and a library may not pin an older one under AGP 9.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.mydia_player_p2p'
    }

    // Flutter 3.50's default compileSdkVersion (FlutterExtension.kt).
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust/mydia_player_p2p"
    libname = "mydia_player_p2p"
}
