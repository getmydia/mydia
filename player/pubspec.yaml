name: player
description: Mydia media player client application
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floor raised from 3.3.0 by liquid_glass_widgets, which requires Dart
  # >=3.5.0. The toolchain in player/.fvmrc (Flutter 3.44.2) ships a much
  # newer Dart than either bound, so this only tightens what the manifest
  # *claims* to support; nothing in resolution or CI changes.
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  elliptic: ^0.3.12
  pointycastle: ^4.0.0
  convert: ^3.1.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  graphql_flutter: ^5.1.0
  # >=10.3.1 pulls flutter_secure_storage_darwin >=0.3.2. Earlier darwin builds
  # read the macOS option under the wrong key ("useDataProtectionKeyChain"), so
  # usesDataProtectionKeychain was ignored and every keychain call failed with
  # -34018 on an app signed without a keychain access group.
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  http: ^1.1.0
  shimmer: ^3.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  dio: ^5.4.0
  path_provider: ^2.1.0
  dart_cast: 0.7.3
  bonsoir: ^7.0.0
  web: ^1.0.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  uuid: ^4.5.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.0
  flutter_rust_bridge: ^2.0.0
  mydia_player_p2p:
    path: rust_builder
  flutter_foreground_task: ^10.0.0
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.4
  freezed_annotation: ^3.1.0
  window_manager: ^0.5.2
  # Direct, not transitive: window geometry restore needs the display work
  # areas to decide whether a saved rect is still reachable.
  screen_retriever: ^0.2.2
  # Supplies the playback chrome's glass material only (GlassContainer,
  # LiquidGlassSettings, GlassQuality) — see GlassSurface.playerChrome. None of
  # the package's widget kit (GlassScaffold, GlassButton, GlassTextField, ...)
  # is used, and nothing outside `glass_surface.dart` may import it: that one
  # file is the seam that keeps a rollback to a plain BackdropFilter a
  # single-file revert.
  #
  # Pinned exact, not caret. The package is pre-1.0 (0.29.x) and ships
  # breaking changes on minor bumps, and the fragment shaders behind
  # LiquidGlassSettings are what the OSD's whole appearance rides on. An
  # unattended `pub upgrade` moving this is a visual regression nobody
  # reviewed.
  liquid_glass_widgets: 0.29.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.0+1
  graphql_codegen: ^3.0.0
  mockito: ^5.4.0
  # Used directly by five test files to drive Timer.periodic without real
  # waits. It already arrived transitively via flutter_test, so declaring it
  # pins the same resolved version and only stops the analyzer flagging every
  # importer with depend_on_referenced_packages.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.3
  hive_ce_generator: ^1.10.0
  freezed: ^3.2.3
  yaml: ^3.1.2

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  image_path: "assets/icon.png"
  image_path_ios: "assets/icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-LICENSE.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
