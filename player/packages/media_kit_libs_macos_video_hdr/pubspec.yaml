name: media_kit_libs_macos_video
description: macOS libmpv for package:media_kit, built from getmydia/libmpv-darwin-build with HDR output support (libplacebo, MoltenVK).
version: 1.1.4
homepage: https://github.com/getmydia/libmpv-darwin-build
repository: https://github.com/getmydia/libmpv-darwin-build

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MediaKitLibsMacosVideoPlugin
