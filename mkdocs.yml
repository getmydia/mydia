site_name: Mydia Documentation
site_description: A modern, self-hosted media management platform for tracking, organizing, and monitoring your media library
site_url: https://docs.mydia.dev
repo_url: https://github.com/getmydia/mydia
repo_name: getmydia/mydia
docs_dir: docs
site_dir: _site

# Planning artifacts live under docs/ but must never be published.
# MkDocs builds every .md in docs_dir regardless of nav, so excluding
# them here is what keeps local builds matching CI.
exclude_docs: |
  plans/
  brainstorms/
  research/
  solutions/
  superpowers/

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Using Mydia:
      - Tutorials:
          - using/tutorials/get-mydia-running.md
      - How-to guides:
          - using/how-to/install-docker-compose.md
          - using/how-to/connect-download-client.md
          - using/how-to/connect-indexer.md
          - using/how-to/cardigann-indexers.md
          - using/how-to/manage-libraries.md
          - using/how-to/add-media.md
          - using/how-to/quality-profiles.md
          - using/how-to/manage-users.md
          - using/how-to/sso-oidc.md
          - using/how-to/postgresql.md
          - using/how-to/reverse-proxy.md
          - using/how-to/remote-access.md
      - Reference:
          - using/reference/environment-variables.md
          - using/reference/configuration.md
          - using/reference/library-types.md
          - using/reference/download-clients.md
          - using/reference/indexers.md
          - using/reference/quality-profiles.md
          - using/reference/database.md
          - using/reference/api.md
  - Building Plugins:
      - plugins/index.md
      - How-to guides:
          - plugins/how-to/media-data.md
      - Reference:
          - plugins/reference/manifest.md
          - plugins/reference/host-api.md
  - Contributing:
      - contributing/setup.md
      - contributing/testing.md
      - contributing/e2e-testing.md
      - contributing/architecture.md
  - getting-started/first-steps.md

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/getmydia/mydia
