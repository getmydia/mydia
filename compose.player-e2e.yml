# Docker Compose for Player E2E Integration Tests
#
# This runs the full stack with Flutter integration tests:
# - metadata-relay: Used by backend claim-code flow during pairing
# - mydia: Main application
# - test: Flutter Linux desktop integration test runner
#
# How it works:
# Tests run on native Linux (`flutter test -d linux`) under xvfb so the
# iroh P2P code path is exercised. This is intentionally not web/chrome.
#
# No service defines a `build:` block. Images are pulled by default, and CI
# or `./dev player e2e --build` builds and tags them beforehand, so
# `docker compose build` against this file does nothing.
#
# Usage:
#   ./dev player e2e                 # pull prebuilt images and run
#   ./dev player e2e --build         # build all three locally first
#   docker compose -f compose.player-e2e.yml up --abort-on-container-exit
#   docker compose -f compose.player-e2e.yml down -v

services:
  # ============================================
  # Metadata Relay Service
  # ============================================
  relay:
    # Every service names its image explicitly rather than letting compose
    # derive a tag from the project directory. A derived tag makes a git
    # worktree and CI disagree, so a build step tags something that
    # `docker compose up` then cannot find. Registry refs with an env override
    # avoid that by construction, and the `build:` blocks are gone because CI
    # and `./dev player e2e --build` now build and tag images themselves.
    image: ${RELAY_E2E_IMAGE:-ghcr.io/getmydia/mydia/metadata-relay:master}
    container_name: e2e_relay
    environment:
      PORT: "4001"
      SQLITE_DB_PATH: /data/relay.db
      DASHBOARD_USERNAME: "admin"
      DASHBOARD_PASSWORD: "admin"
      LIBP2P_RENDEZVOUS_ENABLED: "true"
      RENDEZVOUS_MASTER_PEPPER: "test-pepper-not-for-production"
      # No API keys needed for E2E tests (not testing metadata fetching)
    volumes:
      - relay_data:/data
    ports:
      - "14001:4001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 10
    networks:
      - e2e

  # ============================================
  # Mydia Main Application
  # ============================================
  mydia:
    image: ${MYDIA_E2E_IMAGE:-ghcr.io/getmydia/mydia:master}
    entrypoint: ["/e2e/server-entrypoint.sh"]
    container_name: e2e_mydia
    environment:
      # Phoenix config
      PHX_HOST: mydia
      PHX_SERVER: "true"
      PORT: "4000"
      HTTPS_PORT: "4443"
      SECRET_KEY_BASE: "E2ETestSecretKeyBase123456789012345678901234567890123456789012345"
      GUARDIAN_SECRET_KEY: "E2ETestGuardianSecretKey12345678901234567890123456789012345678"

      # Database
      DATABASE_PATH: /config/mydia.db
      MIX_ENV: prod

      # Relay connection
      METADATA_RELAY_URL: "http://relay:4001"

      # E2E test mode - auto-enable remote access
      E2E_MODE: "true"
      ENABLE_REMOTE_ACCESS: "true"
      E2E_ADMIN_EMAIL: "admin@test.local"
      E2E_ADMIN_PASSWORD: "testpassword123"

      # Disable HTTPS origin checks for E2E
      PHX_CHECK_ORIGIN: "false"

      # Direct URLs config for E2E testing
      # Use HTTP instead of HTTPS for sslip.io URLs (required for E2E since we don't have certs)
      EXTERNAL_PORT: "4000"
      PUBLIC_IP_ENABLED: "false"
      DIRECT_URLS_USE_HTTP: "true"
    volumes:
      - mydia_config:/config
      - mydia_data:/data
      - ./scripts/e2e:/e2e:ro
    ports:
      - "14000:4000"
      - "14443:4443"
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      # Gated on both the HTTP health endpoint and the seeding sentinel
      # (scripts/e2e/server-entrypoint.sh), so dependents never start against
      # a container whose seed step failed. start_period covers boot plus
      # migrations plus seeding (ffmpeg generation and three separate
      # `mydia rpc` calls, each of which boots its own BEAM node), measured
      # around 16-17s end to end on a warm local image; 90s leaves a wide
      # margin for slower CI runners.
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health && test -f /tmp/e2e-seeded"]
      interval: 2s
      timeout: 2s
      start_period: 90s
      retries: 20
    networks:
      - e2e

  # ============================================
  # Flutter Integration Test Runner
  # ============================================
  # The test container is a Flutter toolbox image with the repo bind-mounted
  # at runtime; it runs tests natively with `flutter test -d linux` under
  # xvfb, not Chrome.
  test:
    image: ${PLAYER_E2E_TOOLBOX_IMAGE:-ghcr.io/getmydia/mydia/player-e2e-toolbox:master}
    entrypoint: ["/e2e/run-tests.sh"]
    working_dir: /workspace/player
    container_name: e2e_test
    volumes:
      # The repo root, so player/lib/graphql/schema.graphql resolves through
      # its real symlink and native/mydia_p2p_core resolves at its natural
      # relative path. Both hacks in the old Dockerfile go away.
      - .:/workspace
      - ./scripts/e2e:/e2e:ro
      # Anonymous volumes masking host build output. Without these the
      # container sees host-built artifacts containing host paths, which is
      # what the old entrypoint's manual rm -rf calls were working around.
      - /workspace/player/build
      - /workspace/player/.dart_tool
      - /workspace/player/linux/flutter/ephemeral
      - /workspace/player/rust_builder/target
    environment:
      # Backend service URLs (test container is on the e2e network)
      MYDIA_URL: "http://mydia:4000"
      RELAY_URL: "http://relay:4001"

      # Test selection (set by ./dev player e2e --target/-- args)
      E2E_TEST_TARGET: ${E2E_TEST_TARGET:-integration_test/all_tests.dart}
      E2E_TEST_ARGS: ${E2E_TEST_ARGS:-}

      # Test admin credentials
      E2E_ADMIN_EMAIL: "admin@test.local"
      E2E_ADMIN_PASSWORD: "testpassword123"
    depends_on:
      mydia:
        condition: service_healthy
      relay:
        condition: service_healthy
    networks:
      - e2e
    # Test runner exits when done

networks:
  e2e:
    driver: bridge

volumes:
  relay_data:
    driver: local
  mydia_config:
    driver: local
  mydia_data:
    driver: local
