repos:
  - repo: local
    hooks:
      # Elixir / Phoenix
      - id: mix-format
        name: mix format
        entry: ./dev mix format --check-formatted
        language: system
        files: '\.(?:ex|exs|heex)$'
        pass_filenames: false

      # Rust (native NIFs) — only the Rustler crate; mydia-rs has its own hooks below.
      - id: cargo-fmt
        name: cargo fmt (native NIFs)
        entry: cargo fmt --manifest-path native/mydia_p2p/Cargo.toml -- --check
        language: system
        files: '^native/.*\.rs$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (native NIFs)
        entry: cargo clippy --manifest-path native/mydia_p2p/Cargo.toml -- -D warnings
        language: system
        files: '^native/.*\.rs$'
        pass_filenames: false

      # Rust (mydia-rs backend) — workspace-wide pedantic clippy. Matches
      # the CI gate: `--workspace --all-targets -- -D warnings`. Pedantic
      # preset + allow-list lives in mydia-rs/Cargo.toml's `[workspace.lints]`.
      - id: mydia-rs-fmt
        name: mydia-rs cargo fmt
        entry: cargo fmt --manifest-path mydia-rs/Cargo.toml --all -- --check
        language: system
        files: '^mydia-rs/.*\.rs$'
        pass_filenames: false

      - id: mydia-rs-clippy
        name: mydia-rs cargo clippy
        entry: cargo clippy --manifest-path mydia-rs/Cargo.toml --workspace --all-targets -- -D warnings
        language: system
        files: '^mydia-rs/.*\.rs$'
        pass_filenames: false

      # Flutter / Dart
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed --line-length 80
        language: system
        files: '\.dart$'
        exclude: '\.(?:g|freezed)\.dart$'

      - id: dart-analyze
        name: dart analyze
        entry: dart analyze --fatal-warnings
        language: system
        files: '\.dart$'
        exclude: '\.(?:g|freezed)\.dart$'
        pass_filenames: false
