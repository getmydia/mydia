[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
async-graphql-parser = "7"
argon2 = "0.5"
axum = "0.8"
base64 = "0.23"
bytes = "1"
figment = { version = "0.10", features = ["yaml", "env"] }
futures-util = "0.3"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
mydia-library = { path = "crates/library" }
mydia-streaming = { path = "crates/streaming" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
