---
# Invented Gazelle-style tracker: a form login whose CSRF token sits outside
# the form (read with selectorinputs), a cookie session, an HTML torrents.php
# search, and download links carrying authkey and torrent_pass.
id: vellum
name: Vellum
description: Invented Gazelle-style private tracker for tests
language: en-US
type: private
encoding: UTF-8
links:
  - https://vellum.invalid/

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Movies"}
    - {id: 2, cat: TV, desc: "TV"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password

login:
  path: login.php
  method: form
  form: form#loginform
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    keeplogged: 1
  selectorinputs:
    auth:
      selector: meta[name="csrf-token"]
      attribute: content
  error:
    - selector: form#loginform .warning
  test:
    path: index.php
    selector: a[href^="logout.php"]

search:
  paths:
    - path: torrents.php
  inputs:
    searchstr: "{{ .Keywords }}"
    action: basic

  rows:
    selector: table#torrent_table > tbody > tr.torrent

  fields:
    category:
      selector: td.cat
    title:
      selector: a[href^="torrents.php?id="]
    details:
      selector: a[href^="torrents.php?id="]
      attribute: href
    download:
      selector: a[href^="torrents.php?action=download"]
      attribute: href
    size:
      selector: td.size
    grabs:
      selector: td.snatches
    seeders:
      selector: td.seeders
    leechers:
      selector: td.leechers
    downloadvolumefactor:
      case:
        strong.freeleech: 0
        "*": 1
    uploadvolumefactor:
      text: 1
