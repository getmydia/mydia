id: slate
name: Slate
description: Invented public XML tracker for tests
language: en-US
type: public
encoding: UTF-8
links:
  - https://slate.invalid/
caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: Movies}
    - {id: 2, cat: TV, desc: TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
settings: []
search:
  paths:
    - path: feed.xml
      response:
        type: xml
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: item
  fields:
    title:
      selector: title
    details:
      selector: guid
    download:
      selector: enclosure
      attribute: url
    category:
      selector: category
    size:
      selector: length
    seeders:
      selector: seeds
    leechers:
      selector: peers
