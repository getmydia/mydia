name: Player / On-Demand Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch, commit SHA, or tag to build'
        required: true
        default: 'master'
      build_ios:
        description: 'Build iOS (TestFlight / IPA)'
        type: boolean
        default: true
      build_android:
        description: 'Build Android (Play Store / APK)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (signed & notarized DMG)'
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows (Inno Setup installer)'
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux (.tar.gz bundle)'
        type: boolean
        default: false
      build_flatpak:
        description: 'Build Linux Flatpak and publish it to the dev channel (mydia-dev)'
        type: boolean
        default: false
      upload_to_stores:
        description: 'Upload iOS build to TestFlight internal testers (Android test builds are distributed as direct APK artifacts)'
        type: boolean
        default: true
      version_override:
        description: 'Custom version string (e.g. 0.14.0-dev.42). If empty, auto-derived'
        required: false
        default: ''
      dry_run:
        description: 'Build and sign without uploading to stores'
        type: boolean
        default: false

concurrency:
  group: player-ondemand-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.setup.outputs.sha }}
      version: ${{ steps.setup.outputs.version }}
      version_code: ${{ steps.setup.outputs.version_code }}
      notes: ${{ steps.setup.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version and build number
        id: setup
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version_override }}
          INPUT_UPLOAD_TO_STORES: ${{ inputs.upload_to_stores }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BUILD_FLATPAK: ${{ inputs.build_flatpak }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Validate INPUT_REF: must not be empty, must not start with dash or contain whitespace
          if [ -z "$INPUT_REF" ] || [[ "$INPUT_REF" =~ [[:space:]] ]] || [[ "$INPUT_REF" =~ ^- ]]; then
            echo "::error::Invalid ref '$INPUT_REF'. Ref must not be empty, start with a dash, or contain whitespace."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "origin/$INPUT_REF^{commit}" >/dev/null 2>&1 && \
             ! git rev-parse --verify --quiet "$INPUT_REF^{commit}" >/dev/null 2>&1; then
            echo "::error::Ref '$INPUT_REF' could not be resolved to a commit in this repository."
            exit 1
          fi

          SHA=$(git rev-parse --verify "origin/$INPUT_REF^{commit}" 2>/dev/null || git rev-parse --verify "$INPUT_REF^{commit}")
          echo "Building SHA: $SHA from ref $INPUT_REF"

          if [ -n "$INPUT_VERSION" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid version_override '$INPUT_VERSION'. Must match semver (e.g. 1.2.3 or 1.2.3-beta.1)"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || echo "v0.0.0")
            BASE_VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
            NEXT_MINOR=$(( MINOR + 1 ))
            VERSION="${MAJOR}.${NEXT_MINOR}.0-dev.${RUN_NUMBER}"
          fi

          if [ "${RUN_NUMBER}" -gt 299 ] && [ -z "$INPUT_VERSION" ]; then
            echo "::error::run_number ${RUN_NUMBER} exceeds the dev slot range. Pass version_override with a dev counter below 300."
            exit 1
          fi

          # From the version, so a dev build sorts below the beta and stable of
          # the same version instead of above every release. The old +500000
          # offset is what made installing a dev APK a one way door.
          VERSION_CODE=$(./scripts/build-number.sh "$VERSION")

          echo "Derived version: $VERSION (build $VERSION_CODE)"

          # Generate notes from git log
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || echo "v0.0.0")
          NOTES=$(./scripts/testflight-notes.sh "$VERSION" "$SHA" "$LATEST_TAG")

          DELIM="notes-$(openssl rand -hex 16)"
          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### On-Demand Player Build"
            echo "- **Target Ref:** \`$INPUT_REF\`"
            echo "- **Commit:** \`$SHA\`"
            echo "- **Version:** \`$VERSION\`"
            echo "- **Version Code:** \`$VERSION_CODE\`"
            echo "- **Store Upload:** \`$INPUT_UPLOAD_TO_STORES\`"
            echo "- **Dry Run:** \`$INPUT_DRY_RUN\`"
            echo "- **Flatpak (dev channel):** \`$INPUT_BUILD_FLATPAK\`"
          } >> "$GITHUB_STEP_SUMMARY"

  player-ios:
    name: Player / iOS
    if: inputs.build_ios
    needs: prepare
    uses: ./.github/workflows/player-ios.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      groups: ''
      notes: ${{ needs.prepare.outputs.notes }}
      distribute_external: false
      dry_run: ${{ inputs.dry_run || !inputs.upload_to_stores }}
    secrets:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

  player-android:
    name: Player / Android
    if: inputs.build_android
    needs: prepare
    # Serialises this job against every other dev build publish, across
    # refs. This workflow's own concurrency group above is keyed on
    # inputs.ref, so two dispatches for different refs run their
    # player-android jobs at the same time; the "Publish the dev build to
    # R2" step inside player-android.yml does an unserialised
    # read-amend-write of index.json, so two concurrent runs can both read
    # the same index and the later write drops the earlier run's entry
    # while its APK stays in the bucket, orphaned and invisible to the feed.
    # Scoped to this caller job, not to player-android.yml itself: that
    # workflow is also called from release.yml for the real release build,
    # which never sets publish_dev_build and never touches this bucket, and
    # must never be made to wait behind a dev build publish it has nothing
    # to do with.
    concurrency:
      group: mydia-dev-builds-index
      cancel-in-progress: false
    uses: ./.github/workflows/player-android.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      upload_to_play_store: false
      play_store_track: 'internal'
      dry_run: ${{ inputs.dry_run }}
      publish_dev_build: ${{ !inputs.dry_run }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  player-macos:
    name: Player / macOS
    if: inputs.build_macos
    needs: prepare
    uses: ./.github/workflows/player-macos.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      generate_appcast: false
      dry_run: ${{ inputs.dry_run }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  player-windows:
    name: Player / Windows
    if: inputs.build_windows
    needs: prepare
    uses: ./.github/workflows/player-windows.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      dry_run: ${{ inputs.dry_run }}

  player-linux:
    name: Player / Linux
    if: inputs.build_linux
    needs: prepare
    uses: ./.github/workflows/player-linux.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      dry_run: ${{ inputs.dry_run }}

  player-flatpak:
    name: Player / Flatpak
    if: inputs.build_flatpak
    needs: prepare
    uses: ./.github/workflows/player-flatpak.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      channel: dev
      dry_run: ${{ inputs.dry_run }}

  flatpak-publish:
    name: Publish Flatpak
    needs:
      - prepare
      - player-flatpak
    # Positive checks for the same reason as the appcast job below: a skipped
    # build (build_flatpak off) must not publish, and neither must a dry run,
    # whose staged repo was only rehearsed against a throwaway key.
    if: ${{ !inputs.dry_run && needs.prepare.result == 'success' && needs.player-flatpak.result == 'success' }}
    # A called workflow cannot widen the caller's token, and the artifact
    # download needs actions: read.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-flatpak.yml
    # No `ref`: the publish scripts come from the ref this workflow was
    # dispatched from, not from the build target. The target can be any
    # branch, while this job holds the signing key and R2 credentials and
    # make-flatpakrepo.sh rewrites the stable and beta repo files as well.
    # The staged repo itself still comes from the target via the artifact.
    with:
      channel: dev
    secrets: inherit

  appcast:
    name: Deploy Appcast
    needs:
      - prepare
      - player-android
    # A custom `if` does not disable the runner's own "skip if a needed job
    # didn't succeed" gate (see release.yml's `publish` job, which relies on
    # exactly this and only opts out with always() when it deliberately wants
    # to run despite a failed platform). The checks below are still explicit
    # and positive rather than a bare `!inputs.dry_run`, because skipped and
    # failed are different result strings and only a negative check like
    # `!= 'failure'` would miss that a skipped player-android (build_android
    # disabled) also means nothing published. Either way, no dev build
    # reached the bucket, so the feed has nothing new to pick up.
    if: ${{ !inputs.dry_run && needs.prepare.result == 'success' && needs.player-android.result == 'success' }}
    # A reusable workflow gets the calling job's token scopes, so the callee's
    # own permissions block cannot widen this. Reading the release list and
    # checking out the generator is all it does; the Cloudflare deploy
    # authenticates with CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-appcast.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
