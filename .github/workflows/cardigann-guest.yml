name: Cardigann guest

# Builds the Cardigann wasm guest (native/cardigann_guest) and publishes it as a
# release asset named by the hash of its sources. Everything else (mix, Docker,
# Nix) downloads it by that name, so nobody needs .NET locally.
#
# Pull requests build and test but never publish, and the build job holds a
# read-only token because it runs PR-controlled build scripts. Only the publish
# job (push to master) gets contents: write, and it runs no repository build
# scripts. Never create the release or upload assets by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/cardigann_guest/**"
      - ".github/workflows/cardigann-guest.yml"
  push:
    branches: [master]
    paths:
      - "native/cardigann_guest/**"
      - ".github/workflows/cardigann-guest.yml"

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      built: ${{ steps.exists.outputs.exists != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Same value as Mydia.Indexers.Cardigann.Wasm.SourceHash; a mix test
      # (artifact_test.exs) fails when this script and the Elixir drift.
      - name: Compute source hash
        id: hash
        run: echo "hash=$(native/cardigann_guest/scripts/source-hash.sh)" >> "$GITHUB_OUTPUT"

      # The .wasm is uploaded last, so its presence means the release is complete.
      - name: Skip if published
        id: exists
        run: |
          if gh release view cardigann-guest --json assets -q '.assets[].name' 2>/dev/null \
            | grep -qx "cardigann-${{ steps.hash.outputs.hash }}.wasm"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Cold builds take several minutes (NuGet restore, the wasi-sdk download,
      # installing wit-bindgen/wac/wasm-tools). The keys cover every pin that
      # changes what those caches hold.
      - name: Cache build tools
        if: steps.exists.outputs.exists != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mydia-cardigann-nuget
            ~/.cache/mydia-cardigann-nuget-wasi-sdk
            ~/.cache/mydia-cardigann-cargo
          key: cardigann-guest-${{ runner.os }}-${{ hashFiles('native/cardigann_guest/PROWLARR_REF', 'native/cardigann_guest/CardigannGuest.csproj', 'native/cardigann_guest/deny/Cargo.lock', 'native/cardigann_guest/scripts/rust-tools.sh') }}
          restore-keys: |
            cardigann-guest-${{ runner.os }}-

      - name: Test on plain .NET
        if: steps.exists.outputs.exists != 'true'
        run: native/cardigann_guest/build.sh test

      - name: Build component
        if: steps.exists.outputs.exists != 'true'
        run: native/cardigann_guest/build.sh wasm

      - name: Upload for this run
        if: steps.exists.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardigann-guest
          path: native/cardigann_guest/out/cardigann.wasm
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cardigann-guest-publish
      cancel-in-progress: false
    steps:
      # Only for LICENSE and NOTICE; no repository script runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Download built component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cardigann-guest
          path: out

      # Sidecars first, the .wasm last: the build job treats the .wasm as proof
      # that a release is complete, so a partial upload is retried, not skipped.
      - name: Publish
        run: |
          name="cardigann-${{ needs.build.outputs.hash }}.wasm"
          cp out/cardigann.wasm "$name"
          sha256sum "$name" | cut -d' ' -f1 > "$name.sha256"
          cp native/cardigann_guest/LICENSE "$name.LICENSE"
          { cat native/cardigann_guest/NOTICE; printf '\nBuilt from %s\n' "$GITHUB_SHA"; } > "$name.NOTICE"
          gh release view cardigann-guest >/dev/null 2>&1 || \
            gh release create cardigann-guest --prerelease --title "Cardigann guest builds" \
              --notes "Prebuilt Cardigann wasm guests, named by source hash. Source: native/cardigann_guest at the commit that published each asset."
          gh release upload cardigann-guest --clobber "$name.sha256" "$name.LICENSE" "$name.NOTICE"
          gh release upload cardigann-guest --clobber "$name"
          echo "Published $name"
          echo "Pin for nix: $(cat "$name.sha256")"
        env:
          GH_TOKEN: ${{ github.token }}
