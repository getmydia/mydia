name: Cardigann guest

# Builds the Cardigann wasm guest (native/cardigann_guest) and publishes it as a
# release asset named by the hash of its sources. Everything else (mix, Docker,
# Nix) downloads it by that name, so nobody needs .NET locally.
#
# Pull requests build and test but never publish, and the build job holds a
# read-only token because it runs PR-controlled build scripts. Only the publish
# job (push to master) gets contents: write, and it runs no repository build
# scripts. The pin job (master only) proposes the Nix pin through a pull
# request. Never create the release or upload assets by hand.
#
# Dependabot's nuget bumps change the guest's sources, and the auto-merge gate
# merges them with GITHUB_TOKEN, whose push starts no workflows. Running on
# every master push (without a path filter) lets the 5-second release check in
# `Skip if published` self-heal on the next push; `workflow_dispatch` recovers
# immediately when no push is queued (`gh workflow run cardigann-guest.yml --ref master`).

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/cardigann_guest/**"
      - ".github/workflows/cardigann-guest.yml"
  push:
    branches: [master]

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      built: ${{ steps.exists.outputs.exists != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Same value as Mydia.Indexers.Cardigann.Wasm.SourceHash; a mix test
      # (artifact_test.exs) fails when this script and the Elixir drift.
      - name: Compute source hash
        id: hash
        run: echo "hash=$(native/cardigann_guest/scripts/source-hash.sh)" >> "$GITHUB_OUTPUT"

      # Each hash has its own release, published only once every asset is on it,
      # so a non-draft release means this hash is done. A draft is a failed run.
      - name: Skip if published
        id: exists
        run: |
          if gh release view "cardigann-guest-${{ steps.hash.outputs.hash }}" --json isDraft -q .isDraft 2>/dev/null \
            | grep -qx false; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Cold builds take several minutes (NuGet restore, the wasi-sdk download,
      # installing wit-bindgen/wac/wasm-tools). The keys cover every pin that
      # changes what those caches hold.
      - name: Cache build tools
        if: steps.exists.outputs.exists != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mydia-cardigann-nuget
            ~/.cache/mydia-cardigann-nuget-wasi-sdk
            ~/.cache/mydia-cardigann-cargo
          key: cardigann-guest-${{ runner.os }}-${{ hashFiles('native/cardigann_guest/PROWLARR_REF', 'native/cardigann_guest/CardigannGuest.csproj', 'native/cardigann_guest/deny/Cargo.lock', 'native/cardigann_guest/scripts/rust-tools.sh') }}
          restore-keys: |
            cardigann-guest-${{ runner.os }}-

      - name: Test on plain .NET
        if: steps.exists.outputs.exists != 'true'
        run: native/cardigann_guest/build.sh test

      - name: Build component
        if: steps.exists.outputs.exists != 'true'
        run: native/cardigann_guest/build.sh wasm

      - name: Upload for this run
        if: steps.exists.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardigann-guest
          path: native/cardigann_guest/out/cardigann.wasm
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cardigann-guest-publish-${{ needs.build.outputs.hash }}
      cancel-in-progress: false
    steps:
      # Only for LICENSE and NOTICE; no repository script runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Download built component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cardigann-guest
          path: out

      # Immutable releases are on for this repo: a published release takes no
      # uploads, and its assets can never be replaced. So each source hash gets
      # its own release, built as a draft holding every asset and published last
      # (the draft-first pattern in .github/ci.md). A draft left by a failed run
      # is deleted and rebuilt. --latest=false keeps Mydia's own release as
      # "Latest".
      - name: Publish
        run: |
          hash="${{ needs.build.outputs.hash }}"
          tag="cardigann-guest-$hash"
          name="cardigann-$hash.wasm"
          cp out/cardigann.wasm "$name"
          sha256sum "$name" | cut -d' ' -f1 > "$name.sha256"
          cp native/cardigann_guest/LICENSE "$name.LICENSE"
          { cat native/cardigann_guest/NOTICE; printf '\nBuilt from %s\n' "$GITHUB_SHA"; } > "$name.NOTICE"
          # Re-read inside the concurrency group: two queued runs can build the
          # same hash, and the first to publish wins.
          state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$state" = "false" ]; then
            echo "$tag is already published"
            exit 0
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Cardigann guest $hash" \
            --notes "Prebuilt Cardigann wasm guest for source hash $hash, built from native/cardigann_guest at $GITHUB_SHA." \
            "$name" "$name.sha256" "$name.LICENSE" "$name.NOTICE"
          gh release edit "$tag" --draft=false --prerelease --latest=false
          echo "Published $tag/$name"
          echo "Pin for nix: $(cat "$name.sha256")"
        env:
          GH_TOKEN: ${{ github.token }}

  # Points nix/ci/cardigann-guest.json at the published guest, so the
  # sandboxed Nix test shards run the :cardigann_wasm tests again. Also runs
  # when publish was skipped (already published), which repairs a pin that a
  # failed run never proposed.
  #
  # The Master ruleset requires status checks, so the App cannot push to
  # master: this opens a pull request instead, one branch per source hash. It
  # goes through the GitHub App token (see "The GitHub App" in .github/ci.md),
  # not GITHUB_TOKEN, because a pull request opened with GITHUB_TOKEN starts
  # no workflows and its required checks would never report.
  pin:
    name: Pin for Nix
    needs: [build, publish]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cardigann-guest-pin-${{ needs.build.outputs.hash }}
      cancel-in-progress: false
    steps:
      - name: Mint a push token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Credentials are not persisted: only the push below needs them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Update the pin
        run: scripts/update-cardigann-guest-pin.sh "${{ needs.build.outputs.hash }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open a pull request
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HASH: ${{ needs.build.outputs.hash }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nix/ci/cardigann-guest.json already pins $HASH. Nothing to do."
            exit 0
          fi
          branch="cardigann-guest-pin/$HASH"
          if [ -n "$(GH_TOKEN="$TOKEN" gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            echo "A pull request for $branch is already open."
            exit 0
          fi
          user_id="$(GH_TOKEN="$TOKEN" gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "ci(nix): pin the Cardigann guest $HASH"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          GH_TOKEN="$TOKEN" gh pr create --base master --head "$branch" \
            --title "ci(nix): pin the Cardigann guest $HASH" \
            --body "Points \`nix/ci/cardigann-guest.json\` at the published \`cardigann-guest-$HASH\` release, so the sandboxed Nix test shards run the \`:cardigann_wasm\` tests. Opened by the Cardigann guest workflow (\`scripts/update-cardigann-guest-pin.sh\`)."
