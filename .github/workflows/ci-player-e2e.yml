name: CI / Player E2E

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-player-e2e:
    name: Test / Player E2E
    runs-on: ubuntu-latest
    # The build is uncached and routinely spends ~20 minutes in the player test
    # image's apt layer alone, which left almost no margin at 30 and timed the
    # job out mid-install without running a single test. This is headroom for a
    # slow-mirror day, not a fix; the build genuinely wants layer caching.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'player/**'
              - 'lib/**'
              - 'native/**'
              - 'metadata-relay/**'
              - 'config/**'
              - 'Dockerfile.e2e'
              - 'compose.player-e2e.yml'
              - '.github/workflows/ci-player-e2e.yml'

      - name: Decide whether to run
        id: should
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No player/relay/lib/native/config changes; skipping E2E build."
          fi

      - name: Free up disk space
        if: steps.should.outputs.run == 'true'
        run: |
          echo "Disk before cleanup:"
          df -h /
          # The E2E build runs entirely in Docker (the Android emulator is built
          # inside the container from Dockerfile.e2e), so the host's preinstalled
          # toolchains are unused. Remove them to avoid "No space left on device"
          # while compiling the Rust p2p NIF + Android image.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup Docker Buildx
        if: steps.should.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Keep this a sequential `docker compose build`. Switching it to
      # `docker buildx bake` to gain layer caching was tried and reverted: bake
      # builds every target in parallel, and three heavy images (Elixir release,
      # Rust p2p NIF, and the GTK/mpv/Flutter desktop toolchain) competing for a
      # two-core runner starved the apt layer from ~20 minutes to over 56, which
      # is worse than the problem it was meant to fix. Layer caching here also
      # cannot bootstrap: a cold build that cannot finish inside the job budget
      # never exports a cache, so every run stays cold.
      - name: Build E2E images
        if: steps.should.outputs.run == 'true'
        run: DOCKER_BUILDKIT=1 docker compose -f compose.player-e2e.yml build

      - name: Run player E2E tests
        if: steps.should.outputs.run == 'true'
        run: |
          docker compose -f compose.player-e2e.yml up \
            --abort-on-container-exit \
            --exit-code-from test
        env:
          E2E_TEST_TARGET: integration_test/pairing_flow_test.dart

      - name: Collect service logs
        if: failure() && steps.should.outputs.run == 'true'
        run: |
          docker compose -f compose.player-e2e.yml logs mydia > mydia-logs.txt 2>&1 || true
          docker compose -f compose.player-e2e.yml logs relay > relay-logs.txt 2>&1 || true
          docker compose -f compose.player-e2e.yml logs test > test-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure() && steps.should.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: player-e2e-logs
          path: |
            mydia-logs.txt
            relay-logs.txt
            test-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always() && steps.should.outputs.run == 'true'
        run: docker compose -f compose.player-e2e.yml down -v
