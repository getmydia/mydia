name: CI / Player E2E

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-player-e2e:
    name: Test / Player E2E
    runs-on: ubuntu-latest
    # A run that has to populate a cold layer cache still pays the full build
    # cost, so this has to clear a cold build, not a warm one. 30 minutes did
    # not, and the job died mid-`apt-get` without ever running a test.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'player/**'
              - 'lib/**'
              - 'native/**'
              - 'metadata-relay/**'
              - 'config/**'
              - 'Dockerfile.e2e'
              - 'compose.player-e2e.yml'
              - '.github/workflows/ci-player-e2e.yml'

      - name: Decide whether to run
        id: should
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No player/relay/lib/native/config changes; skipping E2E build."
          fi

      - name: Free up disk space
        if: steps.should.outputs.run == 'true'
        run: |
          echo "Disk before cleanup:"
          df -h /
          # The E2E build runs entirely in Docker (the Android emulator is built
          # inside the container from Dockerfile.e2e), so the host's preinstalled
          # toolchains are unused. Remove them to avoid "No space left on device"
          # while compiling the Rust p2p NIF + Android image.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup Docker Buildx
        if: steps.should.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Built through bake rather than `docker compose build` so the layers can
      # be cached across runs. The player test image installs the whole GTK /
      # mpv / Flutter Linux desktop toolchain in one apt layer, which alone has
      # taken ~20 of the job's 30 minutes and timed the job out before the tests
      # ever ran. `type=gha` cache needs ACTIONS_CACHE_URL and
      # ACTIONS_RUNTIME_TOKEN in the environment, which the Docker actions
      # inject and a plain `run:` step does not, so this cannot be done as a
      # shell step. Scopes are per-image so the three do not evict each other.
      - name: Build E2E images
        if: steps.should.outputs.run == 'true'
        uses: docker/bake-action@v6
        with:
          files: compose.player-e2e.yml
          load: true
          set: |
            relay.cache-from=type=gha,scope=player-e2e-relay
            relay.cache-to=type=gha,mode=max,scope=player-e2e-relay
            mydia.cache-from=type=gha,scope=player-e2e-mydia
            mydia.cache-to=type=gha,mode=max,scope=player-e2e-mydia
            test.cache-from=type=gha,scope=player-e2e-test
            test.cache-to=type=gha,mode=max,scope=player-e2e-test

      - name: Run player E2E tests
        if: steps.should.outputs.run == 'true'
        run: |
          docker compose -f compose.player-e2e.yml up \
            --abort-on-container-exit \
            --exit-code-from test
        env:
          E2E_TEST_TARGET: integration_test/pairing_flow_test.dart

      - name: Collect service logs
        if: failure() && steps.should.outputs.run == 'true'
        run: |
          docker compose -f compose.player-e2e.yml logs mydia > mydia-logs.txt 2>&1 || true
          docker compose -f compose.player-e2e.yml logs relay > relay-logs.txt 2>&1 || true
          docker compose -f compose.player-e2e.yml logs test > test-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure() && steps.should.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: player-e2e-logs
          path: |
            mydia-logs.txt
            relay-logs.txt
            test-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always() && steps.should.outputs.run == 'true'
        run: docker compose -f compose.player-e2e.yml down -v
