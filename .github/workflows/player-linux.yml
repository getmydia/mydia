name: Player / Linux

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string
        type: string
        required: true
      version_code:
        description: Integer build number
        type: string
        required: true

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The prep action comes from this workflow's own commit, not from
      # inputs.sha: player-ios-refresh rebuilds an old release tag and
      # player-ondemand can build an old branch, neither of which has it.
      - name: Checkout CI actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libmpv-dev

      - name: Flutter prep
        uses: ./.ci-actions/.github/actions/player-flutter-prep
        with:
          version: ${{ inputs.version }}
          pubspec-version: ${{ inputs.version }}+${{ inputs.version_code }}

      - name: Build Linux
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build linux --release --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-linux-bundle
          path: ${{ env.PLAYER_PATH }}/build/linux/x64/release/bundle
          retention-days: 30
