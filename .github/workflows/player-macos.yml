name: Player / macOS

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string (e.g. 0.14.0 or 0.14.0-dev.1)
        type: string
        required: true
      version_code:
        description: Monotonically increasing integer build number
        type: string
        required: true
      generate_appcast:
        description: Whether to sign and generate Sparkle appcast.xml
        type: boolean
        required: false
        default: false
      publish_dev_build:
        description: Sign the DMG for Sparkle and publish it to the dev build index (dl.mydia.dev)
        type: boolean
        required: false
        default: false
      dry_run:
        description: Build without publishing or final notarization submission
        type: boolean
        required: false
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      SPARKLE_EDDSA_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build macOS
    outputs:
      dev_build_file: ${{ steps.sparkle.outputs.file }}
      dev_build_extra: ${{ steps.sparkle.outputs.extra }}
    # The same image as player-ios.yml, so both Apple builds use the Xcode 27
    # SDKs App Store Connect requires from April 2027.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The prep action comes from this workflow's own commit, not from
      # inputs.sha: player-ios-refresh rebuilds an old release tag and
      # player-ondemand can build an old branch, neither of which has it.
      - name: Checkout CI actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          # scripts/dev-builds comes from here too, not from the build
          # target: an older target predates the dev build publisher.
          sparse-checkout: |
            .github/actions
            scripts/dev-builds
          persist-credentials: false

      - name: Flutter prep
        uses: ./.ci-actions/.github/actions/player-flutter-prep
        with:
          version: ${{ inputs.version }}
          pubspec-version: ${{ inputs.version }}+${{ inputs.version_code }}

      - name: Build macOS
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build macos --release --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      - name: Install signing certificate
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign app bundle
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          APP="${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

          # The secure timestamp comes from Apple's timestamp server. When it
          # doesn't answer, codesign fails with "A timestamp was expected but
          # was not found" on whichever subcomponent it was signing. That is
          # transient, so retry with backoff instead of failing the build.
          attempt=1
          until codesign --deep --force --options runtime --timestamp \
              --entitlements "${{ env.PLAYER_PATH }}/macos/Runner/Release.entitlements" \
              --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
              "$APP"; do
            if [ "$attempt" -ge 4 ]; then
              echo "::error::codesign failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::codesign attempt $attempt failed; retrying in $((attempt * 15))s."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENTITLEMENTS"
          if ! grep -q "com.apple.security.network.client" <<<"$ENTITLEMENTS"; then
            echo "::error::Signed app is missing its entitlements — codesign dropped them."
            exit 1
          fi

      - name: Notarize app bundle
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          ditto -c -k --keepParent "Mydia Player.app" "Mydia Player.zip"
          xcrun notarytool submit "Mydia Player.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          rm "Mydia Player.zip"

      - name: Staple notarization ticket
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          xcrun stapler staple "${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

      - name: Create DMG
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          mkdir -p dmg_contents
          cp -R "Mydia Player.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Mydia Player" -srcfolder dmg_contents -ov -format UDZO "Mydia Player.dmg"
          rm -rf dmg_contents

      - name: Download Sparkle tools
        if: ${{ inputs.generate_appcast || (inputs.publish_dev_build && !inputs.dry_run) }}
        run: |
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          echo "5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-tools
          tar xf sparkle.tar.xz -C sparkle-tools

      - name: Generate appcast
        if: ${{ inputs.generate_appcast }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.version_code }}"
          DMG_FILE="Mydia Player.dmg"
          DMG_URL="https://github.com/getmydia/mydia/releases/download/v${VERSION}/mydia-player-macos-v${VERSION}.dmg"

          # sign_update prints a ready-to-paste XML attribute fragment, e.g.
          #   sparkle:edSignature="…" length="71098585"
          # It must be embedded in the enclosure verbatim. Do NOT wrap it in
          # another sparkle:edSignature="…" or add a separate length=, or the
          # enclosure ends up with a duplicated length attribute and a signature
          # value that is not valid base64 — which Sparkle rejects.
          SIGNATURE=$(echo "$SPARKLE_EDDSA_KEY" | $GITHUB_WORKSPACE/sparkle-tools/bin/sign_update "$DMG_FILE" --ed-key-file -)

          # Catch any future sign_update output-format drift before it reaches the
          # XML (cheap, no dependency).
          if ! printf '%s' "$SIGNATURE" | grep -Eq '^sparkle:edSignature="[^"]+" length="[0-9]+"$'; then
            echo "::error::Unexpected sign_update output, refusing to build appcast: $SIGNATURE"
            exit 1
          fi

          # The built app's Info.plist has LSMinimumSystemVersion resolved from
          # MACOSX_DEPLOYMENT_TARGET, so this can never drift from the binary it
          # describes the way a hardcoded constant in the appcast generator would.
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "Mydia Player.app/Contents/Info.plist")

          # sparkle:version must be the integer CFBundleVersion (VERSION_CODE) that
          # `flutter build macos` writes into the bundle — Sparkle compares
          # <sparkle:version> against the installed app's CFBundleVersion. The
          # marketing string stays in <sparkle:shortVersionString> for display only.
          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Mydia Player</title>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${VERSION_CODE}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="${DMG_URL}"
                           ${SIGNATURE}
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Validate appcast
        if: ${{ inputs.generate_appcast }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # Fail the release here rather than ship an appcast Sparkle can't read.
          # xmllint is the load-bearing check — it catches the malformed-XML class
          # (e.g. the historical double-wrapped enclosure with a duplicated length
          # attribute). Shipped on GitHub macos runners, but don't silently no-op
          # if it is ever absent.
          if ! command -v xmllint >/dev/null 2>&1; then
            echo "::error::xmllint not found on runner; cannot validate appcast"
            exit 1
          fi

          xmllint --noout appcast.xml

          # Exactly one signature and one length attribute in the enclosure
          # (guards against re-nesting / sign_update output drift).
          ed_count=$(grep -o 'sparkle:edSignature="' appcast.xml | wc -l | tr -d ' ' || true)
          len_count=$(grep -o 'length="' appcast.xml | wc -l | tr -d ' ' || true)
          if [ "$ed_count" -ne 1 ] || [ "$len_count" -ne 1 ]; then
            echo "::error::appcast enclosure malformed: edSignature=$ed_count length=$len_count (expected 1 each)"
            cat appcast.xml
            exit 1
          fi

          # sparkle:version must be the integer build number, not the marketing
          # string, or Sparkle's newer-than comparison never offers the update.
          sparkle_version=$(sed -n 's#.*<sparkle:version>\(.*\)</sparkle:version>.*#\1#p' appcast.xml)
          if ! printf '%s' "$sparkle_version" | grep -Eq '^[0-9]+$'; then
            echo "::error::sparkle:version must be an integer build number, got '$sparkle_version'"
            exit 1
          fi

          # NOTE: a cryptographic self-verify (sign_update --verify) is deliberately
          # NOT wired here — the 2.x verify invocation and key material (it checks
          # against a public key; the pipeline holds the private one) are unresolved
          # on the pinned 2.8.1 toolchain. The guard therefore proves well-formedness
          # and enclosure shape, not signature validity. See the plan's KTD3 / R4.
          echo "appcast.xml validated (well-formed, single signature/length, sparkle:version=$sparkle_version)"

      - name: "Upload artifact: DMG"
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-macos-dmg
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.dmg
          retention-days: 30

      - name: "Upload artifact: Appcast"
        if: ${{ inputs.generate_appcast }}
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-macos-appcast
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/appcast.xml
          retention-days: 30

      # A dev build reaches Macs on the Dev track through the dev channel of
      # the Sparkle feed (scripts/appcast), which reads the index entry the
      # publish-dev-build job below writes. Signing happens here because
      # Sparkle's sign_update is a macOS binary; the upload and index write
      # happen there, so only they hold the shared index lock. Only notarized
      # and stapled builds get here: both steps above skip on dry_run, and so
      # does this one.
      - name: Sign the dev build for Sparkle
        id: sparkle
        if: ${{ inputs.publish_dev_build && !inputs.dry_run }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          VERSION: ${{ inputs.version }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_KEY}" ]; then
            echo "::error::SPARKLE_EDDSA_KEY is missing, so the dev build cannot be signed for Sparkle and would be rejected by every client."
            exit 1
          fi
          command -v jq > /dev/null || brew install jq

          # Same invocation and format check as "Generate appcast" above.
          SIGNATURE=$(echo "$SPARKLE_EDDSA_KEY" | "$GITHUB_WORKSPACE/sparkle-tools/bin/sign_update" "Mydia Player.dmg" --ed-key-file -)
          if ! printf '%s' "$SIGNATURE" | grep -Eq '^sparkle:edSignature="[^"]+" length="[0-9]+"$'; then
            echo "::error::Unexpected sign_update output, refusing to publish: $SIGNATURE"
            exit 1
          fi
          ED_SIG=$(printf '%s' "$SIGNATURE" | sed -E 's/^sparkle:edSignature="([^"]+)".*$/\1/')
          LENGTH=$(printf '%s' "$SIGNATURE" | sed -E 's/^.* length="([0-9]+)"$/\1/')
          # The digest in the object key keeps a re-dispatch of the same
          # version from overwriting bytes that a signed feed entry still
          # describes; publish.sh removes the superseded object afterwards.
          DIGEST=$(shasum -a 256 "Mydia Player.dmg" | cut -c1-12)
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "Mydia Player.app/Contents/Info.plist")

          # Its own assignment so a jq failure stops the step under set -e.
          EXTRA=$(jq -nc --arg s "$ED_SIG" --argjson l "$LENGTH" --arg m "$MIN_OS" \
            '{ed_signature: $s, length: $l, minimum_system_version: $m}')

          {
            echo "extra=$EXTRA"
            echo "file=macos/mydia-player-macos-v${VERSION}-${DIGEST}.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  # The twin of player-android.yml's job of the same name, which explains the
  # lock. It uploads the DMG artifact, the exact bytes signed above, so the
  # signature and length in the index entry describe the published file.
  publish-dev-build:
    name: Publish dev build
    needs: build
    # release.yml calls this workflow without publish_dev_build, so a tagged
    # release never runs this job and never waits on the lock.
    if: ${{ inputs.publish_dev_build && !inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: mydia-dev-builds-index
      cancel-in-progress: false
      # The default (single) cancels a pending job when another joins the
      # group, so a second platform or dispatch would silently drop one.
      queue: max
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: scripts/dev-builds
          persist-credentials: false

      - name: "Download artifact: DMG"
        uses: actions/download-artifact@v8
        with:
          name: mydia-player-macos-dmg
          path: dmg

      - name: Publish the dev build to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          DEV_BUILD_FILE: ${{ needs.build.outputs.dev_build_file }}
          DEV_BUILD_EXTRA: ${{ needs.build.outputs.dev_build_extra }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          DEV_BUILD_PLATFORM=macos \
          DEV_BUILD_SOURCE="dmg/Mydia Player.dmg" \
          DEV_BUILD_VERSION="$VERSION" \
          DEV_BUILD_NUMBER="$VERSION_CODE" \
            ./.ci-actions/scripts/dev-builds/publish.sh
