name: Player / macOS

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string (e.g. 0.14.0 or 0.14.0-dev.1)
        type: string
        required: true
      version_code:
        description: Monotonically increasing integer build number
        type: string
        required: true
      generate_appcast:
        description: Whether to sign and generate Sparkle appcast.xml
        type: boolean
        required: false
        default: false
      dry_run:
        description: Build without publishing or final notarization submission
        type: boolean
        required: false
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      SPARKLE_EDDSA_KEY:
        required: false

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.version_code }}"
          sed -i '' "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Build macOS
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build macos --release

      - name: Install signing certificate
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign app bundle
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          APP="${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

          codesign --deep --force --options runtime \
            --entitlements "${{ env.PLAYER_PATH }}/macos/Runner/Release.entitlements" \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            "$APP"

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENTITLEMENTS"
          if ! grep -q "com.apple.security.network.client" <<<"$ENTITLEMENTS"; then
            echo "::error::Signed app is missing its entitlements — codesign dropped them."
            exit 1
          fi

      - name: Notarize app bundle
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          ditto -c -k --keepParent "Mydia Player.app" "Mydia Player.zip"
          xcrun notarytool submit "Mydia Player.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          rm "Mydia Player.zip"

      - name: Staple notarization ticket
        if: ${{ !inputs.dry_run }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          xcrun stapler staple "${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

      - name: Create DMG
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          mkdir -p dmg_contents
          cp -R "Mydia Player.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Mydia Player" -srcfolder dmg_contents -ov -format UDZO "Mydia Player.dmg"
          rm -rf dmg_contents

      - name: Download Sparkle tools
        if: ${{ inputs.generate_appcast }}
        run: |
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          echo "5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-tools
          tar xf sparkle.tar.xz -C sparkle-tools

      - name: Generate appcast
        if: ${{ inputs.generate_appcast }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.version_code }}"
          DMG_FILE="Mydia Player.dmg"
          DMG_URL="https://github.com/getmydia/mydia/releases/download/v${VERSION}/mydia-player-macos-v${VERSION}.dmg"

          # sign_update prints a ready-to-paste XML attribute fragment, e.g.
          #   sparkle:edSignature="…" length="71098585"
          # It must be embedded in the enclosure verbatim. Do NOT wrap it in
          # another sparkle:edSignature="…" or add a separate length=, or the
          # enclosure ends up with a duplicated length attribute and a signature
          # value that is not valid base64 — which Sparkle rejects.
          SIGNATURE=$(echo "$SPARKLE_EDDSA_KEY" | $GITHUB_WORKSPACE/sparkle-tools/bin/sign_update "$DMG_FILE" --ed-key-file -)

          # Catch any future sign_update output-format drift before it reaches the
          # XML (cheap, no dependency).
          if ! printf '%s' "$SIGNATURE" | grep -Eq '^sparkle:edSignature="[^"]+" length="[0-9]+"$'; then
            echo "::error::Unexpected sign_update output, refusing to build appcast: $SIGNATURE"
            exit 1
          fi

          # The built app's Info.plist has LSMinimumSystemVersion resolved from
          # MACOSX_DEPLOYMENT_TARGET, so this can never drift from the binary it
          # describes the way a hardcoded constant in the appcast generator would.
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "Mydia Player.app/Contents/Info.plist")

          # sparkle:version must be the integer CFBundleVersion (VERSION_CODE) that
          # `flutter build macos` writes into the bundle — Sparkle compares
          # <sparkle:version> against the installed app's CFBundleVersion. The
          # marketing string stays in <sparkle:shortVersionString> for display only.
          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Mydia Player</title>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${VERSION_CODE}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="${DMG_URL}"
                           ${SIGNATURE}
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Validate appcast
        if: ${{ inputs.generate_appcast }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # Fail the release here rather than ship an appcast Sparkle can't read.
          # xmllint is the load-bearing check — it catches the malformed-XML class
          # (e.g. the historical double-wrapped enclosure with a duplicated length
          # attribute). Shipped on GitHub macos runners, but don't silently no-op
          # if it is ever absent.
          if ! command -v xmllint >/dev/null 2>&1; then
            echo "::error::xmllint not found on runner; cannot validate appcast"
            exit 1
          fi

          xmllint --noout appcast.xml

          # Exactly one signature and one length attribute in the enclosure
          # (guards against re-nesting / sign_update output drift).
          ed_count=$(grep -o 'sparkle:edSignature="' appcast.xml | wc -l | tr -d ' ' || true)
          len_count=$(grep -o 'length="' appcast.xml | wc -l | tr -d ' ' || true)
          if [ "$ed_count" -ne 1 ] || [ "$len_count" -ne 1 ]; then
            echo "::error::appcast enclosure malformed: edSignature=$ed_count length=$len_count (expected 1 each)"
            cat appcast.xml
            exit 1
          fi

          # sparkle:version must be the integer build number, not the marketing
          # string, or Sparkle's newer-than comparison never offers the update.
          sparkle_version=$(sed -n 's#.*<sparkle:version>\(.*\)</sparkle:version>.*#\1#p' appcast.xml)
          if ! printf '%s' "$sparkle_version" | grep -Eq '^[0-9]+$'; then
            echo "::error::sparkle:version must be an integer build number, got '$sparkle_version'"
            exit 1
          fi

          # NOTE: a cryptographic self-verify (sign_update --verify) is deliberately
          # NOT wired here — the 2.x verify invocation and key material (it checks
          # against a public key; the pipeline holds the private one) are unresolved
          # on the pinned 2.8.1 toolchain. The guard therefore proves well-formedness
          # and enclosure shape, not signature validity. See the plan's KTD3 / R4.
          echo "appcast.xml validated (well-formed, single signature/length, sparkle:version=$sparkle_version)"

      - name: "Upload artifact: DMG"
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-macos-dmg
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.dmg
          retention-days: 30

      - name: "Upload artifact: Appcast"
        if: ${{ inputs.generate_appcast }}
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-macos-appcast
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/appcast.xml
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
