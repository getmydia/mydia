name: Release

# Release procedure (Immutable Releases enabled on this repo).
# Full docs: docs/contributing/releasing.md
#
#   1. SHA=$(git rev-parse origin/master)
#      gh release create vX.Y.Z --target "$SHA" --draft --prerelease \
#        --notes-file notes.md
#   2. gh workflow run release.yml -f version=vX.Y.Z
#
# The draft must target a full commit SHA, not a branch. A branch target is
# resolved separately at build time and again at publish time, so the tag can
# end up on code that was never built. Pinning the draft to a commit makes the
# notes, the images and the tag all describe the same thing.
#
# The workflow uploads assets to the draft and publishes it. The `release`
# event is not used because GitHub Actions silently drops `release: created`
# for drafts (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows)
# and asset uploads to a published immutable release are blocked.
#
# To rehearse without shipping anything:
#
#   gh workflow run release.yml -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag of an existing draft release (e.g., v1.0.0). Ignored when dry_run is set.'
        required: false
      dry_run:
        description: 'Build, sign and notarize every platform without publishing, pushing images or uploading to stores'
        type: boolean
        default: false
      accept_drift:
        description: 'Proceed even though the default branch has moved past the commit the draft targets'
        type: boolean
        default: false
      allow_missing:
        description: "Comma-separated platforms whose failure must not block publish (android,ios,macos,windows,linux,flatpak,docker)"
        required: false
        default: ''

concurrency:
  group: release-${{ inputs.dry_run && format('dryrun-{0}', github.run_id) || inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLAYER_PATH: 'player'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      version_code: ${{ steps.get_version.outputs.version_code }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      sha: ${{ steps.get_version.outputs.sha }}
      testflight_notes: ${{ steps.testflight_notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version info
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACCEPT_DRIFT: ${{ inputs.accept_drift }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          DISPATCH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Build number (CFBundleVersion / Android versionCode) — globally
          # monotonic via github.run_number, with an offset to clear the
          # historical high-water mark of 1000 from earlier failed uploads.
          # Re-runs of the same workflow run preserve run_number; new dispatches
          # increment it, which is exactly what TestFlight/Play Store require.
          VERSION_CODE=$(( RUN_NUMBER + 10000 ))

          if [ "$DRY_RUN" = "true" ]; then
            # Rehearsal: no draft, no tag, no publish. Everything that has
            # historically broken (signing, notarization, appcast, installer)
            # still runs, against a synthetic version.
            TAG="(dry run)"
            VERSION_NUM="0.0.0-dryrun.${RUN_NUMBER}"
            IS_PRERELEASE=true
            SHA="$DISPATCH_SHA"
            echo "Dry run: building ${VERSION_NUM} from ${SHA}. Nothing will be pushed or published."
          else
            TAG="$INPUT_VERSION"
            if [ -z "$TAG" ]; then
              echo "::error::version is required unless dry_run is set." >&2
              exit 1
            fi

            # Enforce draft-first authoring. This repo has Immutable Releases
            # enabled, so assets can only be uploaded while the release is a
            # draft. The workflow publishes the draft at the end.
            RELEASE_JSON=$(gh release view "$TAG" --repo "$REPO" --json isDraft,targetCommitish)
            IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is not a draft. Create the release with --draft so the workflow can upload assets before publishing." >&2
              exit 1
            fi

            # The draft must name a commit, not a branch. A branch target is
            # resolved independently here and again when GitHub creates the tag
            # at publish, so the tag can land on code these jobs never built.
            SHA=$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')
            if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Draft $TAG targets '$SHA', which is a branch, not a commit. Pin it first: gh release edit $TAG --repo $REPO --target \$(git rev-parse origin/${DEFAULT_BRANCH})" >&2
              exit 1
            fi

            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Draft $TAG targets commit $SHA, which does not exist in this repository." >&2
              exit 1
            fi

            # Drift check. Anything merged since the draft was cut is not in
            # this release, and the notes were written without it. Surface it
            # rather than absorbing it silently.
            DRIFT=$(git rev-list --count "${SHA}..origin/${DEFAULT_BRANCH}" 2>/dev/null || echo 0)
            if [ "$DRIFT" -gt 0 ]; then
              echo "::group::${DRIFT} commit(s) on ${DEFAULT_BRANCH} are NOT in this release"
              git log --oneline "${SHA}..origin/${DEFAULT_BRANCH}"
              echo "::endgroup::"
              {
                echo "### Release drift"
                echo
                echo "\`$TAG\` targets \`${SHA:0:12}\`, which is **${DRIFT} commit(s) behind ${DEFAULT_BRANCH}**."
                echo
                git log --oneline "${SHA}..origin/${DEFAULT_BRANCH}" | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"

              if [ "$ACCEPT_DRIFT" != "true" ]; then
                echo "::error::${DRIFT} commit(s) landed on ${DEFAULT_BRANCH} after this draft was cut. Either re-point the draft and update its notes (gh release edit $TAG --repo $REPO --target \$(git rev-parse origin/${DEFAULT_BRANCH})), or re-dispatch with -f accept_drift=true to ship $TAG as-is." >&2
                exit 1
              fi
              echo "accept_drift was set: shipping ${SHA:0:12} and leaving the ${DRIFT} newer commit(s) for a later release."
            fi

            # Remove 'v' prefix for marketing version (CFBundleShortVersionString / versionName)
            VERSION_NUM="${TAG#v}"

            if [[ "$TAG" =~ -beta|-rc|-alpha ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi

            # Bundled release notes. The app compiles priv/changelog/<version>.md
            # into the image and shows it to users after they upgrade, so a
            # stable release without one ships a version nobody can read about.
            # Checked against the pinned SHA rather than the checkout, because
            # the draft may target an older commit than the default branch.
            if [ "$IS_PRERELEASE" != "true" ]; then
              NOTES_PATH="priv/changelog/${VERSION_NUM}.md"
              if ! git cat-file -e "${SHA}:${NOTES_PATH}" 2>/dev/null; then
                echo "::error::$TAG has no bundled release notes at ${NOTES_PATH} in commit ${SHA:0:12}. Add the file, merge it, re-pin the draft, and dispatch again." >&2
                exit 1
              fi
              echo "Bundled release notes found at ${NOTES_PATH}."
            fi
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION_NUM"
            echo "version_code=$VERSION_CODE"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

          echo "Building version: $VERSION_NUM (code: $VERSION_CODE, prerelease: $IS_PRERELEASE, commit: $SHA)"

      # What testers read in TestFlight's "What to Test". Computed here because
      # this is the only job with the resolved version and full history; the iOS
      # job's checkout is shallow and pinned. Runs on a dry run too, so the
      # rehearsal exercises it, and echoes the result into the step summary so
      # the notes can be read before any platform build finishes.
      #
      # The three values arrive through env rather than ${{ }} substitution into
      # the script body. The tag is a dispatch input, so a tag containing $(...)
      # would otherwise be parsed as command substitution here.
      - name: Compute store release notes
        id: testflight_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NOTES_SHA: ${{ steps.get_version.outputs.sha }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES=$(./scripts/testflight-notes.sh "$VERSION" "$NOTES_SHA" "$TAG")

          # A random delimiter: a fixed one appearing in the notes would
          # terminate the value early.
          DELIM="notes-$(openssl rand -hex 16)"
          {
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### TestFlight release notes"
            echo
            echo '```'
            echo "$NOTES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker / ${{ matrix.db }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            tag_suffix: ""
          - db: sqlite
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: ""
          - db: postgres
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            tag_suffix: "-pg"
          - db: postgres
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: "-pg"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Route Docker Hub pulls through Google's pull-through cache to avoid
      # anonymous rate-limit timeouts. The daemon mirror covers the BuildKit
      # image pull during buildx setup; buildkitd-config-inline covers the
      # base-image FROM pulls inside the build.
      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # A rehearsal proves the image builds without writing to ghcr.
          push: ${{ !inputs.dry_run }}
          build-args: |
            DATABASE_TYPE=${{ matrix.db }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_COMMIT=${{ needs.prepare.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}${{ matrix.tag_suffix }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.db }}
          # Only amd64 writes cache to avoid arm64 overwriting with different layers
          cache-to: ${{ matrix.arch == 'amd64' && format('type=gha,mode=max,scope=docker-{0}', matrix.db) || '' }}

  docker-merge:
    name: Docker / ${{ matrix.db }} / Merge
    needs: [prepare, docker-build]
    # Nothing was pushed during a rehearsal, so there is nothing to merge.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - db: sqlite
            tag_suffix: ""
          - db: postgres
            tag_suffix: "-pg"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail

          SOURCES="${IMAGE}:${VERSION}${SUFFIX}-amd64 ${IMAGE}:${VERSION}${SUFFIX}-arm64"

          # The exact version tag is always applied. Floating tags are only
          # applied when this release is the newest of its class, so that
          # patching an older line (v0.11.2 after v0.12.0) cannot drag
          # :latest, :0 and :0.11 backwards onto the older build. The same
          # applies to :beta against other prereleases.
          #
          # Only Mydia's own `vX.Y.Z` tags count. This repository also
          # publishes the metadata-relay under `metadata-relay-vX.Y.Z`, and
          # `ltrimstr("v")` leaves that prefix intact, so an unfiltered list
          # hands `sort -V` a string beginning with a letter. That sorts above
          # every numeric version, which made v0.13.0 look older than
          # metadata-relay-v0.9.0 and silently skipped :latest, :0.13 and :0.
          #
          # The pattern requires all three numeric components so it admits only
          # what `sort -V` can order sensibly. A trailing prerelease suffix
          # still matches, since `test` is not anchored at the end. `[.]` is
          # used rather than an escaped dot to keep the expression readable
          # through the YAML, shell and jq quoting layers.
          if [ "$IS_PRERELEASE" = "true" ]; then
            CLASS="prerelease"
            NEWEST=$(gh release list --repo "$REPO" --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == true) | .tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+")) | ltrimstr("v")] | .[]' \
              | sort -V | tail -n1)
          else
            CLASS="stable"
            NEWEST=$(gh release list --repo "$REPO" --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+")) | ltrimstr("v")] | .[]' \
              | sort -V | tail -n1)
          fi

          # This release is not published yet, so it is absent from the list
          # above. It is the newest when it sorts strictly after everything
          # already published in its class.
          IS_NEWEST=true
          if [ -n "$NEWEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$NEWEST" | sort -V | tail -n1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              IS_NEWEST=false
            fi
          fi

          TAGS="-t ${IMAGE}:${VERSION}${SUFFIX}"
          if [ "$IS_NEWEST" != "true" ]; then
            echo "::warning::${VERSION} is older than the newest published ${CLASS} release (${NEWEST}). Applying only :${VERSION}${SUFFIX} and skipping the floating tags so they keep pointing at ${NEWEST}."
            echo "- \`${SUFFIX:-sqlite}\`: applied \`${VERSION}${SUFFIX}\` only; floating tags left on \`${NEWEST}\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            TAGS="${TAGS} -t ${IMAGE}:beta${SUFFIX}"
          else
            MAJOR_MINOR=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+')
            MAJOR=$(echo "$VERSION" | grep -oE '^[0-9]+')
            TAGS="${TAGS} -t ${IMAGE}:${MAJOR_MINOR}${SUFFIX} -t ${IMAGE}:${MAJOR}${SUFFIX} -t ${IMAGE}:latest${SUFFIX}"
          fi

          docker buildx imagetools create ${TAGS} ${SOURCES}

          # Get the merged manifest digest for attestation
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}${SUFFIX}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  player-android:
    name: Player / Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build apk --release

      - name: Build AAB
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build appbundle --release

      - name: Setup Ruby for Fastlane
        if: ${{ !inputs.dry_run && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.PLAYER_PATH }}/android

      - name: Upload to Play Store
        if: ${{ !inputs.dry_run && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        working-directory: ${{ env.PLAYER_PATH }}/android
        run: |
          echo "${{ secrets.PLAY_STORE_CREDENTIALS }}" | base64 -d > play-store-credentials.json
          export GOOGLE_PLAY_JSON_KEY_PATH="$(pwd)/play-store-credentials.json"
          bundle exec fastlane internal
          rm play-store-credentials.json

      - name: "Upload artifact: APK"
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-android-apk
          path: ${{ env.PLAYER_PATH }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  player-ios:
    name: Player / iOS
    needs: prepare
    runs-on: macos-26
    # `upload_to_testflight` uses `distribute_external: true`, which cannot skip
    # waiting for Apple to finish processing the build, so a slow processing
    # queue parks this job in a poll loop with no upper bound of its own. On
    # v0.13.0 that ran 5h49m before the 6h default killed it, on a runner billed
    # at 10x. The job normally finishes in 17-20 minutes; this bounds the wait
    # while leaving generous headroom. Hitting it fails the publish gate, which
    # is the correct outcome: re-dispatch with `allow_missing=ios` to ship
    # without it, since the IPA reaches TestFlight whenever Apple is done
    # regardless of what this job reports.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          # Apple's CFBundleShortVersionString must be at most three
          # period-separated integers, so strip any prerelease suffix
          # (e.g. 0.12.0-beta.2 -> 0.12.0). The unique build number is
          # carried by VERSION_CODE (CFBundleVersion).
          MARKETING_VERSION="${VERSION%%-*}"
          sed -i '' "s/^version: .*/version: ${MARKETING_VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Install certificate and provisioning profile
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Configure manual signing for CI
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}/ios
        run: |
          # Extract provisioning profile name
          PP_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/pp.plist
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/pp.plist)
          echo "Using provisioning profile: $PP_NAME"

          # Remove CODE_SIGN_STYLE from project so xcconfig takes over
          sed -i '' '/CODE_SIGN_STYLE = Automatic;/d' Runner.xcodeproj/project.pbxproj

          # Inject signing overrides into Release.xcconfig
          cat >> Flutter/Release.xcconfig << EOF
          // CI Signing Overrides
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$PP_NAME
          EOF

      - name: Build iOS (unsigned)
        if: env.IOS_CERTIFICATE_BASE64 == ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ios --release --no-codesign

      - name: Build iOS (signed)
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ios --release

      - name: Setup Ruby for Fastlane
        if: ${{ !inputs.dry_run && env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.PLAYER_PATH }}/ios

      # The notes reach the shell through env, never through ${{ }} substitution
      # into this body: changelog text contains backticks and $, which would be
      # both an injection risk and a corruption bug.
      - name: Write TestFlight notes
        if: ${{ !inputs.dry_run && env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTES: ${{ needs.prepare.outputs.testflight_notes }}
        run: printf '%s' "$NOTES" > "$RUNNER_TEMP/testflight-notes.txt"

      - name: Upload to TestFlight
        if: ${{ !inputs.dry_run && env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          TESTFLIGHT_CHANGELOG_PATH: ${{ runner.temp }}/testflight-notes.txt
        working-directory: ${{ env.PLAYER_PATH }}/ios
        run: bundle exec fastlane beta

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  player-macos:
    name: Player / macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i '' "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Build macOS
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build macos --release

      - name: Install signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign app bundle
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          APP="${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

          # --force replaces the signature Xcode produced, and codesign does NOT
          # carry entitlements forward. Without --entitlements the app ships with
          # none at all, which breaks keychain access and silently drops the
          # user's pairing on every launch. Always re-apply them here.
          codesign --deep --force --options runtime \
            --entitlements "${{ env.PLAYER_PATH }}/macos/Runner/Release.entitlements" \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            "$APP"

          # Fail loudly rather than shipping an entitlement-less bundle again.
          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENTITLEMENTS"
          if ! grep -q "com.apple.security.network.client" <<<"$ENTITLEMENTS"; then
            echo "::error::Signed app is missing its entitlements — codesign dropped them."
            exit 1
          fi

      - name: Notarize app bundle
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          ditto -c -k --keepParent "Mydia Player.app" "Mydia Player.zip"
          xcrun notarytool submit "Mydia Player.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          rm "Mydia Player.zip"

      - name: Staple notarization ticket
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          xcrun stapler staple "${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.app"

      - name: Create DMG
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "Mydia Player.app" dmg_contents/

          # Create a symlink to Applications folder
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "Mydia Player" -srcfolder dmg_contents -ov -format UDZO "Mydia Player.dmg"

          rm -rf dmg_contents

      - name: Download Sparkle tools
        run: |
          curl -L https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          mkdir -p sparkle-tools
          tar xf sparkle.tar.xz -C sparkle-tools

      - name: Generate appcast
        if: env.SPARKLE_EDDSA_KEY != ''
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          DMG_FILE="Mydia Player.dmg"
          DMG_URL="https://github.com/getmydia/mydia/releases/download/v${VERSION}/mydia-player-macos-v${VERSION}.dmg"

          # sign_update prints a ready-to-paste XML attribute fragment, e.g.
          #   sparkle:edSignature="…" length="71098585"
          # It must be embedded in the enclosure verbatim. Do NOT wrap it in
          # another sparkle:edSignature="…" or add a separate length=, or the
          # enclosure ends up with a duplicated length attribute and a signature
          # value that is not valid base64 — which Sparkle rejects.
          SIGNATURE=$(echo "$SPARKLE_EDDSA_KEY" | $GITHUB_WORKSPACE/sparkle-tools/bin/sign_update "$DMG_FILE" --ed-key-file -)

          # Catch any future sign_update output-format drift before it reaches the
          # XML (cheap, no dependency).
          if ! printf '%s' "$SIGNATURE" | grep -Eq '^sparkle:edSignature="[^"]+" length="[0-9]+"$'; then
            echo "::error::Unexpected sign_update output, refusing to build appcast: $SIGNATURE"
            exit 1
          fi

          # sparkle:version must be the integer CFBundleVersion (VERSION_CODE) that
          # `flutter build macos` writes into the bundle — Sparkle compares
          # <sparkle:version> against the installed app's CFBundleVersion. The
          # marketing string stays in <sparkle:shortVersionString> for display only.
          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Mydia Player</title>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${VERSION_CODE}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="${DMG_URL}"
                           ${SIGNATURE}
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Validate appcast
        if: env.SPARKLE_EDDSA_KEY != ''
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # Fail the release here rather than ship an appcast Sparkle can't read.
          # xmllint is the load-bearing check — it catches the malformed-XML class
          # (e.g. the historical double-wrapped enclosure with a duplicated length
          # attribute). Shipped on GitHub macos runners, but don't silently no-op
          # if it is ever absent.
          if ! command -v xmllint >/dev/null 2>&1; then
            echo "::error::xmllint not found on runner; cannot validate appcast"
            exit 1
          fi

          xmllint --noout appcast.xml

          # Exactly one signature and one length attribute in the enclosure
          # (guards against re-nesting / sign_update output drift).
          ed_count=$(grep -o 'sparkle:edSignature="' appcast.xml | wc -l | tr -d ' ' || true)
          len_count=$(grep -o 'length="' appcast.xml | wc -l | tr -d ' ' || true)
          if [ "$ed_count" -ne 1 ] || [ "$len_count" -ne 1 ]; then
            echo "::error::appcast enclosure malformed: edSignature=$ed_count length=$len_count (expected 1 each)"
            cat appcast.xml
            exit 1
          fi

          # sparkle:version must be the integer build number, not the marketing
          # string, or Sparkle's newer-than comparison never offers the update.
          sparkle_version=$(sed -n 's#.*<sparkle:version>\(.*\)</sparkle:version>.*#\1#p' appcast.xml)
          if ! printf '%s' "$sparkle_version" | grep -Eq '^[0-9]+$'; then
            echo "::error::sparkle:version must be an integer build number, got '$sparkle_version'"
            exit 1
          fi

          # NOTE: a cryptographic self-verify (sign_update --verify) is deliberately
          # NOT wired here — the 2.x verify invocation and key material (it checks
          # against a public key; the pipeline holds the private one) are unresolved
          # on the pinned 2.8.1 toolchain. The guard therefore proves well-formedness
          # and enclosure shape, not signature validity. See the plan's KTD3 / R4.
          echo "appcast.xml validated (well-formed, single signature/length, sparkle:version=$sparkle_version)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-macos-dmg
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/Mydia Player.dmg
          retention-days: 30

      - name: Upload appcast artifact
        if: env.SPARKLE_EDDSA_KEY != ''
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-macos-appcast
          path: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/appcast.xml
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  player-windows:
    name: Player / Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Build Windows
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build windows --release

      # Must run before the installer is packaged: installer.iss globs the same
      # Release directory, so the DLLs are only in the shipped installer if they
      # are on disk by now. Without this every clean Windows machine fails to
      # launch with "msvcp140.dll was not found".
      - name: Bundle VC++ runtime
        shell: pwsh
        run: pwsh ${{ env.PLAYER_PATH }}/tool/bundle_windows_runtime.ps1

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: player/windows/installer.iss
          options: /DMyAppVersion=${{ needs.prepare.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-windows-installer
          path: ${{ env.PLAYER_PATH }}/build/installer/mydia-player-windows-v${{ needs.prepare.outputs.version }}.exe
          retention-days: 30

  player-linux:
    name: Player / Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Build Linux
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-linux-bundle
          path: ${{ env.PLAYER_PATH }}/build/linux/x64/release/bundle
          retention-days: 30

  player-flatpak:
    name: Player / Flatpak
    needs: prepare
    runs-on: ubuntu-latest
    # mpv, libplacebo and libass are roughly a third of this; the Flutter
    # build and its Rust cdylib are the rest.
    timeout-minutes: 90
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Pick the channel
        id: channel
        env:
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # The same flag that decides :beta against :latest for Docker.
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # appstream provides appstreamcli, which flatpak-builder shells out to
          # on the host during export. Without it the build fails at the very
          # last step, after everything has already compiled.
          sudo apt-get install -y flatpak flatpak-builder xvfb appstream

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts these through AppArmor, which breaks the
        # bubblewrap sandbox flatpak-builder needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub and install the runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Stamp the version
        run: |
          ./player/flatpak/stamp-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.version_code }}" \
            "$(date -u +%Y-%m-%d)"

      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=staged-repo \
            --default-branch=${{ steps.channel.outputs.channel }} \
            build-dir player/flatpak/dev.mydia.player.yml

      - name: Install and smoke test
        run: |
          flatpak remote-add --user --no-gpg-verify --if-not-exists \
            staged "$PWD/staged-repo"
          flatpak install --user -y --reinstall staged dev.mydia.player
          ./player/flatpak/smoke-test.sh ${{ steps.channel.outputs.channel }}

      - name: Rehearse signing and install (dry run only)
        if: inputs.dry_run
        run: |
          set -euo pipefail
          # flatpak-publish is skipped on a dry run because it needs `publish`,
          # which carries !inputs.dry_run. So the rehearsal of signing and of
          # installing from a signed repo has to happen here, with a throwaway
          # key. The real key never enters this job in either mode.
          sudo apt-get install -y ostree rclone
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          # --pinentry-mode loopback is required even for an unprotected key,
          # or gpg-agent fails with "No pinentry" on a headless runner.
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "Dry Run <dryrun@mydia.dev>" rsa2048 sign never
          KEYID=$(gpg --list-keys --with-colons dryrun@mydia.dev | awk -F: '/^fpr:/ {print $10; exit}')

          # The destination is a local directory, which rclone treats like any
          # other backend. Nothing leaves the runner.
          #
          # It has to exist first. publish.sh opens with `rclone sync $DEST
          # $LIVE` to read the live repo down, and rclone's local backend fails
          # that with "directory not found" when the source root is missing,
          # where the S3 backend the real publish uses returns an empty listing
          # for a prefix that holds no objects. So the real first publish is
          # fine and only the rehearsal needs this.
          mkdir -p "$PWD/dryrun-dest"
          GPG_KEY_ID="$KEYID" LIVE_REPO_DIR="$PWD/dryrun-live" \
            ./player/flatpak/publish.sh \
              "${{ steps.channel.outputs.channel }}" \
              "$PWD/staged-repo" "$PWD/dryrun-dest"

          # Replace the unsigned staged install with one that came through the
          # real signing and publishing path.
          flatpak uninstall --user -y dev.mydia.player
          flatpak remote-add --user --no-gpg-verify --if-not-exists \
            dryrun "$PWD/dryrun-dest"
          flatpak install --user -y dryrun dev.mydia.player
          ./player/flatpak/smoke-test.sh ${{ steps.channel.outputs.channel }}
          echo "Dry run rehearsal complete. Nothing was uploaded."

      - name: Upload staged repo
        uses: actions/upload-artifact@v4
        with:
          # Deliberately not named mydia-player-*: the publish job downloads
          # that pattern and has no use for a multi-hundred-megabyte repo.
          name: flatpak-repo-staged
          path: staged-repo
          retention-days: 30

  publish:
    name: Publish Release
    # always() so this job runs even when a platform failed, and can report
    # which one. The gate below decides whether it proceeds.
    if: always() && needs.prepare.result == 'success' && !inputs.dry_run
    needs:
      - prepare
      - docker-merge
      - player-android
      - player-ios
      - player-macos
      - player-windows
      - player-linux
      - player-flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require every platform to have built
        id: gate
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing }}
          RESULT_DOCKER: ${{ needs.docker-merge.result }}
          RESULT_ANDROID: ${{ needs.player-android.result }}
          RESULT_IOS: ${{ needs.player-ios.result }}
          RESULT_MACOS: ${{ needs.player-macos.result }}
          RESULT_WINDOWS: ${{ needs.player-windows.result }}
          RESULT_LINUX: ${{ needs.player-linux.result }}
          RESULT_FLATPAK: ${{ needs.player-flatpak.result }}
        run: |
          set -euo pipefail

          # Publishing used to happen regardless of platform outcome, so a
          # failed Windows build shipped a release quietly missing its
          # installer. Every platform must now succeed, or be waived by name.
          WAIVED=",$(echo "$ALLOW_MISSING" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'),"

          # Join array elements with ", ". ${arr[*]} only ever uses the first
          # character of IFS, so a two-character separator cannot be done that
          # way.
          join() { printf '%s, ' "$@" | sed 's/, $//'; }

          FAILED=()
          FAILED_NAMES=()
          WAIVED_LIST=()
          WAIVED_NAMES=()
          for entry in \
            "docker:$RESULT_DOCKER" \
            "android:$RESULT_ANDROID" \
            "ios:$RESULT_IOS" \
            "macos:$RESULT_MACOS" \
            "windows:$RESULT_WINDOWS" \
            "linux:$RESULT_LINUX" \
            "flatpak:$RESULT_FLATPAK"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            [ "$result" = "success" ] && continue
            if [[ "$WAIVED" == *",${name},"* ]]; then
              WAIVED_LIST+=("${name} (${result})")
              WAIVED_NAMES+=("${name}")
            else
              FAILED+=("${name} (${result})")
              FAILED_NAMES+=("${name}")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            # The suggestion carries the already-waived platforms too, so that
            # pasting it does not silently drop an existing waiver.
            SUGGEST=$(IFS=','; echo "${FAILED_NAMES[*]}${WAIVED_NAMES[*]:+,${WAIVED_NAMES[*]}}")
            printf '::error::Refusing to publish: %s did not succeed. Re-run the failed jobs, or re-dispatch with -f allow_missing=%s to ship without them.\n' \
              "$(join "${FAILED[@]}")" "$SUGGEST" >&2
            exit 1
          fi

          if [ ${#WAIVED_LIST[@]} -gt 0 ]; then
            NOTE="Published without: $(join "${WAIVED_LIST[@]}")"
            echo "::warning::${NOTE}"
            {
              echo "### Waived platforms"
              echo
              echo "$NOTE"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "note=${NOTE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mydia-player-*

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -R artifacts/

      - name: Create release archives
        run: |
          cd artifacts
          [ -d "mydia-player-android-apk" ] && \
            mv mydia-player-android-apk/app-release.apk mydia-player-android-v${{ needs.prepare.outputs.version }}.apk || true

          [ -d "mydia-player-macos-dmg" ] && \
            mv "mydia-player-macos-dmg/Mydia Player.dmg" mydia-player-macos-v${{ needs.prepare.outputs.version }}.dmg || true

          [ -d "mydia-player-windows-installer" ] && \
            mv mydia-player-windows-installer/mydia-player-windows-v${{ needs.prepare.outputs.version }}.exe . || true

          [ -d "mydia-player-linux-bundle" ] && \
            chmod +x mydia-player-linux-bundle/mydia-player && \
            tar -czf mydia-player-linux-v${{ needs.prepare.outputs.version }}.tar.gz -C mydia-player-linux-bundle . || true

          [ -d "mydia-player-macos-appcast" ] && \
            mv mydia-player-macos-appcast/appcast.xml . || true

      - name: Validate appcast (publish gate)
        working-directory: artifacts
        run: |
          # Defense-in-depth gate on the appcast actually about to ship. Generation-
          # time malformation is already caught upstream: the player-macos "Validate
          # appcast" step fails the job before "Upload appcast artifact" runs, so a
          # malformed appcast never becomes an artifact and never reaches here. This
          # re-runs the same well-formedness/shape checks against the downloaded
          # artifact to catch corruption-in-transit (or a well-formed-but-wrong
          # appcast) before upload — failing publish rather than shipping it.
          #
          # `always()` only governs whether this job runs when an upstream build
          # failed; it does NOT make this check non-blocking. Two outcomes:
          #   - No appcast present (fork run, missing secret, or a failed macOS
          #     job that produced no artifact): the guard below exits 0, so the
          #     other platforms still publish.
          #   - An appcast IS present but fails these checks: this step fails the
          #     entire `publish` job. That is intentional — we refuse to ship a
          #     release with a broken auto-update feed rather than silently
          #     dropping just the macOS assets.
          if [ ! -f appcast.xml ]; then
            echo "No appcast.xml in artifacts — nothing to validate (non-macOS or fork run)."
            exit 0
          fi

          if ! command -v xmllint >/dev/null 2>&1; then
            echo "Installing libxml2-utils for xmllint"
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi

          xmllint --noout appcast.xml

          ed_count=$(grep -o 'sparkle:edSignature="' appcast.xml | wc -l | tr -d ' ' || true)
          len_count=$(grep -o 'length="' appcast.xml | wc -l | tr -d ' ' || true)
          if [ "$ed_count" -ne 1 ] || [ "$len_count" -ne 1 ]; then
            echo "::error::Refusing to publish malformed appcast: edSignature=$ed_count length=$len_count (expected 1 each)"
            cat appcast.xml
            exit 1
          fi

          # Mirror the macOS-job check: sparkle:version must be the integer build
          # number, or Sparkle never offers the update even though the release ships.
          sparkle_version=$(sed -n 's#.*<sparkle:version>\(.*\)</sparkle:version>.*#\1#p' appcast.xml)
          if ! printf '%s' "$sparkle_version" | grep -Eq '^[0-9]+$'; then
            echo "::error::Refusing to publish: sparkle:version must be an integer build number, got '$sparkle_version'"
            exit 1
          fi
          echo "appcast.xml passed publish-gate validation (sparkle:version=$sparkle_version)."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        working-directory: artifacts
        run: |
          shopt -s nullglob
          FILES=()
          for pattern in \
            "mydia-player-android-*.apk" \
            "mydia-player-macos-*.dmg" \
            "mydia-player-windows-*.exe" \
            "mydia-player-linux-*.tar.gz" \
            "appcast.xml"; do
            for f in $pattern; do
              FILES+=("$f")
            done
          done

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi

          echo "Uploading to release ${TAG}:"
          printf '  %s\n' "${FILES[@]}"

          gh release upload "${TAG}" "${FILES[@]}" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          WAIVER: ${{ steps.gate.outputs.note }}
        run: |
          set -euo pipefail

          # A waived platform means the release ships without one of its
          # assets. Record that on the release itself, so the gap is visible
          # to anyone who lands on the page rather than only in the run log.
          if [ -n "$WAIVER" ]; then
            BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body')
            printf '%s\n\n---\n\n> **Incomplete release.** %s\n' "$BODY" "$WAIVER" \
              | gh release edit "$TAG" --repo "$REPO" --notes-file -
          fi

          gh release edit "${TAG}" \
            --draft=false \
            --repo "$REPO"

          echo "Released: https://github.com/${REPO}/releases/tag/${TAG} (${SHA})"

  docs:
    name: Deploy Docs
    if: needs.prepare.outputs.is_prerelease == 'false' && !inputs.dry_run
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --project docs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || echo "gh-pages branch does not exist yet"

      - name: Deploy versioned docs
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          uv run --project docs mike delete --push latest || true
          uv run --project docs mike deploy --push --update-aliases "$VERSION" latest
          uv run --project docs mike set-default --push latest

  web-player:
    name: Deploy Web Player
    # Stable only, matching `docs` above and the Docker :latest tag.
    # web.mydia.dev is a single public surface with no staging copy, so a
    # prerelease published there would reach every viewer with no way to opt
    # in. Betas stay on the installable builds, which a user chooses.
    if: needs.prepare.outputs.is_prerelease == 'false' && !inputs.dry_run
    needs:
      - prepare
      - publish
    permissions:
      contents: read
    # Builds and deploys the same bundle a manual dispatch would. Reused
    # rather than restated here: the build is nine steps of nix, devenv,
    # Cachix and a pinned flutter_rust_bridge install, and a second copy
    # would drift from the one that gets exercised between releases.
    uses: ./.github/workflows/deploy-web-player.yml
    with:
      # The commit the draft pins, so the bundle, the tag and the images all
      # describe one commit even when master has moved past it.
      ref: ${{ needs.prepare.outputs.sha }}
      # Literal, and it must equal the `mydia-web` Pages project's production
      # branch. Anything else deploys green to a preview URL and leaves
      # web.mydia.dev on the previous release.
      branch: master
    # Named one by one instead of `secrets: inherit`, which would pass this
    # workflow every secret the repository holds, signing keys included, to
    # build a static bundle. These two are what it uses.
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  flatpak-publish:
    name: Publish Flatpak
    # Needs `publish`, which carries !inputs.dry_run, so this is skipped
    # entirely on a rehearsal. No R2 traffic can happen during a dry run.
    needs:
      - prepare
      - player-flatpak
      - publish
    runs-on: ubuntu-latest
    concurrency:
      # Syncing down, committing and syncing back up is a read-modify-write
      # against one shared repo. The workflow's release-${version} group does
      # not serialise two different versions against each other.
      group: flatpak-publish-${{ needs.player-flatpak.outputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree rclone

      - name: Download staged repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo-staged
          path: staged-repo

      - name: Restore the staged repo's empty directories
        # upload-artifact does not preserve empty directories, and an ostree
        # repo is full of them. See player/flatpak/ensure-skeleton.sh for why
        # this is mkdir rather than `ostree init`.
        #
        # The dry run cannot catch a regression here. It rehearses against
        # $PWD/staged-repo in the build job, which never goes through an
        # artifact, so the skeleton is still intact there.
        run: ./player/flatpak/ensure-skeleton.sh staged-repo

      - name: Import the signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not set. See docs/contributing/releasing.md, 'Flatpak channels'." >&2
            exit 1
          fi
          echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d \
            | gpg --batch --pinentry-mode loopback --import

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # no_check_bucket is required, not a tuning knob. An R2 token scoped to
          # object read/write on one bucket cannot ListBuckets, so rclone's
          # existence probe fails and it falls back to CreateBucket, which the
          # token also cannot do. Every upload then dies on a misleading
          # "AccessDenied: CreateBucket" that reads like bad credentials.
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Publish
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          CHANNEL: ${{ needs.player-flatpak.outputs.channel }}
        run: |
          ./player/flatpak/publish.sh "$CHANNEL" staged-repo "r2:mydia-flatpak/$CHANNEL"

      - name: Publish the .flatpakrepo files
        run: |
          set -euo pipefail
          ./player/flatpak/make-flatpakrepo.sh repofiles
          rclone copy repofiles r2:mydia-flatpak --include '*.flatpakrepo'

      - name: Verify the published repo end to end
        env:
          CHANNEL: ${{ needs.player-flatpak.outputs.channel }}
        run: |
          set -euo pipefail
          # Detection, not prevention: the GitHub release is already published
          # by now. A failure here means running the rollback procedure in
          # docs/contributing/releasing.md.
          if [ "$CHANNEL" = "beta" ]; then
            REPOFILE="https://flatpak.mydia.dev/mydia-beta.flatpakrepo"
            REMOTE="mydia-beta"
          else
            REPOFILE="https://flatpak.mydia.dev/mydia.flatpakrepo"
            REMOTE="mydia"
          fi

          # The runtime comes from Flathub, and this job is a different runner
          # from the one that built the Flatpak, so it has no remotes at all.
          # Without this the install fails with "requires the runtime
          # org.gnome.Platform/x86_64/50 which was not found", which says
          # nothing about whether our own repo is sound. It is what the
          # verification reported on v0.13.0-beta.6, whose repo was in fact
          # published correctly and installable by anyone who has Flathub.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          flatpak remote-add --user --if-not-exists --from "$REMOTE" "$REPOFILE"
          flatpak install --user -y "$REMOTE" dev.mydia.player
          flatpak info --user dev.mydia.player
          echo "Verified: dev.mydia.player installs from $REPOFILE"
