name: Player / Android

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string (e.g. 0.14.0 or 0.14.0-dev.1)
        type: string
        required: true
      version_code:
        description: Monotonically increasing integer build number
        type: string
        required: true
      upload_to_play_store:
        description: Whether to upload to Google Play Store
        type: boolean
        required: false
        default: false
      play_store_track:
        description: Google Play track (e.g. internal, beta)
        type: string
        required: false
        default: 'internal'
      dry_run:
        description: Build without uploading
        type: boolean
        required: false
        default: false
      publish_dev_build:
        description: Upload the APK to the dev build bucket and refresh its index
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_STORE_CREDENTIALS:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.version_code }}"
          sed -i "s/^version: .*/version: ${VERSION}+${VERSION_CODE}/" pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build AAB
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build appbundle --release --target-platform android-arm,android-arm64

      - name: Check APK ABIs
        run: ./scripts/check-apk-abis.sh ${{ env.PLAYER_PATH }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Check AAB ABIs
        run: ./scripts/check-apk-abis.sh ${{ env.PLAYER_PATH }}/build/app/outputs/bundle/release/app-release.aab

      - name: Publish the dev build to R2
        if: ${{ inputs.publish_dev_build && !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "::error::R2 credentials are incomplete (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY are all required), so the dev build cannot be published."
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq

          # The token is scoped to object read/write on one bucket and cannot
          # ListBuckets, which rclone's default config probes for. Same shape
          # as the Flatpak publish in release.yml.
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

          APK="${PLAYER_PATH}/build/app/outputs/flutter-apk/app-release.apk"
          NAME="mydia-player-android-${VERSION}.apk"
          OWN_FILE="android/${NAME}"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)

          # Attempt 1 of this exact upload has been observed to fail with a
          # transient "NotImplemented: Not Implemented" from R2 (rclone
          # 1.60.1 from Ubuntu's apt, a 109 MiB APK), then succeed on
          # attempt 2 with nothing else changed. This is not a
          # multipart-threshold problem: R2's own limits documentation
          # (developers.cloudflare.com/r2/platform/limits/) puts the
          # single-part PutObject cap at ~5 GiB, far above any APK this
          # produces, and a search of rclone's changelog between v1.60.0 and
          # v1.65.0 found no fix matching this symptom, so there is no
          # specific rclone version or flag to point at instead. What
          # actually recovered it is rclone's own default `--retries=3`
          # (`rclone help flags`), already active here with no flags of its
          # own, which retries the whole `copyto` up to twice more on
          # failure. Community reports describe assorted transient R2-side
          # errors (403s, signature failures, NotImplemented) across many
          # rclone versions with no single client-side bug behind them,
          # consistent with edge-node flakiness on R2's side rather than a
          # defect here. This step runs once per manually dispatched dev
          # build, not in a hot path, so relying on the existing default
          # instead of an unproven flag or a version pin is the accepted
          # trade-off, not an oversight.
          rclone copyto "$APK" "r2:mydia-dev-builds/${OWN_FILE}"

          # Read, amend, write. The index is small and only this workflow
          # writes it, so a read-modify-write is safe and avoids a bucket
          # listing the scoped token may not allow.
          #
          # The exit code alone cannot say whether an index already exists.
          # Against a local filesystem rclone exits 3 for a missing
          # directory and 4 for a missing file, but against R2 (S3) a
          # missing object exits 0 and writes nothing at all: this bit a
          # real publish, whose bucket was empty on its very first run, so
          # `index.json` came back a zero-byte file, the case below took the
          # `0)` branch, and the survival check below failed on an index
          # that never described anything. So the case here only separates
          # "worth inspecting further" (0, 3, 4) from a genuine read
          # failure; the actual bootstrap decision is made afterward by
          # checking what index.json actually contains, not by trusting any
          # exit code. Any other exit is a real read failure, and treating
          # it as "no index yet" would clobber the bucket's real index with
          # one built from an empty base, dropping every previously tracked
          # build, so that case still fails loudly instead of guessing.
          set +e
          rclone cat r2:mydia-dev-builds/index.json > index.json 2>rclone-cat.err
          RCLONE_CAT_RC=$?
          set -e
          case "$RCLONE_CAT_RC" in
            0|3|4) ;;
            *)
              cat rclone-cat.err >&2
              echo "::error::Could not read the existing index.json from R2 (rclone exit ${RCLONE_CAT_RC}). Leaving the bucket's index untouched."
              exit 1
              ;;
          esac

          # index.json might be empty, absent, `{}`, or otherwise not shaped
          # like an index, whatever the exit code said. Bootstrap whenever it
          # is not a JSON object with a .builds array; only a genuinely
          # populated, well-formed index is used as-is.
          if ! jq -e 'type == "object" and has("builds") and (.builds | type == "array")' index.json > /dev/null 2>&1; then
            echo '{"builds":[]}' > index.json
          fi

          # The container can be a well-formed {"builds": [...]} array while
          # still holding a malformed element inside it: a null, a bare
          # string, or an object missing platform, build, or file. That
          # entry survives the check above, then `-.build` below throws on
          # anything that is not a number, and set -e stops the step before
          # rclone copyto ever writes the index back, wedging every future
          # publish behind one bad row that only manual bucket surgery can
          # clear. Drop malformed entries instead of failing the whole
          # index, using the same three required fields the feed generator
          # does (isWellFormedDevBuild in
          # scripts/appcast/lib/releases-json.mjs: a string platform, a
          # number build, a string file), so this step never accepts what
          # the generator would silently reject anyway. Filtering here,
          # before the amend below, means the prune and the survival check
          # both run against the cleaned set, so a genuine prune loss is
          # still refused correctly even when the index it is competing
          # against also had junk in it. jq's `type` (unlike JS's `typeof`)
          # already reports "null" for null, so the object check alone
          # excludes it without a separate null test, and short-circuiting
          # `and` means a non-object entry is never indexed into, so this
          # cannot itself throw on the very values it is filtering out.
          WELL_FORMED='type == "object" and (.platform | type == "string") and (.build | type == "number") and (.file | type == "string")'
          jq -c ".builds[] | select(($WELL_FORMED) | not)" index.json | while IFS= read -r bad; do
            echo "::warning::Dropping malformed dev build index entry (missing or mistyped platform, build, or file): ${bad}"
          done
          jq ".builds |= map(select($WELL_FORMED))" index.json > index.clean.json
          mv index.clean.json index.json

          jq --arg version "$VERSION" \
             --argjson build "$VERSION_CODE" \
             --arg file "$OWN_FILE" \
             --argjson size "$SIZE" \
             --arg sha "$SHA" \
             --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '{builds: ([{platform: "android", version: $version, build: $build, file: $file, size: $size, sha256: $sha, published_at: $published}]
                        + [.builds[] | select(.platform != "android" or .version != $version)])
                       | sort_by(-.build) }' index.json > index.next.json

          # Keep the newest five per platform.
          jq '{builds: [.builds | group_by(.platform)[] | sort_by(-.build) | .[0:5]] | flatten | sort_by(-.build)}' \
            index.next.json > index.kept.json

          # If this run's own build did not survive the prune, refuse rather
          # than silently discard it or hide it from the index. The APK is
          # already uploaded and is left in place; it is simply never
          # deleted or indexed by this run.
          if ! jq -e --arg file "$OWN_FILE" '.builds | any(.file == $file)' index.kept.json > /dev/null; then
            LOWEST_KEPT=$(jq -r '[.builds[] | select(.platform == "android") | .build] | min' index.kept.json)
            echo "::error::Build ${VERSION_CODE} (version ${VERSION}) is older than the five newest android builds already published (lowest kept build: ${LOWEST_KEPT}). Publishing it would either discard it or hide it from the index, so refusing."
            exit 1
          fi

          # Delete the files that fell out of the kept set. The just-uploaded
          # file is also excluded explicitly here, whatever the ranking says,
          # even though the check above already guarantees it survived.
          jq -r --slurpfile kept index.kept.json --arg own "$OWN_FILE" \
            '[.builds[].file] - [$kept[0].builds[].file] - [$own] | .[]' \
            index.next.json > dropped.txt
          while read -r file; do
            if [ -n "$file" ]; then
              rclone deletefile "r2:mydia-dev-builds/${file}" || echo "::warning::Failed to delete stale build ${file} from R2; it may need manual cleanup."
            fi
          done < dropped.txt

          rclone copyto index.kept.json r2:mydia-dev-builds/index.json
          echo "Published ${NAME} (build ${VERSION_CODE})." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Ruby for Fastlane
        if: ${{ inputs.upload_to_play_store && !inputs.dry_run }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.PLAYER_PATH }}/android

      - name: Upload to Play Store
        if: ${{ inputs.upload_to_play_store && !inputs.dry_run }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        working-directory: ${{ env.PLAYER_PATH }}/android
        run: |
          echo "$PLAY_STORE_CREDENTIALS" | base64 -d > play-store-credentials.json
          export GOOGLE_PLAY_JSON_KEY_PATH="$(pwd)/play-store-credentials.json"
          bundle exec fastlane ${{ inputs.play_store_track }}
          rm play-store-credentials.json

      - name: "Upload artifact: APK"
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-android-apk
          path: ${{ env.PLAYER_PATH }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
