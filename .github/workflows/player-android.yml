name: Player / Android

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string (e.g. 0.14.0 or 0.14.0-dev.1)
        type: string
        required: true
      version_code:
        description: Monotonically increasing integer build number
        type: string
        required: true
      upload_to_play_store:
        description: Whether to upload to Google Play Store
        type: boolean
        required: false
        default: false
      play_store_track:
        description: Google Play track (e.g. internal, beta)
        type: string
        required: false
        default: 'internal'
      dry_run:
        description: Build without uploading
        type: boolean
        required: false
        default: false
      publish_dev_build:
        description: Upload the APK to the dev build bucket and refresh its index
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_STORE_CREDENTIALS:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The prep action comes from this workflow's own commit, not from
      # inputs.sha: player-ios-refresh rebuilds an old release tag and
      # player-ondemand can build an old branch, neither of which has it.
      - name: Checkout CI actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          # scripts/dev-builds comes from here too, not from the build
          # target: an older target predates the dev build publisher.
          sparse-checkout: |
            .github/actions
            scripts/dev-builds
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter prep
        uses: ./.ci-actions/.github/actions/player-flutter-prep
        with:
          version: ${{ inputs.version }}
          pubspec-version: ${{ inputs.version }}+${{ inputs.version_code }}

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      - name: Build AAB
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      - name: Check APK ABIs
        run: ./scripts/check-apk-abis.sh ${{ env.PLAYER_PATH }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Check AAB ABIs
        run: ./scripts/check-apk-abis.sh ${{ env.PLAYER_PATH }}/build/app/outputs/bundle/release/app-release.aab

      - name: "Upload artifact: APK"
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-android-apk
          path: ${{ env.PLAYER_PATH }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Setup Ruby for Fastlane
        if: ${{ inputs.upload_to_play_store && !inputs.dry_run && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ env.PLAYER_PATH }}/android

      - name: Upload to Play Store
        if: ${{ inputs.upload_to_play_store && !inputs.dry_run && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        working-directory: ${{ env.PLAYER_PATH }}/android
        run: |
          echo "$PLAY_STORE_CREDENTIALS" | base64 -d > play-store-credentials.json
          export GOOGLE_PLAY_JSON_KEY_PATH="$(pwd)/play-store-credentials.json"
          bundle exec fastlane ${{ inputs.play_store_track }}
          rm play-store-credentials.json

  # The R2 dev index publish runs as its own job so that only the few seconds
  # of index.json read-amend-write hold the shared lock, not the whole build.
  # Holding it for the build serialised a master dispatch's Android and macOS
  # builds one after the other. player-macos.yml has the twin of this job.
  publish-dev-build:
    name: Publish dev build
    needs: build
    # release.yml calls this workflow without publish_dev_build, so a tagged
    # release never runs this job and never waits on the lock.
    if: ${{ inputs.publish_dev_build && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Serialises every write to the dev build index.json, across runs, refs
    # and platforms: publish.sh does an unlocked read-amend-write, so two
    # concurrent publishes could both read the same index and the later write
    # would drop the earlier entry while its file stays in the bucket.
    concurrency:
      group: mydia-dev-builds-index
      cancel-in-progress: false
      # The default (single) cancels a pending job when another joins the
      # group, so a second platform or dispatch would silently drop one.
      queue: max
    steps:
      # scripts/dev-builds comes from this workflow's own commit, not from
      # the build target: an older target predates the dev build publisher.
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: scripts/dev-builds
          persist-credentials: false

      - name: "Download artifact: APK"
        uses: actions/download-artifact@v8
        with:
          name: mydia-player-android-apk
          path: apk

      - name: Publish the dev build to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          # Upload, index amend, prune and refusal rules all live in the
          # shared script, which player-macos.yml calls too.
          DEV_BUILD_PLATFORM=android \
          DEV_BUILD_SOURCE="apk/app-release.apk" \
          DEV_BUILD_FILE="android/mydia-player-android-${VERSION}.apk" \
          DEV_BUILD_VERSION="$VERSION" \
          DEV_BUILD_NUMBER="$VERSION_CODE" \
            ./.ci-actions/scripts/dev-builds/publish.sh
