name: CI

# The backend's checks are flake checks (nix/ci/), built as derivations and
# cached in niks3 (cache.mydia.dev); design/specs/2026-11-20-nix-ci-checks-design.md
# and .github/ci.md, "ci.yml: the flake-check graph".
#
#   plan          nix-eval-jobs --check-cache-status: which checks the cache lacks
#   inputs        ciInternal derivations two or more of those checks need, built once
#   checks        one job per uncached check; inputs come from the cache by now
#   nixos         the NixOS module VM tests, the same way but non-blocking;
#                 master pushes, workflow_dispatch and Dependabot PRs only
#   Nix / Checks  the aggregator of plan, inputs and checks
#   pins          master only: refresh the master-<name> pin of every output
#
# A run where nothing changed what the checks read plans two empty matrices,
# skips both build jobs and finishes in the time it takes to evaluate. There
# is no path filter: the derivation graph is the filter.
#
# Four jobs stay outside the sandbox: Guards (yq over this file), Lint /
# Ratchet (reads git history), Rust / SMB integration (needs a root smbd)
# and Build / Android (Gradle has no lockfile Nix could fetch from). The
# required checks Test, Test / PostgreSQL, Test / E2E Browser, Test / Player,
# Build / Web, Build / Linux and Check / Web icons sit on aggregators at the
# end; the player ones gate on the player-* checks through Nix / Checks.

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
  workflow_dispatch:

# In-progress master runs are not cancelled, so a started run finishes and
# refreshes the pins. GitHub still replaces a pending (queued) master run when
# a newer one joins the group; the newer run then pins the newer closure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing more. id-token: write (the niks3
# OIDC token) is granted per job, only to the jobs that push.
permissions:
  contents: read

env:
  # Harden Rust crate fetches against transient crates.io flakiness (the SMB
  # job builds its crate outside the sandbox). CI intermittently hit "download of … failed / curl failed / [16]
  # Error in the HTTP2 framing layer". Forcing HTTP/1.1 (no multiplexing)
  # sidesteps that libcurl HTTP/2 bug and a generous retry count rides out
  # brief network blips.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  # The repository's file-only guards are the `guards` flake check
  # (nix/ci/guards.nix). This one reads the workflows with yq, and as a
  # check it would rerun on every workflow edit, so it stays a job: it needs
  # no Nix and takes seconds.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The required contexts in the Master ruleset must never conclude
      # `skipped` (.github/ci-flakes.md, "Why the list was short"). Each lives on
      # an aggregator whose only job-level condition is always(). Build /
      # Android is a plain job with no `needs`, so nothing can skip it.
      - name: Guard the required-check aggregators
        run: |
          set -euo pipefail
          FAIL=0
          for name in "Test" "Test / PostgreSQL" "Test / E2E Browser" \
                      "Test / Player" "Test / Player E2E" "Build / Web" "Build / Linux" "Check / Web icons"; do
            count=$(yq -r "[.jobs[] | select(.name == \"$name\")] | length" .github/workflows/ci.yml)
            cond=$(yq -r ".jobs[] | select(.name == \"$name\") | .if" .github/workflows/ci.yml)
            if [ "$count" != "1" ] || [ "$cond" != "always()" ]; then
              echo "::error::required check '$name' must be on exactly one job with if: always() (found $count job(s), if: $cond)"
              FAIL=1
            fi
          done
          exit "$FAIL"

  plan:
    name: Nix / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      inputs: ${{ steps.plan.outputs.inputs }}
      checks: ${{ steps.plan.outputs.checks }}
      nixos: ${{ steps.plan.outputs.nixos }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Evaluation only: no disk to free, nothing to push.
      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          push: 'false'
          free-disk: 'false'

      # From the flake's own nixpkgs pin, so the planner moves with flake.lock.
      - name: Install nix-eval-jobs
        run: |
          out="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#nix-eval-jobs)"
          echo "$out/bin" >> "$GITHUB_PATH"

      - name: Plan
        id: plan
        env:
          CI_PLAN_WORKERS: '4'
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          scripts/ci-plan.sh > "$plan"
          {
            echo "inputs=$(jq -c .inputs "$plan")"
            echo "checks=$(jq -c .checks "$plan")"
            echo "nixos=$(jq -c .nixos "$plan")"
            echo "all=$(jq -c .all "$plan")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Nix plan"
            echo
            nixos_note="to build"
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
              nixos_note="uncached, not built on non-Dependabot pull requests"
            fi
            echo "$(jq '.inputs | length' "$plan") inputs and $(jq '.checks | length' "$plan") checks to build, $(jq '.nixos | length' "$plan") NixOS VM tests (non-blocking) $nixos_note; everything else is cached."
            echo
            jq -r --arg note "$nixos_note" '
              (.inputs | map("- input `\(.name)`")),
              (.checks | map("- `\(.name)` (\(.group))")),
              (.nixos | map("- `\(.name)` (nixos, non-blocking, \($note))"))
              | .[]' "$plan"
          } >> "$GITHUB_STEP_SUMMARY"
          jq 'del(.all)' "$plan"

  # Skipped for fork PRs (no OIDC token) and Dependabot runs (which may not get
  # one): building inputs nobody may be able to fetch only duplicates what each
  # check job then builds for itself.
  inputs:
    name: Nix / Input (${{ matrix.name }})
    needs: plan
    if: >-
      needs.plan.outputs.inputs != '[]'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.inputs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action drops the pin on every ref but master.
      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          pin: master-${{ matrix.name }}

      - name: Build
        env:
          ATTR: ${{ matrix.attr }}
        run: ./scripts/ci-nix-build.sh "$ATTR" "$RUNNER_TEMP/out-paths"

      - name: Push to the cache
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          "$NIX_CI_PUSH" "${paths[@]}"

  checks:
    name: Nix / ${{ matrix.name }}
    needs: [plan, inputs]
    # Runs when the inputs wave was skipped (no shared inputs) or failed: a
    # check whose input failed fails on its own, with its own log.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.checks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          pin: master-${{ matrix.name }}

      # player-e2e is a NixOS VM test that blocks (Test / Player E2E is
      # required), so it builds here rather than in the nixos job below.
      - name: Enable KVM access
        if: matrix.name == 'player-e2e'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        env:
          ATTR: ${{ matrix.attr }}
        run: ./scripts/ci-nix-build.sh "$ATTR" "$RUNNER_TEMP/out-paths"

      - name: Push to the cache
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          "$NIX_CI_PUSH" "${paths[@]}"

  # The NixOS module VM tests (nixos-module, nixos-module-postgres): same
  # build and push as `checks`, but outside the Nix / Checks verdict, so they
  # block nothing. The package they boot takes the whole repo as its source
  # (src = ../..), so they rerun on nearly every commit, and a QEMU boot on a
  # shared runner is the slowest and flakiest build in the set. That made them
  # cost ~28 runner-minutes on every PR, a docs-only one included, so on
  # pull_request they run only for Dependabot's PRs: the Dependabot gate
  # merges with GITHUB_TOKEN, which starts no master run, so the PR run is
  # the only one a dependency bump gets, and the gate requires it to pass.
  # Otherwise they run on master pushes and manual dispatches. For pre-merge
  # results on a .nix, flake.lock or packaging change, dispatch this workflow
  # on the branch: gh workflow run ci.yml --ref <branch>. Master pins include
  # them.
  nixos:
    name: Nix / NixOS (${{ matrix.name }})
    needs: [plan, inputs]
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]')
      && needs.plan.result == 'success'
      && needs.plan.outputs.nixos != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.nixos) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          pin: master-${{ matrix.name }}

      # The NixOS module tests boot a QEMU VM.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        env:
          ATTR: ${{ matrix.attr }}
        run: ./scripts/ci-nix-build.sh "$ATTR" "$RUNNER_TEMP/out-paths"

      - name: Push to the cache
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          "$NIX_CI_PUSH" "${paths[@]}"

  nix-result:
    name: Nix / Checks
    needs: [plan, inputs, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped build job means an empty matrix (everything was cached) or,
      # for inputs, a run that cannot push. Pins and the NixOS VM tests are
      # not part of the verdict.
      - name: Assert every planned build succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          INPUTS: ${{ needs.inputs.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "plan=$PLAN inputs=$INPUTS checks=$CHECKS"
          if [ "$PLAN" != success ]; then
            echo "::error::Nix / Plan did not succeed ($PLAN)"
            exit 1
          fi
          for result in "$INPUTS" "$CHECKS"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a Nix build job ended $result"
                exit 1
                ;;
            esac
          done

  # niks3 keeps unpinned paths for 14 days. PR runs push everything before it
  # merges, so master's own run usually plans nothing and its build jobs never
  # pass a pin; this job pins every check and ciInternal output as
  # master-<name> regardless, from the cache. Upkeep, not a verdict: it only
  # warns, never fails the run, and the aggregators ignore it.
  pins:
    name: Nix / Pins
    needs: [plan, inputs, checks, nixos]
    if: always() && needs.plan.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci

      - name: Refresh the master pins
        env:
          ALL: ${{ needs.plan.outputs.all }}
        run: |
          printf '%s' "$ALL" > "$RUNNER_TEMP/all.json"
          ./scripts/ci-nix-pin.sh "$RUNNER_TEMP/all.json"

  # Blocks new complexity, nesting and module-size debt relative to the merge
  # base (see "Ratchets" in CONTRIBUTING.md). It reads git history, so it is
  # a job rather than a check, but it does not compile the app: it lays the
  # cached test build over the checkout (scripts/ci-restore-test-build.sh,
  # which needs the checkout at /build/source), and Mix recompiles only a
  # handful of files (about 14). It waits for the inputs wave,
  # which builds and pushes that test build when the run changed it.
  ratchet:
    name: Lint / Ratchet
    needs: [plan, inputs]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mix mydia.ratchet compares against the merge base with origin/master.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          push: 'false'
          free-disk: 'false'

      # Bind-mounts the checkout at /build/source; later steps run there.
      - name: Restore the cached test build
        run: scripts/ci-restore-test-build.sh --mount

      - name: Ratchet
        working-directory: /build/source
        run: nix develop .#ci -c mix mydia.ratchet --from-git-merge-base origin/master

      # Advisory dead-code report (non-blocking; see CONTRIBUTING.md "Quality
      # gates"). It recompiles every file a second time for output nothing is
      # gated on (.github/ci.md: mix_unused is advisory by design and must
      # not be promoted to blocking), so pull requests skip it and master
      # pushes still produce the report.
      - name: Unused-code report (advisory)
        if: github.event_name == 'push'
        working-directory: /build/source
        run: nix develop .#ci -c env UNUSED_CHECK=true mix compile --force || true

  # mydia_smb's Samba integration tests need a root smbd, which the Nix
  # sandbox cannot provide: rust-mydia_smb-test runs the crate's tests with
  # the integration tests skipped, and this job runs them all against a real
  # Samba. MYDIA_SMB_REQUIRE_HARNESS=1 turns a harness that failed to start
  # into a failure rather than a skip.
  smb:
    name: Rust / SMB integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          push: 'false'
          free-disk: 'false'

      - name: SMB tests
        env:
          MYDIA_SMB_REQUIRE_HARNESS: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y samba
          exports="$(player/rust/mydia_smb/tests/samba/run-samba.sh)"
          eval "$exports"
          test -n "${MYDIA_SMB_TEST_HOST:-}"
          nix develop .#ci -c cargo test --features test-introspection --manifest-path player/rust/mydia_smb/Cargo.toml

  # The release APK, on every run. It cannot be a derivation: Gradle has no
  # dependency lockfile for nixpkgs' mitmCache to fetch from, and Flutter's
  # Android engine artifacts in the sandbox are unproven (design/specs/
  # 2026-11-21-nix-ci-phase-2-design.md, "Android"). The toolchain is the
  # .#android dev shell `./dev player android build` uses (Flutter from
  # player/.fvmrc, the Android SDK and NDK, JDK 17, Rust with the Android
  # targets), substituted from the caches. No pub or Gradle cache: both fetch
  # on each run. It needs no niks3 push: a dev shell is not a check output.
  #
  # The Build APK step drives cargokit, which cross-compiles
  # player/rust/mydia_player_p2p (and native/mydia_p2p_core under it) against
  # the NDK, so this is what keeps the Rust/Dart FFI boundary under PR
  # coverage on Android. `flutter pub run`, not `dart run`: a bare `dart run`
  # re-checks the resolution without Flutter's SDK and fails.
  build-android:
    name: Build / Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keeps free-disk: the Android SDK and NDK closure is several GB.
      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          push: 'false'

      # --enforce-lockfile fails the job when pubspec.lock does not resolve on
      # the .fvmrc SDK, instead of quietly testing a re-resolved tree.
      # The APK build never regenerates the Rust/Dart bindings, so the dev
      # shell's flutter_rust_bridge_codegen install is skipped.
      - name: Build APK
        env:
          MYDIA_SKIP_FRB_CODEGEN_INSTALL: "1"
        run: |
          nix develop .#android --command bash -c '
            set -euo pipefail
            cd player
            flutter pub get --enforce-lockfile
            flutter pub run build_runner build
            flutter build apk --release --target-platform android-arm,android-arm64
          '

      - name: Check APK ABIs
        run: ./scripts/check-apk-abis.sh player/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mydia-player-android-apk
          path: player/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Required contexts live on these aggregators: each always runs and
  # concludes success or failure, never `skipped` (whether the ruleset counts
  # `skipped` as passing is configuration-dependent, .github/ci-flakes.md).
  # Each accepts `success` or `skipped` from what it needs. `Guards`
  # enforces the always() condition. All of them gate on the whole Nix matrix
  # through Nix / Checks (Test / E2E Browser for the e2e-browser check, Test /
  # Player for player-test, player-test-web, player-analyze and
  # player-l10n-test, Test / Player E2E for the player-e2e VM test, Build /
  # Web for player-web, Build / Linux for player-linux, Check / Web icons for
  # player-icons): a matrix leg's result is not addressable through `needs`.
  test:
    name: Test
    needs: [guards, nix-result, ratchet, smb]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  test-postgres-result:
    name: Test / PostgreSQL
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  test-e2e-result:
    name: Test / E2E Browser
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  test-player-result:
    name: Test / Player
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  test-player-e2e-result:
    name: Test / Player E2E
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  build-web-result:
    name: Build / Web
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  # No artifact: the Nix bundle's runpath points into /nix/store, so it runs
  # nowhere else. Release bundles come from player-linux.yml.
  build-linux-result:
    name: Build / Linux
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null

  icons-result:
    name: Check / Web icons
    needs: [nix-result]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
