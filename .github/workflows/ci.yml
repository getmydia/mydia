name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  # Harden Rust crate fetches against transient crates.io flakiness. The Rustler
  # NIF (native/mydia_p2p) is built during `mix compile`; CI intermittently hit
  # "download of … failed / curl failed / [16] Error in the HTTP2 framing layer".
  # Forcing HTTP/1.1 (no multiplexing) sidesteps that libcurl HTTP/2 bug and a
  # generous retry count rides out brief network blips. Inherited into the
  # `devenv shell` subshells below (cargo reads these from the environment).
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

# The three Elixir jobs below run their steps inside a single `devenv shell --
# bash` heredoc so the environment evaluates once and `_build` stays warm across
# steps (mirrors `./dev mix precommit`, dev:159-211). The toolchain (Elixir, OTP,
# Rust + wasm32-wasip2, Node, ffmpeg, chromium/chromedriver) comes from
# devenv.nix. GitHub sets CI=true, which makes devenv.nix skip its enterShell
# setup tasks (KTD7) — each job runs the equivalent setup (hex/rebar/deps/ecto)
# explicitly. The Nix/Cachix/devenv setup steps are duplicated across the three
# jobs; a composite action (U2) is a deferred DRY follow-up.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Reads devenv's public cache (pre-built common packages, no auth) plus the
      # project cache; pushes the project's own derivations only on same-repo
      # events, so fork PRs never receive or use the token (KTD1).
      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: mydia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Pin the devenv CLI to the SAME nixpkgs the repo locks (KTD6); rev mirrors
      # devenv.lock's nixpkgs node — bump both together.
      - name: Install devenv
        run: nix profile install github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#devenv

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-devenv-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-devenv-

      - name: Cache build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _build
          key: ${{ runner.os }}-build-devenv-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'test/**/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-devenv-${{ hashFiles('**/mix.lock') }}-

      # Materialize the devenv toolchain with a retry BEFORE the test step. Nix
      # evaluation can transiently fail with "path '…/test-timeout.patch' is not
      # valid" when a substituted nixpkgs source (e.g. ffmpeg's libopus) lands
      # incompletely from the binary cache. Isolating the env build here means a
      # single flaky substitution is retried cheaply, and the real test step runs
      # against an already-warm store without retries masking genuine failures.
      - name: Warm devenv environment
        run: |
          for attempt in 1 2 3; do
            if devenv shell -- true; then exit 0; fi
            echo "::warning::devenv shell attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::devenv environment failed to materialize after 3 attempts"
          exit 1

      # Guard the single source: the Rust version lives in rust-toolchain.toml
      # alone. Each pattern matches one mechanism that used to hold a hand-copied
      # pin. Keep them narrow; these files are full of unrelated Elixir, NDK and
      # build-tools versions. See issue #252.
      - name: Guard the Rust toolchain pin
        run: |
          set -euo pipefail
          FAIL=0
          if grep -nE -- '--default-toolchain[[:space:]]+[0-9]' Dockerfile; then
            echo "::error::Dockerfile pins a Rust version; it must come from rust-toolchain.toml"
            FAIL=1
          fi
          # Matches a quoted literal (rust-bin.stable."1.96.0") but not an
          # interpolated channel (rust-bin.stable.${rustChannel}), which is how
          # the Android shell reads the pin.
          if grep -nE 'rust-bin\.[a-z]+\."' nix/devShells/flake-module.nix; then
            echo "::error::the Android shell names a Rust version; read it from rust-toolchain.toml"
            FAIL=1
          fi
          if grep -nE '^[[:space:]]*version[[:space:]]*=[[:space:]]*"[0-9]' devenv.nix; then
            echo "::error::devenv.nix names a version literal; read it from rust-toolchain.toml"
            FAIL=1
          fi
          # The Flatpak build installs rustup with --default-toolchain none and
          # lets it resolve rust-toolchain.toml, so nothing under player/flatpak
          # may name a channel.
          if grep -rnE -- '--default-toolchain[[:space:]]+[0-9]|^[[:space:]]*channel[[:space:]]*=' player/flatpak/; then
            echo "::error::player/flatpak pins a Rust version; rustup resolves rust-toolchain.toml on its own"
            FAIL=1
          fi
          exit "$FAIL"

      # This task runs from devenv's mydia:ecto against a database that may have
      # no tables yet. Booting the supervision tree there is fatal, because
      # ClientHealth.init/1 queries download_client_configs synchronously, and
      # the failure leaves fresh worktrees unmigrated forever rather than
      # retrying. It needs the repo and nothing else.
      # Both guards below strip full-line comments before matching. Matching the
      # raw source has already caused two defects during this branch's
      # implementation: a guard regex that matched the explanatory comment
      # sitting next to the code it described, and a guard search string that
      # appeared verbatim in a comment inside the block it scans. Both would
      # have made CI permanently red, and the workaround each time — contorting
      # the prose to dodge the guard — is backwards, and narrowing a guard's
      # regex to avoid a comment also opens an evasion gap in the code match.
      - name: Guard the pre-migration backup task
        run: |
          set -euo pipefail
          if grep -vE '^[[:space:]]*#' lib/mix/tasks/mydia.backup_before_migrate.ex | grep -nE 'app\.start'; then
            echo "::error::mydia.backup_before_migrate must not start the application; use Ecto.Migrator.with_repo/2"
            exit 1
          fi

      # Shell entry must not boot the app or start a service. mydia:ecto does
      # both: it runs the backup task and, under Postgres, needs a live server.
      # Attaching it to enterShell is what made every fresh worktree fail on
      # entry and what spawned a second postmaster beside `./dev up -d`. It
      # belongs to processes.phoenix.after and `./dev db.setup` — and nothing
      # else stops someone deleting that `after`, which would silently restore
      # the original crash (phoenix booting against an unmigrated database)
      # with CI green, so the positive invariant is guarded too.
      - name: Guard shell-entry purity
        run: |
          set -euo pipefail
          BLOCK=$(awk '/"mydia:ecto" = \{/,/^    \};/' devenv.nix | grep -vE '^[[:space:]]*#')
          [ -n "$BLOCK" ] || { echo "::error::guard could not locate the mydia:ecto block in devenv.nix"; exit 1; }
          if echo "$BLOCK" | grep -n 'before = onEnterShell'; then
            echo "::error::mydia:ecto must not run on shell entry; it belongs to processes.phoenix.after"
            exit 1
          fi
          if echo "$BLOCK" | grep -n 'devenv:processes:postgres'; then
            echo "::error::mydia:ecto must not depend on the postgres process; a task dependency starts a second postmaster"
            exit 1
          fi
          grep -q 'processes\.phoenix\.after = \[ "mydia:ecto@succeeded" \]' devenv.nix || {
            echo "::error::phoenix must wait for mydia:ecto@succeeded, or it boots against an unmigrated database"; exit 1; }

      - name: Test (SQLite) under devenv
        run: |
          devenv shell -- bash <<'DEVENV'
          set -euo pipefail
          export MIX_ENV=test
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get
          mix deps.unlock --check-unused
          mix compile --warnings-as-errors
          mix format --check-formatted
          # Guard against re-grandfathering: a Credo check must be enabled-and-
          # gating or `false`, never `exit_status: 0`. See CONTRIBUTING.md.
          if grep -n "exit_status: 0" .credo.exs; then
            echo "::error::exit_status: 0 found in .credo.exs - fix the finding or disable the check with false (see CONTRIBUTING.md)"
            exit 1
          fi
          # Guard against DEPRECATED markers surviving in lib/: deprecated
          # code must be deleted, not left behind under a marker. See
          # CONTRIBUTING.md.
          if grep -rn "DEPRECATED" lib --include='*.ex' --include='*.heex'; then
            echo "::error::DEPRECATED: is not allowed in lib/. Delete the code, or mark it COMPAT: if it is load-bearing backward compatibility. See CONTRIBUTING.md."
            exit 1
          fi
          mix credo --strict
          # Advisory dead-code report (non-blocking; see CONTRIBUTING.md "Quality gates").
          UNUSED_CHECK=true mix compile --force || true
          mix ecto.create
          mix ecto.migrate
          mix test --cover
          DEVENV

  test-postgres:
    name: Test / PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: mydia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install devenv
        run: nix profile install github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#devenv

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-devenv-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-devenv-

      - name: Cache build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _build
          key: ${{ runner.os }}-build-devenv-postgres-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'test/**/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-devenv-postgres-${{ hashFiles('**/mix.lock') }}-

      # See the `test` job for why the environment is warmed (with retry) before
      # the test step — guards against transient Nix substitution failures.
      - name: Warm devenv environment
        run: |
          for attempt in 1 2 3; do
            if devenv shell -- true; then exit 0; fi
            echo "::warning::devenv shell attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::devenv environment failed to materialize after 3 attempts"
          exit 1

      # DATABASE_* is exported INSIDE the shell so it overrides devenv.nix's
      # per-worktree defaults (DATABASE_HOST/PORT/USER) and points at the GitHub
      # `services: postgres` container. DATABASE_TYPE is set here (not at job/eval
      # level) so the compile-time adapter is Postgres without devenv defining an
      # unused devenv-managed Postgres service at eval time (KTD4).
      - name: Test (PostgreSQL) under devenv
        run: |
          devenv shell -- bash <<'DEVENV'
          set -euo pipefail
          export MIX_ENV=test
          export DATABASE_TYPE=postgres
          export DATABASE_HOST=localhost
          export DATABASE_PORT=5432
          export DATABASE_USER=postgres
          export DATABASE_PASSWORD=postgres
          export DATABASE_NAME=mydia_test
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get
          mix compile
          mix ecto.create
          mix ecto.migrate
          mix ecto.migrations
          mix test --cover
          DEVENV

  test-player:
    name: Test / Player
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: player

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build

      - name: Run tests
        # --concurrency=1: the default concurrency silently drops 2-4 test
        # files while still exiting 0, so this is load-bearing, not cosmetic.
        run: flutter test --concurrency=1

  test-e2e:
    name: Test / E2E Browser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: mydia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install devenv
        run: nix profile install github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#devenv

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-devenv-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-devenv-

      - name: Cache build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _build
          key: ${{ runner.os }}-build-devenv-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'test/**/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-devenv-${{ hashFiles('**/mix.lock') }}-

      # See the `test` job for why the environment is warmed (with retry) before
      # the test step — guards against transient Nix substitution failures (this
      # job hit the libopus "path is not valid" flake most often).
      - name: Warm devenv environment
        run: |
          for attempt in 1 2 3; do
            if devenv shell -- true; then exit 0; fi
            echo "::warning::devenv shell attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::devenv environment failed to materialize after 3 attempts"
          exit 1

      # chromium + chromedriver come from devenv (devenv.nix sets CHROME_PATH /
      # CHROMEDRIVER_PATH); run-feature-tests.sh finds chromium on PATH and honors
      # CHROMEDRIVER_PATH, so no separate Chrome action is needed.
      - name: Feature tests (E2E) under devenv
        run: |
          devenv shell -- bash <<'DEVENV'
          set -euo pipefail
          export MIX_ENV=test
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get
          mix compile
          npm ci --prefix assets
          mix assets.deploy
          ./scripts/run-feature-tests.sh
          DEVENV

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallaby-screenshots
          path: tmp/wallaby_screenshots/
          retention-days: 7
