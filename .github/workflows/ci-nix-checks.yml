name: CI / Nix Checks

# The flake checks (nix/ci/) built as derivations and cached in niks3
# (cache.mydia.dev). Runs alongside ci.yml's jobs, which stay required until
# the cutover; design/specs/2026-11-20-nix-ci-checks-design.md.
#
#   plan    nix-eval-jobs --check-cache-status: which checks the cache lacks
#   inputs  ciInternal derivations two or more of those checks need, built once
#   checks  one job per uncached check; inputs come from the cache by now
#   Nix / Checks  the aggregator
#   pins    master only: refresh the master-<name> pin of every output
#
# A run where nothing changed what the checks read plans two empty matrices,
# skips both build jobs and finishes in the time it takes to evaluate.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# id-token: write (the niks3 OIDC token) is granted per job, only to the jobs
# that push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Nix / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      inputs: ${{ steps.plan.outputs.inputs }}
      checks: ${{ steps.plan.outputs.checks }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Evaluation only: no disk to free, nothing to push.
      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          push: 'false'
          free-disk: 'false'

      # From the flake's own nixpkgs pin, so the planner moves with flake.lock.
      - name: Install nix-eval-jobs
        run: |
          out="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#nix-eval-jobs)"
          echo "$out/bin" >> "$GITHUB_PATH"

      - name: Plan
        id: plan
        env:
          CI_PLAN_WORKERS: '4'
        run: |
          plan="$RUNNER_TEMP/plan.json"
          scripts/ci-plan.sh > "$plan"
          {
            echo "inputs=$(jq -c .inputs "$plan")"
            echo "checks=$(jq -c .checks "$plan")"
            echo "all=$(jq -c .all "$plan")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Nix plan"
            echo
            echo "$(jq '.inputs | length' "$plan") inputs and $(jq '.checks | length' "$plan") checks to build; everything else is cached."
            echo
            jq -r '
              (.inputs | map("- input `\(.name)`")),
              (.checks | map("- `\(.name)` (\(.group))"))
              | .[]' "$plan"
          } >> "$GITHUB_STEP_SUMMARY"
          jq 'del(.all)' "$plan"

  # Skipped when the job could not push (a fork PR or Dependabot gets no OIDC
  # token): building inputs nobody can fetch only duplicates what each check
  # job then builds for itself.
  inputs:
    name: Nix / Input (${{ matrix.name }})
    needs: plan
    if: >-
      needs.plan.outputs.inputs != '[]'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.inputs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The action drops the pin on every ref but master.
      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          pin: master-${{ matrix.name }}

      - name: Build
        env:
          ATTR: ${{ matrix.attr }}
        run: ./scripts/ci-nix-build.sh "$ATTR" "$RUNNER_TEMP/out-paths"

      - name: Push to the cache
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          "$NIX_CI_PUSH" "${paths[@]}"

  checks:
    name: Nix / ${{ matrix.name }}
    needs: [plan, inputs]
    # Runs when the inputs wave was skipped (no shared inputs) or failed: a
    # check whose input failed fails on its own, with its own log.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.checks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci
        with:
          pin: master-${{ matrix.name }}

      # The NixOS module tests boot a QEMU VM.
      - name: Enable KVM access
        if: matrix.group == 'nixos'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        env:
          ATTR: ${{ matrix.attr }}
        run: ./scripts/ci-nix-build.sh "$ATTR" "$RUNNER_TEMP/out-paths"

      - name: Push to the cache
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          "$NIX_CI_PUSH" "${paths[@]}"

  nix-result:
    name: Nix / Checks
    needs: [plan, inputs, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped build job means an empty matrix (everything was cached) or,
      # for inputs, a run that cannot push. Pins are not part of the verdict.
      - name: Assert every planned build succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          INPUTS: ${{ needs.inputs.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "plan=$PLAN inputs=$INPUTS checks=$CHECKS"
          if [ "$PLAN" != success ]; then
            echo "::error::Nix / Plan did not succeed ($PLAN)"
            exit 1
          fi
          for result in "$INPUTS" "$CHECKS"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a Nix build job ended $result"
                exit 1
                ;;
            esac
          done

  # niks3 keeps unpinned paths for 14 days. PR runs push everything before it
  # merges, so master's own run usually plans nothing and its build jobs never
  # pass a pin; this job pins every check and ciInternal output as
  # master-<name> regardless, from the cache. Upkeep, not a verdict: it only
  # warns, never fails the run, and the aggregator ignores it.
  pins:
    name: Nix / Pins
    needs: [plan, inputs, checks]
    if: always() && needs.plan.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-ci

      - name: Refresh the master pins
        env:
          ALL: ${{ needs.plan.outputs.all }}
        run: |
          printf '%s' "$ALL" > "$RUNNER_TEMP/all.json"
          ./scripts/ci-nix-pin.sh "$RUNNER_TEMP/all.json"
