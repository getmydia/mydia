name: CI / Appcast

# The appcast generator is a small Node package with no dependency on the rest
# of the tree, so it gets its own workflow rather than a job inside ci.yml,
# matching how site/, player/ and relay/ are split.
#
# Test / Appcast is not a required check, so a path filter is safe: a run the
# filter skips reports nothing and blocks nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/appcast/**'
      - 'scripts/dev-builds/**'
      - '.github/workflows/ci-appcast.yml'
  workflow_dispatch:

concurrency:
  group: "ci-appcast-${{ github.ref }}"
  cancel-in-progress: true

# The job only reads the checked-out tree; nothing here writes.
permissions:
  contents: read

jobs:
  test:
    name: Test / Appcast
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scripts/appcast

    steps:
      # npm ci runs whatever install scripts the pull request's lockfile names,
      # so the job must not leave the token in .git/config where that code can
      # read it. Nothing here needs git credentials.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/appcast/package-lock.json

      # The dev build index publisher feeds this generator, so its contract
      # test runs here, against an rclone local-filesystem bucket.
      - name: Test the dev build index publisher
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          ../dev-builds/publish-test.sh

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
