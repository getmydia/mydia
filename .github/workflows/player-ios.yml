name: Player / iOS

# The iOS build, extracted from release.yml so player-ios-refresh.yml can run
# exactly the same one. release.yml calls it on every release; the refresh cron
# calls it when a stable build is approaching TestFlight's 90-day expiry.
#
# PLAYER_PATH is declared on the job below rather than inherited. A caller's
# workflow-level `env` is NOT propagated into a called workflow, and `env:` is
# not permitted alongside `uses:`, so leaning on release.yml's copy resolves
# every path to `/ios` and fails immediately.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build. Every release job checks out the same one.
        type: string
        required: true
      version:
        description: Version with the leading `v` already stripped. A prerelease suffix is removed below.
        type: string
        required: true
      version_code:
        description: >-
          CFBundleVersion. App Store Connect rejects one that is not above every
          earlier upload. Ignored when build_number_mode is after_latest and the
          App Store Connect credentials are present.
        type: string
        required: true
      build_number_mode:
        description: >-
          `fixed` uploads version_code. `after_latest` numbers the build just
          above the highest upload (17000042 becomes 17000042.1), resolved after
          this job holds the TestFlight lock. player-ondemand.yml uses it for
          branch builds, so they never take a number from master's sequence.
          `fixed_or_after_latest` uploads version_code when it clears the
          highest upload and otherwise goes just above it, as after_latest
          does. player-ondemand.yml uses it for master builds, whose
          version_code falls behind a draft release's upload until the
          release is published and tagged.
        type: string
        required: false
        default: fixed
      groups:
        description: >-
          Comma-separated App Store Connect external group names, matched
          exactly. "Beta,Pre-release" for a stable release, "Pre-release" for a
          prerelease.
        type: string
        required: true
      notes:
        description: TestFlight "What to Test". At most 4000 characters, never empty.
        type: string
        required: true
      dry_run:
        description: >-
          Build and sign without uploading. MUST stay `boolean`: as a string,
          "false" is truthy and the dry-run condition inverts.
        type: boolean
        required: false
        default: false
      distribute_external:
        description: >-
          Distribute to external TestFlight groups. When false, uploads for
          internal testers only and skips waiting for Apple Beta App Review.
        type: boolean
        required: false
        default: true
    # Named one by one rather than left to `secrets: inherit` at the call site,
    # for the reason already written down in deploy-web-player.yml: inherit
    # would hand an iOS workflow the Android keystore, the Flatpak GPG key and
    # the R2 credentials. These same names resolve to the repository secrets on
    # a bare dispatch, so the steps below read `secrets.*` either way.
    #
    # The signing secrets are optional because the unsigned path below is what
    # runs when they are absent.
    secrets:
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_CONTENT:
        required: false
    outputs:
      uploaded:
        description: >-
          "true" only when a build actually reached TestFlight. Empty on a dry
          run, and empty when the App Store Connect credentials are absent,
          because the upload steps below skip on either and the job still
          succeeds. A caller that records the upload as having happened must
          gate on this rather than on the job's own success.
        value: ${{ jobs.build.outputs.uploaded }}
      build_number:
        description: The CFBundleVersion this run stamped.
        value: ${{ jobs.build.outputs.build_number }}

permissions:
  contents: read

jobs:
  build:
    name: Build and upload
    # From April 2027 App Store Connect refuses iOS uploads built with an SDK
    # older than iOS 27 (ITMS-90725, first warned on 0.19.0). Every Xcode on the
    # macos-26 image is 26.x, so the build needs the xcode-27 image, whose
    # default Xcode is always a 27.x. "Check / iOS SDK" below enforces it.
    runs-on: xcode-27
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      build_number: ${{ steps.build_number.outputs.value }}
    # Serialises the iOS build so a release and a refresh never upload at once.
    #
    # This prevents overlap, not staleness. A refresh queued behind a release
    # still uploads the version it resolved before it queued, so a slightly
    # older build can briefly become the newest one in App Store Connect. That
    # window needs a release dispatched during the refresh's queue wait, and the
    # next release corrects it, so the version is deliberately not re-resolved
    # after the lock is acquired.
    #
    # The exception is build_number_mode: after_latest (and
    # fixed_or_after_latest), which must read the highest upload under this
    # lock: read before it, a concurrent upload could take the number first.
    concurrency:
      group: player-ios-testflight
      cancel-in-progress: false
    # `upload_to_testflight` uses `distribute_external: true`, which cannot skip
    # waiting for Apple to finish processing the build, so a slow processing
    # queue parks this job in a poll loop with no upper bound of its own. On
    # v0.13.0 that ran 5h49m before the 6h default killed it, on a runner billed
    # at 10x. The job normally finishes in 17-20 minutes; this bounds the wait
    # while leaving generous headroom. Hitting it fails the publish gate, which
    # is the correct outcome: re-dispatch with `allow_missing=ios` to ship
    # without it, since the IPA reaches TestFlight whenever Apple is done
    # regardless of what this job reports.
    timeout-minutes: 45
    env:
      PLAYER_PATH: 'player'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The prep action comes from this workflow's own commit, not from
      # inputs.sha: player-ios-refresh rebuilds an old release tag and
      # player-ondemand can build an old branch, neither of which has it.
      - name: Checkout CI actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      # Fails in seconds, before a 20-minute build, if the runner image ever
      # hands us an SDK that App Store Connect will refuse to accept.
      - name: Check / iOS SDK
        env:
          MIN_SDK_MAJOR: '27'
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          if [ "${sdk%%.*}" -lt "$MIN_SDK_MAJOR" ]; then
            echo "::error::iOS SDK $sdk is older than $MIN_SDK_MAJOR; App Store Connect rejects it (ITMS-90725)." >&2
            exit 1
          fi

      # Before the version stamp, because after_latest and
      # fixed_or_after_latest need fastlane to read App Store Connect.
      # Otherwise only the upload needs it.
      - name: Setup Ruby for Fastlane
        if: ${{ env.APP_STORE_CONNECT_API_KEY_ID != '' && (!inputs.dry_run || inputs.build_number_mode != 'fixed') }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ env.PLAYER_PATH }}/ios

      # A failed lookup fails the job: a guessed number risks exactly the
      # collision after_latest exists to avoid. Without credentials nothing
      # uploads either (the upload step below skips too), so version_code is
      # stamped as before.
      - name: Resolve build number
        id: build_number
        env:
          MODE: ${{ inputs.build_number_mode }}
          VERSION_CODE: ${{ inputs.version_code }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          HIGHEST_BUILD_NUMBER_PATH: ${{ runner.temp }}/highest-build-number.txt
        run: |
          set -euo pipefail
          case "$MODE" in
            fixed)
              BUILD_NUMBER="$VERSION_CODE"
              ;;
            after_latest|fixed_or_after_latest)
              if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
                echo "::warning::No App Store Connect credentials; stamping version_code $VERSION_CODE. Nothing will upload."
                BUILD_NUMBER="$VERSION_CODE"
              else
                (cd "$PLAYER_PATH/ios" && bundle exec fastlane highest_build_number)
                HIGHEST=$(cat "$HIGHEST_BUILD_NUMBER_PATH")
                if [ "$MODE" = "fixed_or_after_latest" ]; then
                  BUILD_NUMBER=$(./scripts/branch-build-number.sh "$HIGHEST" "$VERSION_CODE")
                  if [ "$BUILD_NUMBER" != "$VERSION_CODE" ]; then
                    echo "::warning::version_code $VERSION_CODE does not clear the highest TestFlight upload $HIGHEST (a draft release?); uploading as $BUILD_NUMBER."
                  fi
                else
                  BUILD_NUMBER=$(./scripts/branch-build-number.sh "$HIGHEST")
                fi
                echo "Highest upload $HIGHEST, this build $BUILD_NUMBER"
              fi
              ;;
            *)
              echo "::error::Unknown build_number_mode '$MODE'; expected fixed, after_latest or fixed_or_after_latest."
              exit 1
              ;;
          esac
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "- **iOS build number:** \`$BUILD_NUMBER\` ($MODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update version
        working-directory: ${{ env.PLAYER_PATH }}
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          # Apple's CFBundleShortVersionString must be at most three
          # period-separated integers, so strip any prerelease suffix
          # (e.g. 0.12.0-beta.2 -> 0.12.0). The unique build number is
          # carried by BUILD_NUMBER (CFBundleVersion). Flutter keeps a dotted
          # one (17000042.1) intact for iOS: it strips only characters other
          # than digits and periods.
          MARKETING_VERSION="${VERSION%%-*}"
          sed -i '' "s/^version: .*/version: ${MARKETING_VERSION}+${BUILD_NUMBER}/" pubspec.yaml

      # The version is stamped above, so the prep leaves pubspec.yaml alone.
      - name: Flutter prep
        uses: ./.ci-actions/.github/actions/player-flutter-prep
        with:
          version: ${{ inputs.version }}

      - name: Install certificate and provisioning profile
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Configure manual signing for CI
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}/ios
        run: |
          # Extract provisioning profile name
          PP_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/pp.plist
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/pp.plist)
          echo "Using provisioning profile: $PP_NAME"

          # Remove CODE_SIGN_STYLE from project so xcconfig takes over
          sed -i '' '/CODE_SIGN_STYLE = Automatic;/d' Runner.xcodeproj/project.pbxproj

          # Inject signing overrides into Release.xcconfig
          cat >> Flutter/Release.xcconfig << EOF
          // CI Signing Overrides
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$PP_NAME
          EOF

      - name: Build iOS (unsigned)
        if: env.IOS_CERTIFICATE_BASE64 == ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ios --release --no-codesign --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      - name: Build iOS (signed)
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ios --release --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      # The notes reach the shell through env, never through ${{ }} substitution
      # into this body: changelog text contains backticks and $, which would be
      # both an injection risk and a corruption bug.
      - name: Write TestFlight notes
        if: ${{ !inputs.dry_run && env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTES: ${{ inputs.notes }}
        run: printf '%s' "$NOTES" > "$RUNNER_TEMP/testflight-notes.txt"

      # `uploaded` is written only after fastlane returns successfully, and the
      # step is skipped entirely when this condition is false, so an empty value
      # means "no build reached TestFlight" for either reason. player-ios-refresh
      # gates its marker tag on it.
      - name: Upload to TestFlight
        id: upload
        if: ${{ !inputs.dry_run && env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          TESTFLIGHT_CHANGELOG_PATH: ${{ runner.temp }}/testflight-notes.txt
          # Group names, matched exactly by App Store Connect.
          TESTFLIGHT_GROUPS: ${{ inputs.groups }}
          TESTFLIGHT_DISTRIBUTE_EXTERNAL: ${{ inputs.distribute_external }}
        working-directory: ${{ env.PLAYER_PATH }}/ios
        run: |
          bundle exec fastlane testflight
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
