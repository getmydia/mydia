name: Dependabot auto-merge

# workflow_run rather than check_suite, and neither of them pull_request_target.
#
# GitHub's native auto-merge (`gh pr merge --auto`, which this file used to
# call) waits on REQUIRED checks only, and there is no flag to widen it. The
# Master ruleset requires six of roughly twenty-six contexts, so on 2026-08-29
# PR #613 auto-merged with seven red checks and broke the master Docker image.
# This workflow waits on the whole rollup instead.
#
# check_suite was the natural event and was tried first, in the revision this
# one replaces. It fires here, but not usefully, and the distinction is worth
# recording because the docs invite the wrong conclusion in both directions.
#
# GitHub says the event "does not trigger workflows if the check suite was
# created by GitHub Actions or if the check suite's head SHA is associated with
# GitHub Actions." Read literally that suggests it never fires on this
# repository. It does: runs on this workflow with event `check_suite` are in the
# history for 2026-08-30, and they executed the gate correctly. The restriction
# evidently applies per check suite, so suites from other apps still trigger it.
#
# That is precisely the problem. The suites that DO fire are the ones Actions did
# not create, and they finish on their own schedule -- CodeRabbit typically well
# before CI does. The gate would evaluate early, log WAIT, and never be woken
# again when the last Actions workflow finally completed. Firing at the wrong
# moment is worse than not firing, because it looks like it is working.
#
# workflow_run fires exactly when a listed workflow completes, so the last one
# to finish sees a terminal rollup. Missing an entry from the list below costs a
# re-evaluation point, not correctness, because the gate always re-reads the
# full rollup rather than trusting the triggering event.
#
# A workflow_run workflow runs in default-branch context, so it does not carry
# the pull_request_target hazard an earlier revision of this file reasoned about.
on:
  workflow_run:
    workflows:
      - CI
      - CI / Appcast
      - CI / Documentation
      - CI / Fastlane
      - CI / Nix
      - CI / Player Desktop
      - CI / Player E2E
      - CI / Relay
      - CI / Security
      - CI / Site
      - CI Server
      # Regenerates derived files on Dependabot branches. Listed so a fixup
      # that fails, which is then the last workflow to finish, still wakes
      # the gate.
      - Dependabot fixup
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # Reads run_attempt for the re-run decision. The re-run itself uses the App
  # token minted below.
  actions: read

jobs:
  gate:
    name: Dependabot merge gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A failed job is re-run once before the pull request is reported as
      # blocked, and the re-run's completion has to fire workflow_run to wake
      # this gate again. Events caused by GITHUB_TOKEN mostly start no
      # workflows, so the re-run goes through a GitHub App token scoped to
      # Actions. continue-on-error: without the App's secrets the gate still
      # works, it just never retries.
      - name: Mint a token for re-runs
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-actions: write

      # Matching open dependabot pull requests on the triggering run's head SHA
      # is unconditional and needs no payload archaeology.
      #
      # Note the author spelling: `gh pr list --author` wants `app/dependabot`,
      # while the webhook payload spells the same account `dependabot[bot]`.
      - name: Decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RERUN_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          prs="$(gh pr list --author 'app/dependabot' --state open \
                   --json number,headRefOid \
                   --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")"

          if [ -z "$prs" ]; then
            echo "No open dependabot pull request at $HEAD_SHA. Nothing to do."
            exit 0
          fi

          marker='<!-- dependabot-gate -->'

          # mergeStateStatus is computed lazily and returns UNKNOWN until GitHub
          # catches up. Poll rather than treating UNKNOWN as an answer either way.
          merge_state() {
            local pr="$1" state i read_status
            for i in 1 2 3 4 5; do
              # bash does not inherit errexit into a command-substitution
              # subshell (that needs `shopt -s inherit_errexit`, unset here),
              # so a failing `gh` call below would not abort this function on
              # its own -- its exit status has to be captured explicitly to
              # tell a failed read apart from a successful one that
              # legitimately returned UNKNOWN. A failed read is retried like
              # any other UNKNOWN; only a successful non-UNKNOWN read returns
              # early.
              read_status=0
              state="$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)" || read_status=$?
              if [ "$read_status" -ne 0 ]; then
                echo "  gh pr view failed while polling mergeStateStatus for PR #$pr (exit $read_status); retrying." >&2
                sleep 5
                continue
              fi
              if [ "$state" != "UNKNOWN" ]; then
                echo "$state"
                return 0
              fi
              sleep 5
            done
            echo UNKNOWN
          }

          # One comment per pull request, edited in place. Appending a new
          # comment on every completed check suite would bury the pull request.
          upsert_comment() {
            local pr="$1" body="$2" id read_status=0
            id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                   --jq "[.[] | select(.body | startswith(\"$marker\"))] | last | .id // empty")" || read_status=$?
            if [ "$read_status" -ne 0 ]; then
              echo "  Could not read existing comments on PR #$pr (exit $read_status); not posting to avoid a duplicate." >&2
              return 1
            fi
            if [ -n "$id" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
                -f body="$body" > /dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
                -f body="$body" > /dev/null
            fi
          }

          # A failed Actions job gets one automatic re-run before the pull
          # request is reported as blocked: .github/ci-flakes.md is long, and
          # one flaky context would otherwise park a dependency PR for good.
          # Succeeds when at least one re-run was requested.
          retry_failed_runs() {
            local pr="$1" runs run attempt status requested=0
            if [ -z "$RERUN_TOKEN" ]; then
              echo "  No App token, so no automatic re-run."
              return 1
            fi
            status=0
            runs="$(./scripts/dependabot-gate.sh reruns --pr "$pr")" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "  Could not list failed runs for PR #$pr (exit $status); not retrying." >&2
              return 1
            fi
            for run in $runs; do
              status=0
              attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .run_attempt)" || status=$?
              if [ "$status" -ne 0 ]; then
                echo "  Could not read run $run (exit $status); skipping it." >&2
                continue
              fi
              if [ "$attempt" -ge 2 ]; then
                echo "  Run $run is already on attempt $attempt; not retrying it."
                continue
              fi
              status=0
              GH_TOKEN="$RERUN_TOKEN" gh run rerun "$run" --failed --repo "$GITHUB_REPOSITORY" || status=$?
              if [ "$status" -ne 0 ]; then
                echo "  gh run rerun $run failed (exit $status)." >&2
                continue
              fi
              echo "  Re-running the failed jobs of run $run."
              requested=$((requested + 1))
            done
            [ "$requested" -gt 0 ]
          }

          for pr in $prs; do
            # A failure evaluating one pull request must not abort the whole
            # step and leave every later pull request in this run unevaluated.
            gate_status=0
            line="$(./scripts/dependabot-gate.sh verdict --pr "$pr")" || gate_status=$?
            if [ "$gate_status" -ne 0 ]; then
              echo "PR #$pr: dependabot-gate.sh failed (exit $gate_status). Skipping this pull request." >&2
              continue
            fi

            verdict="$(printf '%s' "$line" | cut -f1)"
            echo "PR #$pr: $verdict"

            case "$verdict" in
              WAIT)
                echo "  Checks still running. Nothing to do."
                ;;
              BLOCKED)
                if retry_failed_runs "$pr"; then
                  echo "  Retrying once before reporting PR #$pr as blocked."
                  continue
                fi
                contexts="$(printf '%s' "$line" | cut -f2- | tr '\t' '\n' | sed 's/^/- `/; s/=/` — /')"
                if [ -n "$RERUN_TOKEN" ]; then
                  retry_sentence="Failed GitHub Actions jobs are re-run once automatically before this comment is posted, so these failed twice or cannot be re-run. Treat them as a real incompatibility unless you have reason to suspect a flake."
                else
                  retry_sentence="Re-run them if you believe they are flaky, or fix the incompatibility."
                fi
                comment_status=0
                upsert_comment "$pr" "$marker
          This pull request is not being merged automatically. Every check has finished and these did not pass:

          $contexts

          $retry_sentence This comment is rewritten in place as the checks change." || comment_status=$?
                if [ "$comment_status" -ne 0 ]; then
                  echo "  PR #$pr is blocked, but the comment could not be posted (exit $comment_status)." >&2
                else
                  echo "  Blocked. Comment updated."
                fi
                ;;
              MERGE)
                state="$(merge_state "$pr")"
                case "$state" in
                  CLEAN|HAS_HOOKS)
                    # --merge is the only strategy this repository allows: both
                    # allow_squash_merge and allow_rebase_merge are false, and
                    # the other forms fail outright.
                    merge_status=0
                    gh pr merge --merge "$pr" || merge_status=$?
                    if [ "$merge_status" -ne 0 ]; then
                      echo "  gh pr merge failed (exit $merge_status). Leaving PR #$pr open." >&2
                    else
                      echo "  Merged."
                    fi
                    ;;
                  *)
                    echo "  All checks green but mergeStateStatus is $state. Not merging."
                    ;;
                esac
                ;;
              *)
                echo "  Unrecognised verdict '$verdict'. Not merging." >&2
                exit 1
                ;;
            esac
          done
