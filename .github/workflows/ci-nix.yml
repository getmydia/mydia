name: CI / Nix

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build / Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build SQLite package
        run: nix build .#checks.x86_64-linux.package -L

      - name: Build PostgreSQL package
        run: nix build .#checks.x86_64-linux.package-postgres -L

  flutter-pin:
    name: Check / Flutter Pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The nix eval below only proves player/.fvmrc agrees with nixpkgs. It
      # cannot see a stale `flutter-version:` literal re-added to a workflow --
      # the exact regression this pin exists to prevent. So scan every file that
      # can select an SDK (workflows, Dockerfiles, compose files, nix modules,
      # scripts) for a version literal sitting in Flutter context. Dart package
      # manifests are deliberately out of scope: their constraints pin packages,
      # not the SDK this repo builds with. Needs only the checkout, so it runs
      # first and fails in seconds.
      - name: Assert no other build or CI file names a Flutter version
        run: |
          set -euo pipefail
          hits="$(
            git ls-files -z \
                '*.nix' '.github/workflows/*' '*Dockerfile*' '*compose*.yml' \
                'scripts/*' 'dev' \
              | xargs -0 grep -HnIiE 'flutter' \
              | grep -E '[0-9]+\.[0-9]+|[Ff]lutter[0-9]' \
              || true
          )"
          if [ -n "$hits" ]; then
            echo "::error::A Flutter version literal escaped player/.fvmrc"
            echo "$hits"
            echo
            echo "player/.fvmrc is the single source of truth. Read from it instead:"
            echo "  workflows   -> subosito/flutter-action with flutter-version-file"
            echo "  Dockerfiles -> jq -r .flutter player/.fvmrc"
            echo "  nix         -> import player/flutter-version.nix"
            exit 1
          fi
          echo "OK: player/.fvmrc is the only file naming a Flutter version."

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # The assertion lives in player/flutter-version.nix; this step only forces
      # evaluation. It builds nothing -- no SDK, no Android tooling -- so it costs
      # a nixpkgs fetch and nothing more. A mismatch between player/.fvmrc and
      # the flake's nixpkgs fails here with the message that names the fix.
      - name: Assert the Android shell resolves the pinned Flutter
        run: nix eval --raw ./player#packages.x86_64-linux.flutter.version

  test-sqlite-module:
    name: Test / NixOS Module (SQLite)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build NixOS module test
        run: nix build .#checks.x86_64-linux.nixos-module -L

  test-postgres-module:
    name: Test / NixOS Module (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build NixOS module test
        run: nix build .#checks.x86_64-linux.nixos-module-postgres -L
