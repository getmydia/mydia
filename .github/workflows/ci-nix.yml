name: CI / Nix

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs the cheap repo/workflow/release-script contract tests on one runner,
  # keeping the footprint small while still failing fast on contract breaks.
  # The NixOS module VM tests that used to live here are the nixos-module
  # flake checks in ci.yml.
  changes:
    name: Check / Repo Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 because check-ios-refresh-due.sh's commit-log fallback
      # resolves a previous tag and walks a commit range.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The minimum OS version is duplicated across a Podfile, an Xcode project
      # and a podspec on each Apple platform; assert agreement per platform.
      - name: Assert every Apple deployment target agrees
        run: ./scripts/check-apple-deployment-targets.sh

      # TestFlight store release notes ("What to Test", capped at 4000 chars and
      # non-empty) and refresh/build-number derivation scripts exercised before merge.
      - name: Assert the store release notes hold their contract
        run: ./scripts/check-testflight-notes.sh

      - name: Assert the TestFlight refresh decision holds its contract
        run: ./scripts/check-ios-refresh-due.sh

      - name: Check / Build number formula
        run: ./scripts/tests/build-number-test.sh

      - name: Check / On-demand version
        run: ./scripts/tests/ondemand-version-test.sh

      - name: Check / Branch build number
        run: ./scripts/tests/branch-build-number-test.sh

      - name: Assert the iOS fastlane metadata helpers behave
        run: ./scripts/check-ios-fastlane-metadata.sh

      # Pre-commit hook contract tests: scratch-docs and Liquid Glass visual diff gates.
      - name: Assert the scratch-docs guard holds its contract
        run: ./scripts/check-no-scratch-docs-test.sh

      - name: Assert the glass-diff guard holds its contract
        run: ./scripts/check-glass-diff-test.sh

      - name: Assert the Dependabot merge gate against its fixtures
        run: ./scripts/tests/dependabot-gate-test.sh

      - name: Assert the nix-ci niks3 push keeps its contract
        run: ./.github/actions/nix-ci/push.test.sh

      - name: Assert the flake-check planner against its fixtures
        run: ./scripts/tests/ci-plan-test.sh

      - name: Assert the master pin refresh against its stubs
        run: ./scripts/tests/ci-nix-pin-test.sh

  # Combines Flutter pin checks, BEAM pin checks, and generated-artifact
  # freshness onto one Nix/Cachix setup instead of provisioning three separate
  # runners on every PR.
  #
  # Note for editors: this file is in scope for both the Flutter and BEAM pin
  # scans below, so do not write a version literal near those names in comments
  # or code here.
  pins-and-freshness:
    name: Check / Pins & Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert no other build or CI file names a Flutter version
        run: |
          set -euo pipefail
          hits="$(
            git ls-files -z \
                '*.nix' '.github/workflows/*' '*Dockerfile*' '*compose*.yml' \
                'scripts/*' 'dev' 'player/flatpak/*' 'player/appimage/*' \
              | xargs -0 grep -HnIiE 'flutter' \
              | grep -vE ':[[:space:]]*uses:[[:space:]]*[^[:space:]]+@' \
              | grep -E '[0-9]+\.[0-9]+|[Ff]lutter[0-9]' \
              || true
          )"
          if [ -n "$hits" ]; then
            echo "::error::A Flutter version literal escaped player/.fvmrc"
            echo "$hits"
            echo
            echo "player/.fvmrc is the single source of truth. Read from it instead:"
            echo "  workflows   -> subosito/flutter-action with flutter-version-file"
            echo "  Dockerfiles -> jq -r .flutter player/.fvmrc"
            echo "  nix         -> import player/flutter-version.nix"
            echo "  flatpak     -> read it in build.sh from player/.fvmrc"
            exit 1
          fi
          echo "OK: player/.fvmrc is the only file naming a Flutter version."

      - name: Assert pubspec.yaml bounds Dependabot to the pinned minor
        run: |
          set -euo pipefail
          pinned="$(jq -r .flutter player/.fvmrc)"
          IFS=. read -r major minor _ <<< "$pinned"
          expected=">=$major.$minor.0 <$major.$((minor + 1)).0"
          actual="$(yq -r '.environment.flutter // ""' player/pubspec.yaml)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::environment.flutter in player/pubspec.yaml does not match player/.fvmrc"
            echo "  found:    ${actual:-<missing>}"
            echo "  expected: $expected"
            echo
            echo "Set it to '$expected' and re-run \`flutter pub get\` in player/"
            echo "so pubspec.lock is resolved against the pinned SDK."
            exit 1
          fi
          echo "OK: environment.flutter is '$expected'."

      - name: Assert .elixir-version and .otp-version are the only pins
        run: ./scripts/check-beam-pin.sh

      # rustup reads rust-toolchain.toml, so `cargo metadata --locked` resolves
      # with the same toolchain the Nix build uses.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cachix, not magic-nix-cache: the latter wrote ~2,200 .nar entries
      # (1.1 GB) into the 10 GB Actions cache and pushed the Mix build caches out.
      # Read-only, with no token: CI no longer pushes to Cachix (CI's own
      # cache is niks3, .github/ci.md "niks3").
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: mydia
          extraPullNames: devenv
          skipPush: true

      - name: Assert the Android shell resolves the pinned Flutter
        run: nix eval --raw .#packages.x86_64-linux.flutter.version

      - name: Assert the BEAM resolver agrees with nixpkgs
        run: |
          nix eval --raw --impure --expr '
            let
              pin = import ./beam-version.nix {
                pkgs = (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux;
              };
            in
            "Elixir ${pin.elixir.version} on OTP ${pin.erlang.version}\n"'

      - name: Assert generated artifacts match their manifests
        run: ./scripts/check-generated-freshness.sh
