name: CI / Nix

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter-pin:
    name: Check / Flutter Pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The nix eval below only proves player/.fvmrc agrees with nixpkgs. It
      # cannot see a stale `flutter-version:` literal re-added to a workflow --
      # the exact regression this pin exists to prevent. So scan every file that
      # can select an SDK (workflows, Dockerfiles, compose files, nix modules,
      # scripts) for a version literal sitting in Flutter context. Dart package
      # manifests are out of scope: their constraints pin packages, not the SDK
      # this repo builds with. The one exception, environment.flutter in
      # player/pubspec.yaml, is checked against .fvmrc by the next step. Needs
      # only the checkout, so it runs first and fails in seconds.
      #
      # `uses:` lines are skipped because an action reference is not an SDK
      # selection. Without that, SHA-pinning the setup action in the usual
      # hardening idiom (a commit sha followed by a trailing version comment)
      # would fail this check for doing the right thing.
      #
      # Note this file is in scope for its own scan, so do not write a version
      # literal in these comments either -- the same rule the check enforces.
      - name: Assert no other build or CI file names a Flutter version
        run: |
          set -euo pipefail
          hits="$(
            git ls-files -z \
                '*.nix' '.github/workflows/*' '*Dockerfile*' '*compose*.yml' \
                'scripts/*' 'dev' 'player/flatpak/*' \
              | xargs -0 grep -HnIiE 'flutter' \
              | grep -vE ':[[:space:]]*uses:[[:space:]]*[^[:space:]]+@' \
              | grep -E '[0-9]+\.[0-9]+|[Ff]lutter[0-9]' \
              || true
          )"
          if [ -n "$hits" ]; then
            echo "::error::A Flutter version literal escaped player/.fvmrc"
            echo "$hits"
            echo
            echo "player/.fvmrc is the single source of truth. Read from it instead:"
            echo "  workflows   -> subosito/flutter-action with flutter-version-file"
            echo "  Dockerfiles -> jq -r .flutter player/.fvmrc"
            echo "  nix         -> import player/flutter-version.nix"
            echo "  flatpak     -> read it in build.sh from player/.fvmrc"
            exit 1
          fi
          echo "OK: player/.fvmrc is the only file naming a Flutter version."

      # Dependabot never reads .fvmrc. It resolves player/pubspec.lock with the
      # newest stable Flutter that pubspec.yaml's environment.flutter allows, and
      # every Flutter release pins several packages exactly, so that range must
      # name the pinned minor. Otherwise Dependabot and each local `pub get`
      # rewrite the lock in opposite directions. Pub enforces only the lower
      # bound, so nothing else notices when a bump leaves the range behind.
      #
      # The floor is the minor's .0 rather than the .fvmrc patch. Patches of
      # one minor pin the same packages, and player/Dockerfile.test builds on
      # cirruslabs' stable tag, which lags patch releases; a patch floor made
      # pub refuse that image outright.
      - name: Assert pubspec.yaml bounds Dependabot to the pinned minor
        run: |
          set -euo pipefail
          pinned="$(jq -r .flutter player/.fvmrc)"
          IFS=. read -r major minor _ <<< "$pinned"
          expected=">=$major.$minor.0 <$major.$((minor + 1)).0"
          actual="$(
            awk '/^environment:/ { e = 1; next }
                 /^[^[:space:]#]/ { e = 0 }
                 e && $1 == "flutter:" { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' \
              player/pubspec.yaml | tr -d "\"'"
          )"
          if [ "$actual" != "$expected" ]; then
            echo "::error::environment.flutter in player/pubspec.yaml does not match player/.fvmrc"
            echo "  found:    ${actual:-<missing>}"
            echo "  expected: $expected"
            echo
            echo "Set it to '$expected' and re-run \`flutter pub get\` in player/"
            echo "so pubspec.lock is resolved against the pinned SDK."
            exit 1
          fi
          echo "OK: environment.flutter is '$expected'."

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # The assertion lives in player/flutter-version.nix; this step only forces
      # evaluation. It builds nothing -- no SDK, no Android tooling -- so it costs
      # a nixpkgs fetch and nothing more. A mismatch between player/.fvmrc and
      # the flake's nixpkgs fails here with the message that names the fix.
      - name: Assert the Android shell resolves the pinned Flutter
        run: nix eval --raw .#packages.x86_64-linux.flutter.version

  apple-deployment-targets:
    name: Check / Apple Deployment Targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The minimum OS version is duplicated across a Podfile, an Xcode project
      # and a podspec on each Apple platform. Nothing in the toolchain keeps
      # them in step, and when they drift the app can ship declaring a lower
      # minimum than the Pods it links, which is what earned an ITMS-90068
      # warning from App Store Connect in August 2026.
      #
      # The script asserts agreement per platform rather than equality to a
      # fixed number, so raising a minimum stays a player-side edit and no
      # version literal lives in CI. Needs only the checkout, so it runs
      # alongside the other cheap checks and fails in seconds.
      - name: Assert every Apple deployment target agrees
        run: ./scripts/check-apple-deployment-targets.sh

  testflight-notes:
    name: Check / TestFlight Notes
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 because the commit-log fallback resolves a previous tag
      # and walks a commit range. A shallow checkout has neither.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The notes this produces become TestFlight's "What to Test", which Apple
      # caps at 4000 characters and rejects when empty. Both properties are
      # invisible until a release is dispatched, so they are asserted here
      # against every bundled changelog instead. Needs only the checkout.
      - name: Assert the store release notes hold their contract
        run: ./scripts/check-testflight-notes.sh

      # The refresh workflow it feeds cannot be dispatched or scheduled until it
      # is on the default branch, so this is the only place its decision is
      # exercised before merge. Needs the same fetch-depth: 0 checkout, because
      # it reads the tag list.
      - name: Assert the TestFlight refresh decision holds its contract
        run: ./scripts/check-ios-refresh-due.sh

      # ci-fastlane.yml proves the Fastfile parses and that release_metadata.rb
      # is reachable through require_relative. This proves what the helpers in
      # it actually return, which a lane listing cannot see. It also pins
      # notify_external_testers to true in the Fastfile.
      - name: Assert the iOS fastlane metadata helpers behave
        run: ./scripts/check-ios-fastlane-metadata.sh

  generated-freshness:
    name: Check / Generated Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml, so `cargo metadata --locked` below
      # resolves with the same toolchain the Nix build uses rather than
      # whatever the runner image ships.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Guards the two ways a dependency bump ships a broken tree while every
      # check stays green: generated frb bindings left behind by a version pin
      # that moved, and a Cargo.lock left behind by a manifest that moved. Both
      # happened on 2026-08-29, three minutes apart, and neither was catchable
      # on a pull request, because the jobs that would have caught them
      # (`CI / Nix`, `CI / Player E2E`) do not run on one. This does.
      - name: Assert generated artifacts match their manifests
        run: ./scripts/check-generated-freshness.sh

  # Both NixOS VM tests run on push only. They are the slowest and least
  # reliable jobs in CI, combining a QEMU boot with a full Nix build on top of
  # the FlakeHub cache 503s that can hit any Nix job, and breaking the NixOS
  # module is rare enough that catching it on master costs less than paying for
  # it on every PR.
  #
  # They also build packages.default and packages.postgres as inputs, via
  # nix/checks/flake-module.nix, which is why the former `Build / Packages` job
  # was deleted as redundant rather than kept alongside them.
  test-sqlite-module:
    name: Test / NixOS Module (SQLite)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build NixOS module test
        run: nix build .#checks.x86_64-linux.nixos-module -L

  test-postgres-module:
    name: Test / NixOS Module (PostgreSQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build NixOS module test
        run: nix build .#checks.x86_64-linux.nixos-module-postgres -L
