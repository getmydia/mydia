name: CI / Player Desktop

# No path filters here, deliberately. `Build / Web` and `Test / Player` are
# required contexts on the Master ruleset, and a required check that never
# reports leaves a pull request pending forever. The filter lives in the
# `changes` job below instead, so every job always reports -- concluding in a
# few seconds with its steps skipped when nothing relevant changed.
#
# The push filter is gone for the same reason the pull_request one is: it keeps
# exactly one copy of the path list, in `changes`.
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYER_PATH: 'player'

jobs:
  changes:
    name: Check / Player paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      player: ${{ steps.filter.outputs.player }}

    steps:
      # The single source of truth for what this workflow cares about:
      #
      #   player/**                      the app itself
      #   native/**                      build-android cross-compiles
      #                                  player/rust/mydia_player_p2p, which
      #                                  depends on ../../native/mydia_p2p_core
      #                                  by relative path
      #   priv/graphql/schema.graphql    test-player's build_runner step runs
      #                                  graphql_codegen against this schema.
      #                                  player/lib/graphql/schema.graphql is a
      #                                  symlink to it, so filtering on the
      #                                  symlink's own path would never fire
      #   .github/workflows/ci-player.yml
      - name: Decide whether player code changed
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed=""
          case "$EVENT" in
            pull_request)
              changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
                           --paginate --jq '.[].filename')"
              ;;
            push)
              # `before` is all-zeros on a branch's first push and unreliable
              # after a force-push. Either way, run everything rather than
              # silently skipping.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "player=true" >> "$GITHUB_OUTPUT"
                echo "No usable base commit; running everything."
                exit 0
              fi
              changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
                           --jq '.files[].filename' || echo "")"
              if [ -z "$changed" ]; then
                echo "player=true" >> "$GITHUB_OUTPUT"
                echo "Could not compute the change set; running everything."
                exit 0
              fi
              ;;
            *)
              echo "player=true" >> "$GITHUB_OUTPUT"
              echo "Event $EVENT has no change set; running everything."
              exit 0
              ;;
          esac

          if printf '%s\n' "$changed" | grep -qE '^(player/|native/|priv/graphql/schema\.graphql$|\.github/workflows/ci-player\.yml$)'; then
            echo "player=true" >> "$GITHUB_OUTPUT"
            echo "Player-relevant changes found."
          else
            echo "player=false" >> "$GITHUB_OUTPUT"
            echo "No player-relevant changes."
          fi

  # Moved here from ci.yml, which has no path filter and therefore ran the
  # whole Flutter suite on every Elixir-only PR. This workflow already filters
  # on player/** and native/**, which is the correct trigger surface for it.
  # The job name is unchanged so the check context stays `Test / Player`.
  test-player:
    name: Test / Player
    runs-on: ubuntu-latest
    needs: changes

    defaults:
      run:
        working-directory: player

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7

      - name: Setup Flutter
        if: needs.changes.outputs.player == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.player == 'true'
        run: flutter pub get

      - name: Run code generation
        if: needs.changes.outputs.player == 'true'
        run: flutter pub run build_runner build

      - name: Run tests
        # --concurrency=1: the default concurrency silently drops 2-4 test
        # files while still exiting 0, so this is load-bearing, not cosmetic.
        if: needs.changes.outputs.player == 'true'
        run: flutter test --concurrency=1

      - name: Run television-tier tests
        # `directionalPrimary` is compile-time influenced, so the VM run above
        # only ever exercises the non-directional branch. Without this step the
        # whole Android TV code path has no coverage in CI at all.
        #
        # Files are enumerated rather than running the full suite under the
        # define, which would roughly double this job for no extra signal.
        # Empty means the naming convention broke, which must fail rather than
        # silently cover nothing.
        if: needs.changes.outputs.player == 'true'
        run: |
          set -euo pipefail
          # Read into an array rather than a bare string: an unquoted expansion
          # would word-split a path containing whitespace into several invalid
          # arguments, and `flutter test` would report a missing file instead
          # of the real cause.
          mapfile -t files < <(git ls-files 'test/**/*_tv_test.dart')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No test/**/*_tv_test.dart files matched; expected at least one." >&2
            exit 1
          fi
          echo "Television-tier tests: ${files[*]}"
          flutter test --concurrency=1 --dart-define=MYDIA_FORCE_TV=true "${files[@]}"

      - name: Run browser tests
        # The run above is a VM run, which skips every @TestOn('browser') file.
        # Without this step the IndexedDB keystore has no coverage in CI at all.
        #
        # The files are enumerated rather than passing a bare `--platform
        # chrome`, because that would try to run the whole suite in a browser
        # and most of it needs dart:io. Empty means the naming convention broke,
        # which must fail rather than silently cover nothing.
        #
        # No --concurrency here, unlike the VM run above: flutter parses it and
        # then ignores it for web runs, printing a warning that reads like a
        # mistake.
        if: needs.changes.outputs.player == 'true'
        run: |
          set -euo pipefail
          files=$(git ls-files 'test/**/*_web_test.dart')
          if [ -z "$files" ]; then
            echo "No test/**/*_web_test.dart files matched; expected at least one." >&2
            exit 1
          fi
          echo "Browser tests: $files"
          flutter test --platform chrome $files

  # Nothing compiled the player for the web until this job existed. The matrix
  # below covers Windows, macOS, Linux and Android, and `icons` only diffs the
  # generated SVG set, so 183 commits landed on player/ between the public web
  # player merging and its first deploy without one of them being checked
  # against the web target. That gap is only visible at deploy time, where it
  # would now break a release: deploy-web-player.yml runs from release.yml.
  #
  # This builds the same bundle the deploy builds, with the same flags, minus
  # the wasm module. The Rust half needs nix, wasm-pack and a
  # flutter_rust_bridge codegen install (player/tool/build_web.sh), which is
  # roughly twelve minutes and too much for every player PR. The split is
  # deliberate rather than lazy: ci.yml already compiles
  # native/mydia_p2p_core for wasm32-unknown-unknown, so the crate reaching
  # wasm is covered, and what stays uncovered here is wasm-pack's packaging
  # step, whose inputs are pinned toolchain versions that move only on a
  # deliberate bump. Dart source, which every PR touches, is what this catches.
  #
  # MYDIA_WEB_P2P=true matters even without the module present: it selects the
  # public-web branch in main.dart, so this compiles the code path the deploy
  # actually ships rather than the instance-hosted one.
  build-web:
    name: Build / Web
    runs-on: ubuntu-latest
    needs: changes

    # Reading the tree is all this job does. Scoped to this job rather than
    # added file-wide, which would be its own sweep: the steps below run
    # third-party code (pub packages, via `flutter pub get` and build_runner),
    # so it is the one job here where least privilege has something to bite on.
    permissions:
      contents: read

    defaults:
      run:
        working-directory: player

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7
        with:
          # Nothing in this job runs a git command, so the token has no reason
          # to stay in .git/config where a package's build hook could read it.
          persist-credentials: false

      - name: Setup Flutter
        if: needs.changes.outputs.player == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.player == 'true'
        run: flutter pub get

      - name: Run code generation
        if: needs.changes.outputs.player == 'true'
        run: flutter pub run build_runner build

      - name: Build the web bundle
        if: needs.changes.outputs.player == 'true'
        run: |
          flutter build web --release --base-href / \
            --no-web-resources-cdn \
            --pwa-strategy=none \
            --dart-define=MYDIA_WEB_P2P=true

      # build_web.sh asserts this file reached build/web; this also asserts it
      # still says what it has to say. Both directives are load-bearing:
      # without them the deployed page is not cross-origin isolated, there is
      # no SharedArrayBuffer, and RustLib.init() throws in every browser.
      # Checking only for the file's presence would wave through a _headers
      # whose directives had been edited away, which breaks identically and is
      # the likelier edit of the two.
      - name: Check _headers survived the build
        if: needs.changes.outputs.player == 'true'
        run: |
          set -euo pipefail
          headers=build/web/_headers
          if [ ! -f "$headers" ]; then
            echo "::error::_headers did not make it into build/web." >&2
            exit 1
          fi
          for directive in \
            "Cross-Origin-Opener-Policy: same-origin" \
            "Cross-Origin-Embedder-Policy: require-corp"; do
            if ! grep -qF "$directive" "$headers"; then
              echo "::error::$headers no longer sets '$directive'. The deployed page" >&2
              echo "         would not be cross-origin isolated, so the p2p wasm module" >&2
              echo "         could not instantiate in any browser." >&2
              exit 1
            fi
          done

  build:
    name: Build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            platform_dir: windows
            artifact_name: mydia-player-windows-release
            artifact_path: player/build/windows/x64/runner/Release/
            shell: bash
          - platform: macOS
            os: macos-latest
            platform_dir: macos
            artifact_name: mydia-player-macos-app
            # Must stay the ditto archive, not the .app directory. "Package
            # macOS app" and "Verify packaged macOS app" below both enforce this.
            artifact_path: player/build/macos/Build/Products/Release/mydia-player-macos.zip
            shell: bash
          - platform: Linux
            os: ubuntu-latest
            platform_dir: linux
            artifact_name: mydia-player-linux-bundle
            artifact_path: player/build/linux/x64/release/bundle
            shell: bash

    runs-on: ${{ matrix.os }}
    needs: changes
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check platform support
        id: check_platform
        run: |
          if [ "${{ needs.changes.outputs.player }}" != "true" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "No player-relevant changes. Skipping build."
          elif [ -d "${{ env.PLAYER_PATH }}/${{ matrix.platform_dir }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::${{ matrix.platform }} platform not configured yet. Skipping build."
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux' && steps.check_platform.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev

      - name: Setup Flutter
        if: steps.check_platform.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        if: steps.check_platform.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ env.PLAYER_PATH }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        # --delete-conflicting-outputs was removed in build_runner 2.15 and is
        # now warned about and ignored on every run.
        run: flutter pub run build_runner build

      - name: Generate icons
        if: matrix.platform == 'Windows' && steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: dart run flutter_launcher_icons

      - name: Build ${{ matrix.platform }}
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ${{ matrix.platform_dir }} --release

      # A release build links against the VC++ runtime, which a clean Windows
      # install does not ship, so the app dies on launch with "msvcp140.dll was
      # not found". This runner already has the runtime, which is exactly why
      # nothing here catches it. The script copies the DLLs into the Release
      # directory that both this artifact and the installer are built from, and
      # fails the job if they are missing afterwards.
      - name: Bundle VC++ runtime
        if: matrix.platform == 'Windows' && steps.check_platform.outputs.enabled == 'true'
        shell: pwsh
        run: pwsh ${{ env.PLAYER_PATH }}/tool/bundle_windows_runtime.ps1

      # Do NOT point artifact_path at the .app directory and let upload-artifact
      # zip it. Its zip implementation replaces every symlink with a full copy of
      # the target, which flattens all 25 frameworks in the bundle:
      # Versions/Current stops being a link to Versions/A, and the top-level
      # Foo.framework/Foo and Foo.framework/Resources aliases become duplicates.
      # That invalidates the code signature, so codesign reports "bundle format
      # is ambiguous (could be app or framework)" and Gatekeeper refuses to
      # launch the app. ditto preserves symlinks, and --keepParent keeps
      # "Mydia Player.app" as the archive root so the download does not unpack as
      # a bare Contents/. Same invocation release.yml:626 uses for notarization.
      # Uploading a single file also means GitHub's own re-zip of the artifact
      # has no symlinks left to flatten. See issue #275.
      - name: Package macOS app
        if: matrix.platform == 'macOS' && steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent "Mydia Player.app" "mydia-player-macos.zip"

      # Verify the archive we are about to upload, not the build output. The
      # build was never broken; the packaging was, so a guard on the pre-upload
      # bundle would pass while still shipping a dead artifact. This defect went
      # unnoticed for every run that ever produced this artifact, which is why
      # it fails the job rather than warning.
      - name: Verify packaged macOS app
        if: matrix.platform == 'macOS' && steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # The guards below validate the archive. This asserts the archive is
          # what actually gets uploaded: without it, repointing artifact_path
          # back at the .app directory would still leave both guards green while
          # shipping the flattened bundle that issue #275 is about.
          EXPECTED="${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/mydia-player-macos.zip"
          if [ "${{ matrix.artifact_path }}" != "$EXPECTED" ]; then
            echo "::error::artifact_path is '${{ matrix.artifact_path }}' but must be '$EXPECTED'. The uploaded artifact is not the verified archive."
            exit 1
          fi

          rm -rf verify && mkdir verify
          ditto -x -k "mydia-player-macos.zip" verify

          APP="verify/Mydia Player.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Archive has no 'Mydia Player.app' root; --keepParent was lost."
            ls -la verify
            exit 1
          fi

          LINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          if [ "$LINKS" -eq 0 ]; then
            echo "::error::Packaged bundle has 0 symlinks; framework symlinks were flattened."
            exit 1
          fi

          # Authoritative check. A flattened bundle fails here with
          # "bundle format is ambiguous (could be app or framework)", which is
          # exactly what issue #275 reported.
          codesign --verify --verbose=2 "$APP"

          echo "Packaged bundle OK ($LINKS symlinks, signature valid)"
          rm -rf verify

      # upload-artifact archives a directory path as a plain zip, and its zip
      # implementation replaces every symlink with a copy of the symlink's
      # target. That is what broke the macOS artifact (see the packaging step
      # above). The Linux bundle has no symlinks today: CMake's
      # install(FILES ...) at player/linux/CMakeLists.txt:111 dereferences them,
      # and media_kit links the system libmpv rather than bundling a versioned
      # .so chain. Assert that rather than assume it, so the day a dependency
      # starts shipping lib/foo.so.1 -> foo.so.1.2 this fails here instead of
      # producing a silently broken bundle.
      - name: Assert Linux bundle has no symlinks
        if: matrix.platform == 'Linux' && steps.check_platform.outputs.enabled == 'true'
        run: |
          BUNDLE="${{ env.PLAYER_PATH }}/build/linux/x64/release/bundle"
          # Assign first, rather than testing `if [ -n "$(find ...)" ]` directly:
          # set -e is suppressed inside an if condition, so a find failure on a
          # missing bundle would read as "no symlinks" and pass. A standalone
          # assignment keeps the step fail-closed. -print -quit stops at the
          # first hit; the full list is only worth computing when we fail.
          FIRST_LINK=$(find "$BUNDLE" -type l -print -quit)
          if [ -n "$FIRST_LINK" ]; then
            echo "::error::Linux bundle contains symlinks; upload-artifact flattens them into copies. Archive the bundle before uploading."
            find "$BUNDLE" -type l
            exit 1
          fi
          echo "Linux bundle has no symlinks; direct directory upload is safe."

      - name: Upload artifact
        if: steps.check_platform.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  build-android:
    name: Build / Android
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7

      - name: Setup Flutter
        if: needs.changes.outputs.player == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Setup Java
        if: needs.changes.outputs.player == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache pub dependencies
        if: needs.changes.outputs.player == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            player/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        if: needs.changes.outputs.player == 'true'
        working-directory: player
        run: flutter pub get

      # Not optional: the generated Dart files are gitignored, so without this a
      # clean checkout fails the build with hundreds of errors pointing nowhere
      # near codegen. No --delete-conflicting-outputs; it was removed in
      # build_runner 2.15 and is now warned about and ignored.
      - name: Run code generation
        if: needs.changes.outputs.player == 'true'
        working-directory: player
        run: flutter pub run build_runner build

      # Drives cargokit, which cross-compiles player/rust_builder against the
      # NDK. This is what puts the Rust/Dart FFI boundary under PR coverage;
      # before this job it was only exercised by release.yml. Uses the runner's
      # preinstalled rustup, but the toolchain it runs comes from
      # rust-toolchain.toml, not from whatever the runner image calls stable;
      # cargokit installs the pinned toolchain on demand.
      - name: Build APK
        if: needs.changes.outputs.player == 'true'
        working-directory: player
        run: flutter build apk --release

      - name: Upload artifact
        if: needs.changes.outputs.player == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-android-apk
          path: player/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  icons:
    name: Check / Web icons
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7

      # Guards against the web icon set drifting from its SVG sources: a
      # source SVG changed without regenerating, a generated file was
      # hand-edited, or a generated file was deleted. --check needs only
      # coreutils, hence no Flutter, no nix and no matrix here.
      - name: Check web icons are current
        if: needs.changes.outputs.player == 'true'
        working-directory: player
        run: tool/gen-web-icons.sh --check

  flatpak-validate:
    name: Flatpak / Validate metadata
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7

      # player/flatpak/test/ holds four script tests and nothing ran any of
      # them, which is how the publish.sh skeleton bug reached v0.13.1. This one
      # needs no packages beyond bash, so it runs first. The other three want
      # ostree, rclone, flatpak and gpg and are still manual.
      - name: Test the ostree skeleton repair
        if: needs.changes.outputs.player == 'true'
        run: ./player/flatpak/test/ensure-skeleton-test.sh

      # Seconds, not minutes. Catches most manifest metadata mistakes long
      # before the full flatpak-build job below finishes compiling mpv.
      - name: Install validators
        if: needs.changes.outputs.player == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop entry
        if: needs.changes.outputs.player == 'true'
        run: desktop-file-validate player/flatpak/dev.mydia.player.desktop

      - name: Validate AppStream metainfo
        if: needs.changes.outputs.player == 'true'
        run: appstreamcli validate --explain player/flatpak/dev.mydia.player.metainfo.xml

      - name: Validate finish-args
        if: needs.changes.outputs.player == 'true'
        run: player/flatpak/test/finish-args-test.sh

  flatpak-build:
    name: Flatpak / Build
    runs-on: ubuntu-latest
    needs: changes
    # mpv, libplacebo and libass account for roughly a third of this; the
    # Flutter build and its Rust cdylib account for the rest.
    timeout-minutes: 90

    steps:
      - name: Checkout
        if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v7

      - name: Install flatpak-builder
        if: needs.changes.outputs.player == 'true'
        run: |
          sudo apt-get update
          # appstream provides appstreamcli, which flatpak-builder shells out to
          # on the host during export. Without it the build fails at the very
          # last step, after everything has already compiled.
          sudo apt-get install -y flatpak flatpak-builder xvfb appstream

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts these through AppArmor, which breaks the
        # bubblewrap sandbox flatpak-builder needs.
        if: needs.changes.outputs.player == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub and install the runtime
        if: needs.changes.outputs.player == 'true'
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Build
        if: needs.changes.outputs.player == 'true'
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=staged-repo --default-branch=stable \
            build-dir player/flatpak/dev.mydia.player.yml

      - name: Install and smoke test
        if: needs.changes.outputs.player == 'true'
        run: |
          flatpak remote-add --user --no-gpg-verify --if-not-exists \
            staged "$PWD/staged-repo"
          flatpak install --user -y --reinstall staged dev.mydia.player
          ./player/flatpak/smoke-test.sh stable
