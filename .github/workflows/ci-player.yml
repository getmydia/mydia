name: CI / Player Desktop

on:
  push:
    branches:
      - master
      - main
    paths:
      - "player/**"
      # player/rust/mydia_player_p2p depends on ../../native/mydia_p2p_core by
      # relative path, so build-android cross-compiles code that lives outside
      # player/. Without this, a change breaking the Android target lands green
      # (ci.yml only builds the NIF for the host) and surfaces at release time.
      - "native/**"
      - ".github/workflows/ci-player.yml"
  pull_request:
    paths:
      - "player/**"
      - "native/**"
      - ".github/workflows/ci-player.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            platform_dir: windows
            artifact_name: mydia-player-windows-release
            artifact_path: player/build/windows/x64/runner/Release/
            shell: bash
          - platform: macOS
            os: macos-latest
            platform_dir: macos
            artifact_name: mydia-player-macos-app
            artifact_path: player/build/macos/Build/Products/Release/Mydia Player.app
            shell: bash
          - platform: Linux
            os: ubuntu-latest
            platform_dir: linux
            artifact_name: mydia-player-linux-bundle
            artifact_path: player/build/linux/x64/release/bundle
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check platform support
        id: check_platform
        run: |
          if [ -d "${{ env.PLAYER_PATH }}/${{ matrix.platform_dir }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::${{ matrix.platform }} platform not configured yet. Skipping build."
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux' && steps.check_platform.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsecret-1-dev

      - name: Setup Flutter
        if: steps.check_platform.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        if: steps.check_platform.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PLAYER_PATH }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get

      - name: Run code generation
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        # --delete-conflicting-outputs was removed in build_runner 2.15 and is
        # now warned about and ignored on every run.
        run: flutter pub run build_runner build

      - name: Generate icons
        if: matrix.platform == 'Windows' && steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: dart run flutter_launcher_icons

      - name: Build ${{ matrix.platform }}
        if: steps.check_platform.outputs.enabled == 'true'
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ${{ matrix.platform_dir }} --release

      - name: Upload artifact
        if: steps.check_platform.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  build-android:
    name: Build / Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            player/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: player
        run: flutter pub get

      # Not optional: the generated Dart files are gitignored, so without this a
      # clean checkout fails the build with hundreds of errors pointing nowhere
      # near codegen. No --delete-conflicting-outputs; it was removed in
      # build_runner 2.15 and is now warned about and ignored.
      - name: Run code generation
        working-directory: player
        run: flutter pub run build_runner build

      # Drives cargokit, which cross-compiles player/rust_builder against the
      # NDK. This is what puts the Rust/Dart FFI boundary under PR coverage;
      # before this job it was only exercised by release.yml. Uses the runner's
      # preinstalled rustup, but the toolchain it runs comes from
      # rust-toolchain.toml, not from whatever the runner image calls stable;
      # cargokit installs the pinned toolchain on demand.
      - name: Build APK
        working-directory: player
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydia-player-android-apk
          path: player/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  icons:
    name: Check / Web icons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the failure mode from 2026-01: a source SVG changes but the
      # generated web icon set is not regenerated, so the app ships a stale or
      # stock icon. --check needs only coreutils, hence no Flutter, no nix and
      # no matrix here.
      - name: Check web icons are current
        working-directory: player
        run: tool/gen-web-icons.sh --check
