name: CI / Player Desktop

# The player jobs Nix CI does not cover: the Windows and macOS builds, the
# macOS native tests and the Flatpak checks. Test / Player, Build / Web,
# Build / Linux, Check / Web icons and Build / Android live in ci.yml
# (.github/ci.md, "ci.yml: the flake-check graph"), so nothing here is a required context and a path filter is safe:
# a workflow the filter skips reports nothing, which would leave a required
# check pending forever, and none of these is required.
#
# The paths are what these builds read:
#
#   player/**                      the app itself
#   native/**                      cargokit compiles player/rust/mydia_player_p2p,
#                                  which depends on ../../native/mydia_p2p_core
#                                  by relative path
#   priv/graphql/schema.graphql    build_runner runs graphql_codegen against it;
#                                  player/lib/graphql/schema.graphql is a
#                                  symlink to it, so filtering on the symlink's
#                                  own path would never fire
#   rust-toolchain.toml            cargokit pins its Rust toolchain from it
#
# A pull request that changes only translated ARB files (not the app_en.arb
# template) runs none of this: translations cannot break a desktop build that
# the template does not. ci.yml's player-l10n-test covers them.
#
# push and pull_request carry the same list; keep them identical. The
# negation must follow player/** and precede app_en.arb: the last pattern a
# file matches decides.
#
# The AppImage dry run is ci-player-appimage.yml, with its own narrower paths.
on:
  push:
    branches:
      - master
    paths:
      - 'player/**'
      - '!player/lib/l10n/app_*.arb'
      - 'player/lib/l10n/app_en.arb'
      - 'native/**'
      - 'priv/graphql/schema.graphql'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-player.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'player/**'
      - '!player/lib/l10n/app_*.arb'
      - 'player/lib/l10n/app_en.arb'
      - 'native/**'
      - 'priv/graphql/schema.graphql'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-player.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            platform_dir: windows
            artifact_name: mydia-player-windows-release
            artifact_path: player/build/windows/x64/runner/Release/
          - platform: macOS
            # Matches player-macos.yml, so a PR builds with the release Xcode.
            os: xcode-27
            platform_dir: macos
            artifact_name: mydia-player-macos-app
            # Must stay the ditto archive, not the .app directory. "Package
            # macOS app" and "Verify packaged macOS app" below both enforce this.
            artifact_path: player/build/macos/Build/Products/Release/mydia-player-macos.zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ env.PLAYER_PATH }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # --enforce-lockfile fails the job when pubspec.lock does not resolve on
      # the .fvmrc SDK, instead of quietly re-resolving and building a
      # different tree. Every CI, release and E2E `pub get` carries the flag.
      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        # --delete-conflicting-outputs was removed in build_runner 2.15 and is
        # now warned about and ignored on every run.
        run: flutter pub run build_runner build

      - name: Build ${{ matrix.platform }}
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build ${{ matrix.platform_dir }} --release

      # A release build links against the VC++ runtime, which a clean Windows
      # install does not ship, so the app dies on launch with "msvcp140.dll was
      # not found". This runner already has the runtime, which is exactly why
      # nothing here catches it. The script copies the DLLs into the Release
      # directory that both this artifact and the installer are built from, and
      # fails the job if they are missing afterwards.
      - name: Bundle VC++ runtime
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: pwsh ${{ env.PLAYER_PATH }}/tool/bundle_windows_runtime.ps1

      # Do NOT point artifact_path at the .app directory and let upload-artifact
      # zip it. Its zip implementation replaces every symlink with a full copy of
      # the target, which flattens all 25 frameworks in the bundle:
      # Versions/Current stops being a link to Versions/A, and the top-level
      # Foo.framework/Foo and Foo.framework/Resources aliases become duplicates.
      # That invalidates the code signature, so codesign reports "bundle format
      # is ambiguous (could be app or framework)" and Gatekeeper refuses to
      # launch the app. ditto preserves symlinks, and --keepParent keeps
      # "Mydia Player.app" as the archive root so the download does not unpack as
      # a bare Contents/. Same invocation player-macos.yml uses for notarization.
      # Uploading a single file also means GitHub's own re-zip of the artifact
      # has no symlinks left to flatten. See issue #275.
      - name: Package macOS app
        if: matrix.platform == 'macOS'
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent "Mydia Player.app" "mydia-player-macos.zip"

      # Verify the archive we are about to upload, not the build output. The
      # build was never broken; the packaging was, so a guard on the pre-upload
      # bundle would pass while still shipping a dead artifact. This defect went
      # unnoticed for every run that ever produced this artifact, which is why
      # it fails the job rather than warning.
      - name: Verify packaged macOS app
        if: matrix.platform == 'macOS'
        working-directory: ${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release
        run: |
          # The guards below validate the archive. This asserts the archive is
          # what actually gets uploaded: without it, repointing artifact_path
          # back at the .app directory would still leave both guards green while
          # shipping the flattened bundle that issue #275 is about.
          EXPECTED="${{ env.PLAYER_PATH }}/build/macos/Build/Products/Release/mydia-player-macos.zip"
          if [ "${{ matrix.artifact_path }}" != "$EXPECTED" ]; then
            echo "::error::artifact_path is '${{ matrix.artifact_path }}' but must be '$EXPECTED'. The uploaded artifact is not the verified archive."
            exit 1
          fi

          rm -rf verify && mkdir verify
          ditto -x -k "mydia-player-macos.zip" verify

          APP="verify/Mydia Player.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Archive has no 'Mydia Player.app' root; --keepParent was lost."
            ls -la verify
            exit 1
          fi

          LINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          if [ "$LINKS" -eq 0 ]; then
            echo "::error::Packaged bundle has 0 symlinks; framework symlinks were flattened."
            exit 1
          fi

          # Authoritative check. A flattened bundle fails here with
          # "bundle format is ambiguous (could be app or framework)", which is
          # exactly what issue #275 reported.
          codesign --verify --verbose=2 "$APP"

          echo "Packaged bundle OK ($LINKS symlinks, signature valid)"
          rm -rf verify

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  # The macOS native tests: RunnerTests (MpvSurfacePlugin, WindowPlugin and
  # the rest of macos/RunnerTests) through xcodebuild. Not a required
  # context, like everything in this workflow.
  #
  # integration_test/mac_surface_test.dart cannot run here. The hosted
  # runner is a macOS VM whose only GPU is the Apple Paravirtual device, and
  # both video outputs kill the app on it: gpu-next segfaults in MoltenVK
  # (vkBindImageMemory, inside AppleParavirtGPUMetalIOGPUFamily) on its
  # first texture upload, and media_kit's texture path finds no accelerated
  # OpenGL pixel format and force-unwraps it. Every case in that file skips
  # on that GPU, so it stays a run-on-a-Mac test (player/docs/playback.md,
  # "The integration test").
  test-macos-native:
    name: Test / macOS native
    # The same image and Xcode as the macOS build leg above.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: player/.fvmrc
          channel: 'stable'

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ env.PLAYER_PATH }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter pub run build_runner build

      # --config-only writes macos/Flutter/ephemeral/Flutter-Generated.xcconfig
      # (target lib/main.dart, the app RunnerTests is hosted in) and installs
      # the pods, without building. xcodebuild then builds the Debug app,
      # its Rust core and the test bundle into flutter's own build roots.
      - name: Run RunnerTests
        working-directory: ${{ env.PLAYER_PATH }}
        run: |
          flutter build macos --debug --config-only
          build_dir="$PWD/build/macos"
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "$build_dir" \
            -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult" \
            "OBJROOT=$build_dir/Build/Intermediates.noindex" \
            "SYMROOT=$build_dir/Build/Products" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/runner-tests.log"

      # The host app's NSLog lines go to the unified log, and a host app that
      # dies under a test leaves its stack only in a crash report.
      - name: Collect the app log
        if: failure()
        run: |
          log show --last 45m --style compact \
            --predicate 'process == "Mydia Player"' \
            > "$RUNNER_TEMP/mac-app.log" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -name 'Mydia Player*' -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
          ls -l "$RUNNER_TEMP/crash-reports"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-macos-native-logs
          path: |
            ${{ runner.temp }}/mac-app.log
            ${{ runner.temp }}/crash-reports
            ${{ runner.temp }}/runner-tests.log
            ${{ runner.temp }}/RunnerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  flatpak-validate:
    name: Flatpak / Validate metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # player/flatpak/test/ holds four script tests and nothing ran any of
      # them, which is how the publish.sh skeleton bug reached v0.13.1. This one
      # needs no packages beyond bash, so it runs first. The other three want
      # ostree, rclone, flatpak and gpg and are still manual.
      - name: Test the ostree skeleton repair
        run: ./player/flatpak/test/ensure-skeleton-test.sh
      - name: Test channel branding
        run: ./player/tool/test/apply-channel-test.sh

      - name: Test the AppImage pins
        run: ./player/appimage/test/pins-test.sh

      # Seconds, not minutes. Catches most manifest metadata mistakes long
      # before the full flatpak-build job below finishes compiling mpv.
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop entry
        run: desktop-file-validate player/flatpak/dev.mydia.player.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --explain player/flatpak/dev.mydia.player.metainfo.xml

      - name: Validate finish-args
        run: player/flatpak/test/finish-args-test.sh

  flatpak-build:
    name: Flatpak / Build
    runs-on: ubuntu-latest
    # mpv, libplacebo and libass account for roughly a third of this; the
    # Flutter build and its Rust cdylib account for the rest.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # appstream provides appstreamcli, which flatpak-builder shells out to
          # on the host during export. Without it the build fails at the very
          # last step, after everything has already compiled.
          sudo apt-get install -y flatpak flatpak-builder xvfb appstream

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts these through AppArmor, which breaks the
        # bubblewrap sandbox flatpak-builder needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub and install the runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=staged-repo --default-branch=stable \
            build-dir player/flatpak/dev.mydia.player.yml

      - name: Install and smoke test
        run: |
          flatpak remote-add --user --no-gpg-verify --if-not-exists \
            staged "$PWD/staged-repo"
          flatpak install --user -y --reinstall staged dev.mydia.player
          ./player/flatpak/smoke-test.sh stable
