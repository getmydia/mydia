name: CI / Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/ci-docs.yml'

concurrency:
  group: "ci-docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --project docs

      - name: Build documentation in strict mode
        run: uv run --project docs mkdocs build --strict

      - name: Check for em dashes in published prose
        run: |
          if grep -rn '—' docs/ --include='*.md' \
               --exclude-dir=plans --exclude-dir=brainstorms \
               --exclude-dir=research --exclude-dir=solutions \
               --exclude-dir=superpowers; then
            echo "::error::Em dashes found in published documentation."
            echo "Use commas, colons, or parentheses instead."
            exit 1
          fi
