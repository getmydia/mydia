name: CI / mydia-rs

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: mydia-rs

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.should.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'mydia-rs/**'
              - 'native/**'
              - '.github/workflows/ci-mydia-rs.yml'

      - name: Decide whether to run
        id: should
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mydia-rs/native/workflow changes; skipping Rust CI."
          fi

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mydia-rs

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-sqlite:
    name: Test / SQLite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      MYDIA_RS_TEST_DB: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mydia-rs

      - name: cargo test
        run: cargo test --workspace --all-targets

  test-postgres:
    name: Test / PostgreSQL
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      MYDIA_RS_TEST_DB: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mydia_rs_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydia_rs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mydia-rs

      - name: cargo test
        run: cargo test --workspace --all-targets

  # The `sqlx-prepare-check` job was retired in U19 of the SeaORM data
  # layer unification plan
  # (docs/plans/2026-05-24-001-refactor-seaorm-data-layer-unification-plan.md).
  # mydia-rs no longer ships any `sqlx::query!` / `query_as!` macros;
  # `schema-diff-check` below replaces it as the entities-vs-Phoenix
  # parity gate.

  schema-diff-check:
    name: Schema / Phoenix-vs-entities drift
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      # Connects to a Phoenix-migrated Postgres. The dev DB is created
      # by the standalone migration step below; the entities crate then
      # gets compared against information_schema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mydia_dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydia_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elixir / Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Cache Elixir deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Get Elixir deps
        run: mix deps.get

      - name: Apply Phoenix migrations
        env:
          MIX_ENV: dev
          MYDIA_DB_TYPE: postgres
          MYDIA_DB_URL: ${{ env.DATABASE_URL }}
        run: mix ecto.migrate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mydia-rs

      - name: Run schema-diff-check
        working-directory: mydia-rs
        run: cargo run -p mydia-rs-schema-diff

  docker-build:
    name: Docker build verify
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mydia-rs/Dockerfile
          platforms: linux/amd64
          push: false
          tags: mydia-rs:ci
          cache-from: type=gha,scope=mydia-rs-ci
          cache-to: type=gha,scope=mydia-rs-ci,mode=max

  mydia-rs-ci-status:
    name: mydia-rs CI Status
    runs-on: ubuntu-latest
    needs: [changes, lint, test-sqlite, test-postgres, schema-diff-check, docker-build]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Aggregate results
        run: |
          # When the path filter skipped work, every downstream job reports
          # "skipped" and we report green so required-status-check gating
          # doesn't sit Pending forever.
          if [ "${{ needs.changes.outputs.run }}" != "true" ]; then
            echo "Path filter skipped Rust CI; reporting green."
            exit 0
          fi
          fail=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test-sqlite:${{ needs.test-sqlite.result }}" \
            "test-postgres:${{ needs.test-postgres.result }}" \
            "schema-diff-check:${{ needs.schema-diff-check.result }}" \
            "docker-build:${{ needs.docker-build.result }}"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name reported $result"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All mydia-rs CI jobs passed."
