name: Deploy Web Player

on:
  push:
    branches: [master]
    paths:
      - "player/**"
      # player/rust/mydia_player_p2p depends on ../../native/mydia_p2p_core by
      # relative path. A core change alters the wasm bundle even when no
      # Flutter file moves, so it must trigger a redeploy on its own.
      - "native/mydia_p2p_core/**"
  workflow_dispatch:

concurrency:
  group: web-player
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The devenv/Cachix/Nix steps below are copied from the `rust` job in
      # ci.yml, which already builds native/mydia_p2p_core for
      # wasm32-unknown-unknown in CI. This build needs the same pinned Rust
      # toolchain, the same wasm32 target, and the same Flutter SDK devenv.nix
      # resolves from player/.fvmrc, none of which ci-player.yml provides,
      # since that workflow installs Flutter directly via subosito/flutter-action
      # and never enters a devenv shell.
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: mydia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv

      # Pinned to the same nixpkgs revision as ci.yml's devenv install, so this
      # workflow resolves the identical toolchain (Rust, Flutter, wasm-pack,
      # binaryen) that PRs already build and test against.
      - name: Install devenv
        run: nix profile install github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#devenv

      - name: Warm devenv environment
        run: |
          for attempt in 1 2 3; do
            if devenv shell -- true; then exit 0; fi
            echo "::warning::devenv shell attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::devenv environment failed to materialize after 3 attempts"
          exit 1

      # The generated Dart files (*.g.dart, *.freezed.dart, *.graphql.dart) are
      # gitignored, so a fresh checkout has neither them nor .dart_tool/. Both
      # steps below are how ci-player.yml gets a buildable tree; build_web.sh
      # itself assumes they already exist (true on a developer's worktree,
      # false on a first-time runner checkout) and does not run them.
      - name: Install Flutter dependencies
        run: devenv shell -- bash -c "cd player && flutter pub get"

      - name: Run code generation
        run: devenv shell -- bash -c "cd player && flutter pub run build_runner build"

      # build_web.sh asserts flutter_rust_bridge_codegen is 2.12.0 at
      # $CARGO_INSTALL_ROOT/bin before it does anything else, but nothing
      # installs that binary inside this shell: devenv.nix does not carry it
      # (only the .#android dev shell's shellHook does, for a different
      # workflow entirely), and $CARGO_INSTALL_ROOT is `.devenv/state/`, which
      # is per-checkout and empty on every fresh runner. The version is read
      # from the crate's own pin rather than restated, mirroring
      # nix/devShells/flake-module.nix's identical install-if-missing check.
      - name: Install flutter_rust_bridge_codegen
        run: |
          devenv shell -- bash <<'DEVENV'
          set -euo pipefail
          frb_version="$(sed -n 's/^flutter_rust_bridge = "=\(.*\)"$/\1/p' player/rust/mydia_player_p2p/Cargo.toml)"
          if [ -z "$frb_version" ]; then
            echo "ERROR: could not read the flutter_rust_bridge pin from player/rust/mydia_player_p2p/Cargo.toml" >&2
            exit 1
          fi
          if "$CARGO_INSTALL_ROOT/bin/flutter_rust_bridge_codegen" --version 2>/dev/null | grep -qF "$frb_version"; then
            echo "flutter_rust_bridge_codegen $frb_version already installed"
          else
            echo "Installing flutter_rust_bridge_codegen $frb_version..."
            cargo install flutter_rust_bridge_codegen --version "$frb_version" --locked --force
          fi
          DEVENV

      - name: Build
        run: devenv shell -- ./player/tool/build_web.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --branch pins what wrangler reports as the deploy's branch, instead of
      # relying on it auto-detecting the checkout (which actions/checkout only
      # gives a real local branch for on a branch push; workflow_dispatch has
      # no branch of its own to detect). This deploy is only ever "production"
      # if that value matches the Pages project's configured production
      # branch, which does NOT default to master on a new project (see the
      # human setup steps below), and a mismatch there still deploys
      # successfully to a preview URL with no failure anywhere in this job,
      # so getting the project setting right is what actually matters; this
      # flag only removes the auto-detection half of the risk.
      - name: Deploy
        run: npx wrangler pages deploy player/build/web --project-name=mydia-web --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
