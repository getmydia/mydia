name: CI Server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "player/lib/graphql/schema.graphql"
      - "priv/graphql/schema.graphql"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "player/lib/graphql/schema.graphql"
      - "priv/graphql/schema.graphql"
      - ".github/workflows/ci-server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml. Do not pass a toolchain here.
      - name: Install toolchain
        run: rustup show

      # minimal profile omits fmt/clippy; add them for the steps below.
      - name: Install fmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml --all
