name: CI Server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      # player/lib/graphql/schema.graphql is a symlink to priv/graphql/schema.graphql,
      # so it never fires on its own: GitHub Actions path filters match the
      # recorded path of the changed file, and editing the target leaves the
      # symlink's blob untouched. The priv/ entry below is the one doing the work.
      - "player/lib/graphql/schema.graphql"
      - "priv/graphql/schema.graphql"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "server/**"
      # See the push.paths comment above: this entry is inert for the same
      # symlink reason, and priv/graphql/schema.graphql is what actually triggers.
      - "player/lib/graphql/schema.graphql"
      - "priv/graphql/schema.graphql"
      - ".github/workflows/ci-server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml. Do not pass a toolchain here.
      - name: Install toolchain
        run: rustup show

      # minimal profile omits fmt/clippy; add them for the steps below.
      - name: Install fmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The playback tests synthesize their own media with ffmpeg rather than
      # committing binary fixtures, and probe remux output with ffprobe. Both
      # are runtime dependencies of the server itself, so a runner without them
      # cannot verify playback at all.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml --all
