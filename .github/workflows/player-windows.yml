name: Player / Windows

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        type: string
        required: true
      version:
        description: Version string
        type: string
        required: true
      version_code:
        description: Integer build number
        type: string
        required: true

permissions:
  contents: read

env:
  PLAYER_PATH: 'player'

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The prep action comes from this workflow's own commit, not from
      # inputs.sha: player-ios-refresh rebuilds an old release tag and
      # player-ondemand can build an old branch, neither of which has it.
      - name: Checkout CI actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Flutter prep
        uses: ./.ci-actions/.github/actions/player-flutter-prep
        with:
          version: ${{ inputs.version }}
          pubspec-version: ${{ inputs.version }}+${{ inputs.version_code }}

      - name: Build Windows
        working-directory: ${{ env.PLAYER_PATH }}
        run: flutter build windows --release --dart-define=MYDIA_CHANNEL=${{ env.MYDIA_CHANNEL }}

      # Must run before the installer is packaged: installer.iss globs the same
      # Release directory, so the DLLs are only in the shipped installer if they
      # are on disk by now. Without this every clean Windows machine fails to
      # launch with "msvcp140.dll was not found".
      - name: Bundle VC++ runtime
        shell: pwsh
        run: pwsh ${{ env.PLAYER_PATH }}/tool/bundle_windows_runtime.ps1

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: player/windows/installer.iss
          options: /DMyAppVersion=${{ inputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mydia-player-windows-installer
          path: ${{ env.PLAYER_PATH }}/build/installer/mydia-player-windows-v${{ inputs.version }}.exe
          retention-days: 30
