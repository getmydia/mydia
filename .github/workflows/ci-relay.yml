name: CI / Relay

# Builds the metadata-relay image, and publishes it from master. The relay's
# tests are the `relay-test` flake check in ci.yml (nix/ci/relay.nix), which
# needs no path filter; this workflow keeps one because it builds images,
# not checks.
on:
  push:
    branches:
      - master
    paths:
      - "metadata-relay/**"
      - ".github/workflows/ci-relay.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "metadata-relay/**"
      - ".github/workflows/ci-relay.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests only. On master, publish's build is the verification, so
  # a second identical build would add nothing.
  docker:
    name: Docker / Verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./metadata-relay/Dockerfile
          push: false
          tags: metadata-relay:ci-test
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/metadata-relay:buildcache

  # Publishes whether or not this push's relay-test passed: the image is the
  # :master tag, not a release (releases ship on a metadata-relay-v* tag).
  publish:
    name: Docker / Publish master
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./metadata-relay/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/metadata-relay:master
          # Layer cache is a registry tag on the same public package, not the
          # Actions cache (see .github/ci.md).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/metadata-relay:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/metadata-relay:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
