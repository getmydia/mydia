version: 2

# Version updates arrive once a month, one pull request per area rather than
# one per ecosystem, carrying minor and patch bumps only. Until September 2026
# this file ran thirteen weekly entries, which opened six to nine pull
# requests every Monday. On 2026-09-21 six were open at once, each parked by
# one of three things that are now handled elsewhere:
#
# - Derived files Dependabot does not regenerate (deps.nix, Cargo.lock files
#   sharing a path crate, npmDeps.hash). dependabot-fixup.yml regenerates them
#   on the branch.
# - Flaky checks unrelated to the change. The merge gate in
#   dependabot-auto-merge.yml re-runs failed Actions jobs once.
# - Majors that do not fit, such as vitest 5 against
#   @cloudflare/vitest-pool-workers' peer range. Ignored below; take majors
#   deliberately, by hand.
#
# Security updates are separate from all of this. They fire repository-wide
# whether or not an ecosystem is listed, open immediately, and are not held
# back by an `update-types` ignore or by `cooldown`, both of which apply to
# version updates only. A security fix that happens to be a major still
# arrives.
#
# Version updates matter even with security updates on. Without them a tree
# drifts until the advisory fix is a major bump the security updater cannot
# land cleanly. That is how 44 site alerts accumulated behind an Astro 5 tree
# in August 2026, and how relay-worker's vitest went from 2.1.9 straight to
# 5.0.0 in September.
#
# `cooldown` gives a release a week to be yanked, or for its peers to catch
# up, before it is proposed. Entries in a multi-ecosystem group need
# `patterns` and take their schedule from the group.

multi-ecosystem-groups:
  backend:
    schedule:
      interval: monthly
  relay:
    schedule:
      interval: monthly
  player:
    schedule:
      interval: monthly
  rust:
    schedule:
      interval: monthly
  tooling:
    schedule:
      interval: monthly

updates:
  # --- backend: the Phoenix app ---------------------------------------------
  #
  # Each dependency ignored by name here moves a pin in
  # nix/packages/flake-module.nix that nothing regenerates, and CI / Nix does
  # not build on pull requests, so a bump would pass its PR and break master.
  # Their version updates are ignored; bump them by hand, together with the pin.
  # Security updates still open, and the freshness check holds most of them:
  #
  #   fine       fineVersion and its sha256; arrives through lazy_html
  #   lazy_html  the lexbor override copies into a directory named after the
  #              commit lazy_html's Makefile expects
  #   wasmex     wasmexVersion and four per-platform NIF hashes
  #   heroicons  fetchFromGitHub rev and hash
  - package-ecosystem: mix
    directory: /
    multi-ecosystem-group: backend
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: fine
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: lazy_html
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: wasmex
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: heroicons
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    cooldown:
      default-days: 7

  # tailwindcss is pinned in lockstep across assets/package.json,
  # config/config.exs and tailwindVersion plus four binary hashes in
  # nix/packages/flake-module.nix.
  - package-ecosystem: npm
    directory: /assets
    multi-ecosystem-group: backend
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    cooldown:
      default-days: 7

  # --- relay: metadata-relay (Elixir) and relay-worker (Cloudflare Worker) ---
  #
  # Two different services despite the names. relay-worker had no entry here
  # until 2026-09-06, so nothing kept it current between advisories.
  - package-ecosystem: mix
    directory: /metadata-relay
    multi-ecosystem-group: relay
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /metadata-relay/assets
    multi-ecosystem-group: relay
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /relay-worker
    multi-ecosystem-group: relay
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # --- player: the Flutter app and everything that ships inside it ----------
  #
  # flutter_rust_bridge is pinned on both the Dart and the Rust side and the
  # generated bindings carry its version; the app aborts at startup when they
  # disagree. A bump needs flutter_rust_bridge_codegen, which nothing here
  # runs, so its version updates are ignored on both sides and it is bumped by hand.
  - package-ecosystem: pub
    directory: /player
    multi-ecosystem-group: player
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: flutter_rust_bridge
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /player/rust/mydia_player_p2p
    multi-ecosystem-group: player
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: flutter_rust_bridge
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    cooldown:
      default-days: 7

  - package-ecosystem: bundler
    directory: /player/ios
    multi-ecosystem-group: player
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: bundler
    directory: /player/android
    multi-ecosystem-group: player
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # --- rust: the server and the backend's native crates ---------------------
  #
  # server/ is a workspace, so one entry covers every crate under crates/.
  - package-ecosystem: cargo
    directory: /server
    multi-ecosystem-group: rust
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # Separate workspaces. Deliberately excluded, because updating them buys
  # nothing: native/mydia_plugin_sdk/examples/minimal is a documentation
  # example, and test/support/fixtures/plugins/{host_fns,host_test}_fixture
  # are test fixtures whose purpose is a pinned, reproducible build.
  # ci-security.yml still scans all three.
  - package-ecosystem: cargo
    directories:
      - /native/mydia_p2p
      - /native/mydia_p2p_core
      - /native/mydia_plugin_sdk
      - /plugins/simkl_sync
      - /plugins/webhook_notifier
    multi-ecosystem-group: rust
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # --- tooling: the marketing site and the docs site ------------------------
  - package-ecosystem: npm
    directory: /site
    multi-ecosystem-group: tooling
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /docs
    multi-ecosystem-group: tooling
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # --- actions ----------------------------------------------------------------
  #
  # Not in a multi-ecosystem group. The merge gate's GITHUB_TOKEN may not land
  # changes under .github/workflows/ (see .github/ci.md), so this pull request
  # is always merged by hand; grouped with site and docs it would take them
  # down with it. Majors stay on: action majors are mostly Node runtime bumps,
  # and CI runs every action it bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
