name: Set up devenv
description: >-
  Install Nix, Cachix and the pinned devenv CLI, restore the Mix caches, and
  materialize the devenv environment. Shared by every devenv job in ci.yml.

inputs:
  cachix-auth-token:
    description: CACHIX_AUTH_TOKEN. Composite actions cannot read secrets, so callers pass it.
    default: ''
  skip-push:
    description: "'true' to only read from Cachix (fork PRs)."
    default: 'true'
  elixir-caches:
    description: "'true' to restore and save deps/ and _build/."
    default: 'true'
  build-cache-prefix:
    description: Key family for the _build cache. Postgres keeps its own.
    default: build-v2-devenv
  cargo-cache:
    description: "'true' to restore and save native/*/target."
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    # Reads devenv's public cache (pre-built common packages, no auth) plus the
    # project cache; pushes the project's own derivations only on same-repo
    # events, so fork PRs never receive or use the token (KTD1).
    - name: Setup Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: mydia
        authToken: ${{ inputs.cachix-auth-token }}
        extraPullNames: devenv
        skipPush: ${{ inputs.skip-push }}

    # Pin the devenv CLI to the SAME nixpkgs the repo locks (KTD6); rev mirrors
    # devenv.lock's nixpkgs node — bump both together.
    - name: Install devenv
      shell: bash
      run: nix profile install github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#devenv

    # patches/** is in the deps and build keys because `mix deps.get`
    # patches deps/ in place (deps.patch in mix.exs) and rebuilds what it
    # patched. Without it a pre-patch deps/ cache is restored and re-patched
    # on every run, and a pre-patch _build keeps the unpatched Exqlite NIF,
    # which test/mydia/repo/exqlite_patch_test.exs then fails on.
    - name: Cache dependencies
      if: inputs.elixir-caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-deps-devenv-${{ hashFiles('**/mix.lock', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-deps-devenv-

    # Jobs that share a build-cache-prefix share this key, so the Dialyzer job
    # restores the _build/test and priv/native the Test job saved.
    - name: Cache build
      if: inputs.elixir-caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # priv/native travels with _build, not separately. Rustler writes the
        # NIF to priv/native (gitignored) and records "built" in a manifest
        # under _build. Caching only _build restores the manifest without the
        # .so, so `mix compile` skips the crate and every caller then fails
        # with "module Mydia.P2p is not available", which points nowhere near
        # the cache.
        path: |
          _build
          priv/native
        # The native hash is part of the key AND the restore prefix. _build
        # holds the compiled Rustler NIF, so restoring a tree built from
        # different Rust sources yields a stale .so. When that .so lacks a
        # newly added export the whole module fails to load, and every caller
        # reports "module Mydia.P2p is not available" rather than anything
        # pointing at the cache.
        key: ${{ runner.os }}-${{ inputs.build-cache-prefix }}-${{ hashFiles('**/mix.lock', 'patches/**') }}-${{ hashFiles('native/**/*.rs', 'native/**/Cargo.toml', 'native/**/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('lib/**/*.ex', 'test/**/*.exs') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.build-cache-prefix }}-${{ hashFiles('**/mix.lock', 'patches/**') }}-${{ hashFiles('native/**/*.rs', 'native/**/Cargo.toml', 'native/**/Cargo.lock', 'rust-toolchain.toml') }}-

    # Materialize the devenv toolchain with a retry BEFORE the test step. Nix
    # evaluation can transiently fail with "path '…/test-timeout.patch' is not
    # valid" when a substituted nixpkgs source (e.g. ffmpeg's libopus) lands
    # incompletely from the binary cache. Isolating the env build here means a
    # single flaky substitution is retried cheaply, and the real test step runs
    # against an already-warm store without retries masking genuine failures.
    # The E2E job hit the libopus "path is not valid" flake most often.
    - name: Warm devenv environment
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if devenv shell -- true; then exit 0; fi
          echo "::warning::devenv shell attempt $attempt failed"
          [ "$attempt" -lt 3 ] && sleep 15
        done
        echo "::error::devenv environment failed to materialize after 3 attempts"
        exit 1
