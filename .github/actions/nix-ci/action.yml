name: Nix CI
description: >-
  Free runner disk, install Nix pointed at cache.mydia.dev, and install niks3.
  Push built outputs afterwards with push.sh in this directory.

inputs:
  push:
    description: "'true' to install niks3 so the job can push to the cache."
    default: 'true'
  pin:
    description: >-
      Pin name exported to later steps as NIKS3_PIN. Honoured only when the
      run's ref is refs/heads/master; on any other ref (every PR) it is
      cleared, whatever the caller passes. Empty means no pin.
    default: ''
  free-disk:
    description: >-
      'true' to delete preinstalled SDKs and move the store to /mnt. Jobs that
      only evaluate (the planner) pass 'false' to save the minute it costs.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        docker image prune --all --force || true

        # x64 runners carry a second, otherwise unused disk at /mnt, so the
        # store goes there. This must run before install-nix-action creates /nix.
        if mountpoint -q /mnt; then
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h /nix
        fi
        df -h /

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-substituters = https://cache.mydia.dev https://devenv.cachix.org
          extra-trusted-public-keys = cache.mydia.dev-1:5zkoQR4Gcrx1EEQ1GvHRPQ7EoHm8gNrrVoeAqX3ioFg= devenv.cachix.org-1:w1cLUi8dvvhaXAsEqJBf2jvG3lOivBMXrVa1V2iupGM=
          max-jobs = auto

    - name: Install niks3
      if: inputs.push == 'true'
      shell: bash
      # niks3 v1.19.0, pinned to its commit (tags can move).
      run: nix profile install github:Mic92/niks3/3a0b84e4f909726de179b9f210e1ed1e56767b2e

    - name: Export push settings
      shell: bash
      env:
        PIN_INPUT: ${{ inputs.pin }}
        REF: ${{ github.ref }}
      run: |
        pin=""
        if [ "$REF" = "refs/heads/master" ]; then
          pin="$PIN_INPUT"
        fi
        echo "NIKS3_PIN=$pin" >> "$GITHUB_ENV"
        echo "NIX_CI_PUSH=${{ github.action_path }}/push.sh" >> "$GITHUB_ENV"
