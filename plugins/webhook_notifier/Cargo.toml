[package]
name = "webhook_notifier"
version = "1.0.0"
edition = "2021"
description = "Mydia bundled webhook/Discord notifier plugin (WASM guest)"
publish = false

[lib]
crate-type = ["cdylib"]

# The SDK provides the #[mydia::plugin] macro and the typed WIT host bindings.
# tinyjson stays as the plugin's internal JSON tool: the templated "custom"
# target renders over the arbitrary event metadata bag, which is carried across
# the typed boundary as a JSON string.
[dependencies]
mydia-plugin-sdk = { path = "../../native/mydia_plugin_sdk" }
tinyjson = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

# Copied from rust-lints.toml; scripts/check-rust-lints.sh keeps it in sync.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we opt out of.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Panic-free non-test code.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Hygiene.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
